<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mood bench</title>
  <style>
    *,
    ::before,
    ::after {
      box-sizing: border-box
    }

    :root {
      color-scheme: light dark;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    :root[data-theme=light] {
      color-scheme: light
    }

    /* the page viewer can set data-theme */
    :root[data-theme=dark] {
      color-scheme: dark
    }

    body {
      font-family: system-ui, sans-serif;
      max-width: 1040px;
      margin: 0 auto;
      padding: 12px
    }

    canvas {
      width: 100%;
      display: block
    }

    #timeline {
      height: 280px
    }

    #moodPlane {
      aspect-ratio: 1;
      max-width: 300px;
      margin: auto
    }

    .gauge {
      height: 44px;
      max-width: 300px;
      margin: auto
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 8px 20px
    }

    .eventGrid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px
    }

    /* recent events list under the timeline */
    #eventLog {
      margin-top: 4px
    }

    .evRow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 3px 0;
      flex-wrap: wrap
    }

    .evNum {
      display: inline-block;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      color: #fff;
      font-size: .78em;
      font-weight: 600;
      text-align: center
    }

    .evTime {
      font-size: .82em;
      opacity: .7;
      font-variant-numeric: tabular-nums
    }

    .evChip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 8px;
      color: #fff;
      font-size: .78em;
      line-height: 1.45;
      white-space: nowrap
    }

    @media(max-width:700px) {
      .evChip {
        font-size: .72em;
        padding: 1px 5px
      }
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      gap: 16px
    }

    .timelineRow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px
    }

    /* chart | variable panel */
    #side {
      width: 230px
    }

    #side[hidden] {
      display: none
    }

    @media(max-width:700px) {
      .timelineRow {
        grid-template-columns: 1fr
      }

      #side {
        width: auto
      }
    }

    details details {
      margin-left: 1em
    }

    /* parameter branches + event groups: matching bordered-box look */
    #params>details,
    #events>fieldset {
      margin: 6px 0;
      padding: 6px 12px;
      border: 1px solid rgba(127, 127, 127, .4);
      border-radius: 4px
    }

    #params>details>summary {
      font-weight: 600;
      margin: 0 0 4px
    }

    #events>fieldset>legend {
      font-weight: 600;
      padding: 0 4px
    }

    /* references modal */
    #refsModal[hidden] {
      display: none
    }

    #refsBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow: auto;
      z-index: 50
    }

    #refsPanel {
      background: Canvas;
      color: CanvasText;
      border: 1px solid CanvasText;
      border-radius: 8px;
      max-width: 720px;
      width: 100%;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3)
    }

    #refsPanel h2 {
      margin: 0 0 4px
    }

    #refsPanel .ref {
      margin: 14px 0;
      padding-left: 14px;
      border-left: 2px solid currentColor;
      opacity: .92
    }

    #refsPanel .ref cite {
      font-style: italic
    }

    #refsPanel .ref .where {
      font-size: .9em;
      opacity: .7;
      margin-top: 4px
    }

    #refsPanel .ref .desc {
      margin-top: 4px
    }

    #refsPanel .refTopic {
      margin: 24px 0 6px;
      font-size: .78em;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .75;
      border-bottom: 1px solid currentColor;
      padding-bottom: 4px
    }

    #refsPanel .refTopic:first-child {
      margin-top: 8px
    }

    #refsClose {
      float: right;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 4px
    }

    #refsClose:hover {
      background: rgba(127, 127, 127, .2)
    }

    #refsPanel ul {
      margin: 8px 0 0;
      padding-left: 20px
    }

    #refsPanel li {
      margin: 4px 0
    }

    /* custom event composer */
    #customButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    #customButtons button {
      padding: 6px 14px;
      cursor: pointer;
      border: 1.5px dashed;
      /* colour set inline per dim — distinct from the solid preset event buttons */
      background: rgba(127, 127, 127, .08);
      border-radius: 4px;
      font-weight: 500;
    }

    #customButtons button:hover {
      background: rgba(127, 127, 127, .2)
    }

    #customQueue {
      min-height: 1.5em
    }

    .queueItem {
      margin: 2px 0;
      padding: 6px 8px;
      background: rgba(127, 127, 127, .12);
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: .9em
    }

    .queueItem label {
      display: flex;
      align-items: center;
      gap: 4px
    }

    .queueItem input[type=range] {
      width: 80px;
      vertical-align: middle
    }

    .queueItem .life {
      opacity: .6;
      font-size: .85em
    }

    .rmCustom {
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 6px
    }

    .rmCustom:hover {
      background: rgba(127, 127, 127, .25)
    }

    /* surrounding panel */
    #surroundingList {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      min-height: 1.5em
    }

    .surrItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(127, 127, 127, .12);
      border-radius: 3px;
      font-size: .85em
    }

    .surrItem svg {
      flex-shrink: 0
    }

    .surrItem .ttl {
      opacity: .6;
      margin-left: auto;
      padding-left: 8px
    }

    .surrItem .type {
      opacity: .5;
      font-size: .85em
    }

    /* memory panel */
    #memoryList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
      gap: 4px;
      margin-top: 6px;
      min-height: 1.5em
    }

    .memItem {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: rgba(127, 127, 127, .12);
      border-radius: 3px;
      font-size: .85em;
      flex-wrap: wrap
    }

    .memItem .memVal {
      font-weight: 600;
      min-width: 36px;
      text-align: right
    }

    .memItem .memConf {
      opacity: .7;
      min-width: 42px
    }

    .memItem .memCount {
      opacity: .5;
      margin-left: auto
    }

    /* bestiary panel (grouped by category) */
    #bestiary {
      margin-top: 6px
    }

    /* per-archetype spawn-rate config (inline, toggled by the gear button in each bestiary item) */
    .archCfg {
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
      vertical-align: middle;
      cursor: pointer;
    }
    .bestCfg {
      margin-top: 4px;
    }
    .bestCfg table {
      border-collapse: collapse;
      font-size: 11px;
      width: 100%;
    }
    .bestCfg td {
      padding: 1px 2px;
      white-space: nowrap;
    }
    .bestCfg td:first-child {
      text-align: right;
      opacity: .6;
      width: 1%;
    }
    .bestCfg input[type=number] {
      width: 64px;
      padding: 0 1px;
      font-size: 11px;
      text-align: right;
    }

    /* random-event chances (compact table, mirrors .bestCfg styling) */
    #randomCfg table {
      border-collapse: collapse;
      font-size: 11px;
    }
    #randomCfg td {
      padding: 1px 2px;
      white-space: nowrap;
    }
    #randomCfg td:first-child {
      text-align: right;
      opacity: .6;
      width: 1%;
    }
    #randomCfg input[type=number] {
      width: 64px;
      padding: 0 1px;
      font-size: 11px;
      text-align: right;
    }
    #randomCfg .randTrigger {
      padding: 0 4px;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
    }

    .bestCat {
      font-size: .8em;
      font-weight: 600;
      text-transform: uppercase;
      opacity: .6;
      margin: 8px 0 2px
    }

    .bestCatGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr));
      gap: 4px;
      margin-bottom: 4px
    }

    .bestItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(127, 127, 127, .12);
      border-radius: 3px;
      font-size: .85em;
      flex-wrap: wrap
    }

    .bestItem b {
      text-transform: capitalize
    }

    .bestItem small {
      opacity: .6
    }

    .spawnArch {
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 5px;
      margin-left: auto
    }

    .spawnArch:hover {
      background: rgba(127, 127, 127, .25)
    }

    /* archetype editor modal + custom event editor modal (shared styles via comma-separated selectors) */
    #archModal[hidden],
    #custEventModal[hidden] {
      display: none
    }

    #archBackdrop,
    #custEventBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow: auto;
      z-index: 50
    }

    #archPanel,
    #custEventPanel {
      background: Canvas;
      color: CanvasText;
      border: 1px solid CanvasText;
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3)
    }

    #archPanel h2,
    #custEventPanel h2 {
      margin: 0 0 8px
    }

    #archClose,
    #custEventClose {
      float: right;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 4px
    }

    #archClose:hover,
    #custEventClose:hover {
      background: rgba(127, 127, 127, .2)
    }

    #archForm label,
    #custEventForm label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: .85em
    }

    #archForm input,
    #archForm select,
    #custEventForm input,
    #custEventForm select {
      flex: 1;
      font-size: .9em;
      padding: 3px 4px;
      min-width: 60px
    }
  </style>
</head>

<body>
  <header>
    <button id="refs" style="float:right;margin-left:6px" aria-label="References / Prameny"
      title="References / Prameny">📑</button>
    <button id="lang" style="float:right" aria-label="Language / Jazyk" title="Language / Jazyk">🌐</button>
    <h1 data-t="title"></h1>
    <p><button id="pause"></button> <button id="reset" data-t="reset"></button></p>
  </header>

  <section>
    <p style="text-align:right;margin:0"><button id="sidebtn" data-a="vars" aria-expanded="true">◧</button></p>
    <div class="timelineRow">
      <div>
        <canvas id="timeline" role="img"></canvas>
        <b data-t="logh"></b>
        <div id="eventLog"></div>
      </div>
      <div id="side">
        <b data-t="varh"></b><br>
        <div id="variableList"></div>
        <small id="behaviourLegend"></small>
      </div>
    </div>
  </section>

  <div class="columns">
    <section>
      <h2 data-t="worldh"></h2>
      <b id="clockText" style="font-size:32px"></b> <small id="sleepDebt"></small>
      <canvas id="gaugeLight" class="gauge" role="img" data-a="litg"></canvas>
      <canvas id="gaugeSleep" class="gauge" role="img" data-a="slpg"></canvas>
      <canvas id="gaugeTemp" class="gauge" role="img" data-a="tempg"></canvas>
      <div id="surroundingList"></div>
      <details>
        <summary data-t="memh"></summary>
        <div id="memoryList"></div>
      </details>
      <details>
        <summary data-t="besth"></summary>
        <p><button id="openArchEditor" data-t="archAdd"></button></p>
        <div id="bestiary"></div>
      </details>
    </section>
    <section>
      <canvas id="moodPlane" role="img" data-a="plane"></canvas>
      <h2 id="moodLabel" style="text-align:center;margin:4px"></h2>
      <h3 id="behaviourLabel" style="text-align:center;margin:4px"></h3>
      <p id="status" aria-live="polite" style="text-align:center;margin:4px"></p>
      <canvas id="gaugeDominance" class="gauge" role="img" data-a="domg"></canvas>
      <canvas id="gaugeHunger" class="gauge" role="img" data-a="hung"></canvas>
      <canvas id="gaugeHydration" class="gauge" role="img" data-a="hydg"></canvas>
      <canvas id="gaugeHealth" class="gauge" role="img" data-a="hltg"></canvas>
    </section>
  </div>

  <details>
    <summary><b data-t="evh"></b></summary>
    <fieldset>
      <legend data-t="cust"></legend>
      <div id="customButtons"></div>
      <div id="customQueue"></div>
    </fieldset>
    <p><button id="fireCustom" data-t="fire"></button> <button id="clearCustom" data-t="custClear"></button> <button
        id="randomEvent" data-t="rand"></button></p>
      <p><button id="openCustEventEditor" data-t="custEventAdd"></button></p>
      <details>
        <summary data-t="randCfg"></summary>
        <div id="randomCfg"></div>
      </details>
      <div id="events"></div>
  </details>

  <details>
    <summary><b data-t="parh"></b></summary>
    <div id="params"></div>
  </details>

  <div id="refsModal" hidden>
    <div id="refsBackdrop" onclick="if(event.target===this)$('#refsModal').hidden=true">
      <div id="refsPanel">
        <button id="refsClose" onclick="$('#refsModal').hidden=true" aria-label="Close">×</button>
        <h2 data-t="refsh"></h2>
        <p data-t="refsi"></p>
        <div id="refsList"></div>
      </div>
    </div>
  </div>

    <div id="custEventModal" hidden>
    <div id="custEventBackdrop" onclick="if(event.target===this)$('#custEventModal').hidden=true">
      <div id="custEventPanel">
        <button id="custEventClose" onclick="$('#custEventModal').hidden=true" aria-label="Close">×</button>
        <h2 data-t="custEventh"></h2>
        <p><small data-t="custEventDesc"></small></p>
        <div id="custEventForm" class="grid"></div>
        <p><button id="custEventCreate" data-t="custEventCreate"></button></p>
      </div>
    </div>
  </div>

  <div id="archModal" hidden>
    <div id="archBackdrop" onclick="if(event.target===this)$('#archModal').hidden=true">
      <div id="archPanel">
        <button id="archClose" onclick="$('#archModal').hidden=true" aria-label="Close">×</button>
        <h2 data-t="archAdd"></h2>
        <div id="archForm" class="grid"></div>
        <p><button id="archCreate" data-t="archCreate"></button></p>
      </div>
    </div>
  </div>



  <script>
    /* ═══════════════════════════════════════════════════════════════════
       Mood bench — a live simulation of mood (valence / arousal / dominance),
       needs (hunger, thirst, health), a two-process sleep model, a behaviour
       state machine, and a learning memory system.
    
       ═══ Table of Contents ═══
       Numbers below correspond to the section-banner comments in the source, in order of appearance.
       Letters under #13 correspond to sub-section banners within One simulation tick.
    
        1. Small helpers              ($, clamp, clamp01, wrap24, setText)
        2. Translations               (T, lang, t)
        3. Parameters                  (CONFIG, P, WORLD_DEFAULTS, getParam, setParam, SLIDERS)
        4. Constants (non-sliders)    (DT, UP, HOME, K)
        5. Events                     (RAW, EXTRA, EVENTS, SHAPE, EVENT_BY_KEY, EV, TEMP)
        6. Random events              (RANDOM)
        7. Behaviour state machine    (reckless, curiosity, ST, APPROACH_TICKS,
                                        lastPreviewedKey, stepApproach, previewPulse, decide)
        8. Body clock & light         (daylight, bodyClock)
        9. Simulation state           (S, W, behaviour, H, N, M, Q, LOG, evSeq, PULSES, MARKS)
       10. Custom events persistence  (CUSTOM_EVENTS, CUSTOM_EVENTS_KEY, loadCustomEvents,
                                        saveCustomEvents, run, circOn, clock, customQueue)
       11. Surrounding objects        (nextObjectId, SURR_FEATURES, SURR_COLOR_HEX, SURR_SIZE_PX,
                                        ARCHETYPES, objectSvg,
                                        randomFeatures,
                                        spawnObject, stepSurrounding, renderSurrounding)
       12. Memory & learning          (memory, featureKey, INNATE_MEMORY, seedMemory, eyes,
                                        learnFromEvent, renderBestiary, buildArchForm,
                                        buildCustEventForm, renderMemory, init, startSleep, wake)
                                        — note: init / startSleep / wake live HERE (not in #13),
                                        because init() calls seedMemory(), which is defined
                                        just above. The Simulation state section only declares
                                        the variables; init() that resets them is here.
       13. One simulation tick         (tick)
             Sub-sections (the dash-banner comments inside the tick):
               a. Mood       (decayMood, applyBehaviour, pulsesOf, needMult, pulseValue,
                              pulseSum, feel, fireEvents, clampMood, moveBaseline)
               b. Needs      (applyNeeds, applyHealth)
               c. World      (deriveWorld, stepWorld)
               d. Sleep      (stepBodyClock, stepSleepPressure, stepSleepWake)
               e. Behaviour  (chooseBehaviour, chooseRandomEvents, record)
       14. Drawing                    (COL, GC, SER, SHOW, BASE_KEY, STRETCH, INK, fit,
                                        drawTimeline, drawMoodPlane, gauge, lastLogKey, readout)
       15. Main loop                  (last, frame)
       16. UI                         (sign, fmt, clockLabel, evName, eventLabel, glyph,
                                        addSlider, sync, addGroup, addBranch, buildText,
                                        buildVariablePanel, buildParameterTree,
                                        buildCustomEventComposer, buildEventGrid, build,
                                        TICK_REAL_S, TICK_SIM_MIN, PULSE_LIFE, fmtLife,
                                        renderCustomQueue, + onclick handlers for
                                        fireCustom / clearCustom / randomEvent / pause /
                                        reset / sidebtn / lang / timeline-hover)
       17. References modal           (renderRefs, + onclick handlers for refs / arch /
                                        custEvent modals + archCreate + custEventCreate
                                        + Escape key handler)
    
       Architecture (layered):
       - Layer 1: Body feelings (innate, interoceptive) — hunger, cold, sleep debt, pain, eating
       - Layer 2: Per-source unwell baseline shift (shared, in moveBaseline()) — K.unwellValence / K.unwellLethargy / K.unwellDominance pull baseline VAD down with sleep debt, sickness, and low HP (negative shift + lethargy + low reactive dominance)
       - Layer 3: Asymmetric anhedonia damper (sleep-debt only, in fireEvents()/previewPulse()) — K.sleepDebtAnhedonia shrinks only positive-valence pulses (scaled by s.dep); negative pulses pass unscaled. Physiological hyperarousal is NOT a tonic-arousal target here — it surfaces only as this asymmetric damper.
       - Surrounding objects — per-archetype spawn rates, despawn, features, TTL
       - Memory & learning — Rescorla-Wagner, feature → expected valence
    ═════════════════════════════════════════════════════════════════ */

    /* ============ Small helpers ============ */
    // $ = "find the first element matching this CSS selector"
    const $ = s => document.querySelector(s);
    // clamp = keep a number inside -1..1 so moods cannot run away. clamp01 = same, but 0..1.
    const clamp = x => Math.max(-1, Math.min(1, x));
    const clamp01 = x => Math.max(0, Math.min(1, x));
    // wrap24 = fold any number of hours into 0..24
    const wrap24 = x => ((x % 24) + 24) % 24;
    // setText = change an element's text only if it differs, so screen readers do not re-announce the same line every frame
    const setText = (sel, txt) => { const el = $(sel); if (el.textContent !== txt) el.textContent = txt; };

    /* ============ Translations ============ */
    // T = all visible text. English first, Czech second. t (below) = the active language.
    // English event names are made from the event key (predator_attack -> "Predator attack"), so only exceptions are listed.
    const T = {
      en: {
        title: 'Mood bench',
        val: 'Valence', aro: 'Arousal', dom: 'Dominance', hun: 'Hunger meter', hyd: 'Hydration meter', hlt: 'Health', slp: 'Sleep pressure', base: 'base',
        varh: 'Variables', vars: 'Show or hide the variable panel', logh: 'Recent events', logEmpty: 'No events yet.',
        note: 'Dashed = baseline. Numbered tags on the chart are color-coded by event group (red = threat, orange = food, pink = social, slate = env, brown = body, purple = sleep) — hover one for the event names. Top strip = behaviour. Arousal includes the body-clock offset. Boxes choose which lines to draw.',
        worldh: 'Environment', evh: 'All events', parh: 'Parameters', cust: 'Custom event',
        wopt: 'Clock, light and rhythm', temph: 'Temperament',
        surrEmpty: 'Nothing in view.',
        memh: 'Memory', memEmpty: 'No memories yet.',
        besth: 'Object types',
        archName: 'name', archAdd: 'Add type', archCreate: 'Create',
        spawnh: 'Spawn rates', ageh: 'Despawn', spawnTip: 'Spawn rates (encounters per sim-hour) and despawn rate for this archetype. Edit live — changes apply immediately.',
        spawnCellTip: 'Encounters per sim-hour while in this state. 0 = never spawns. (1 sim-hour = 20 ticks.)',
        ageCellTip: 'Despawn rate: how fast this object ages per tick. 1 = normal. Higher = vanishes faster. Flee/approach overrides still apply on top.',
        randCfg: 'Random event rates', randChanceTip: 'Chance per sim-hour for this event to fire (0 = never). The global rate slider multiplies all of these. (1 sim-hour = 20 ticks.)',
        randTriggerTip: 'Fire this event now (bypasses the chance roll and the when-gate).',
        archSize: 'Size', archColor: 'Color', archShape: 'Shape', archUT: 'Outcome',
        custEventh: 'Save custom event', custEventAdd: 'Add event', custEventCreate: 'Create', custEventDesc: 'Build a repeatable event button. The v/a/d impacts shape the default pulses (via SHAPE); HP / food / water are optional side effects. Saved events appear in the "Custom events" group below the regular buttons and persist across page reloads.',

      // like the `need` push in applyNeeds — not a pull-toward-target. unwell = s.dep + (s.ill?1:0) + (1-s.hp), range 0..3.
      unwellValence: .003,    // baseline valence drop per tick per unit of unwellness
      unwellLethargy: .0015,  // baseline arousal drop per tick per unit of unwellness (lethargy)
      unwellDominance: .002,  // baseline dominance drop per tick per unit of unwellness (low reactive dominance)
      sleepDebtAnhedonia: .4  // sleep-debt-specific: positive valence pulses shrink by up to this fraction at full sleep debt (Motomura 2013)
    };

    /* ============ Events ============ */
    // Each row: [group, key, valence impact, arousal impact, dominance impact].
    // Impact on the mood = impact x salience, where salience is CALCULATED dynamically in fireEvents (max of |impacts|, or max of |pulse amps| for events with custom pulses) — no longer hardcoded per event.
    // (The rustle row's impacts are ignored: it is "ambiguous", see EXTRA.)
    const RAW = [
      ['threat', 'predator_attack', -1, 1, -1],
      ['food', 'ate_food', .7, -.2, .3],
      ['social', 'social_win', .4, .5, .7], ['social', 'social_loss', -.4, .3, -.7],
      ['social', 'grooming_contact', .4, -.3, .1],
      ['env', 'loud_noise', -.3, .7, -.2], ['env', 'new_territory', .2, .6, .1], ['env', 'rustle', 0, 0, 0],
      ['body', 'pain', -.8, .6, -.3], ['body', 'illness_onset', -.5, -.4, -.3], ['body', 'recovery', .4, .2, .2], ['body', 'drank_water', .3, -.1, .1],
      ['sleep', 'fell_asleep', .2, -.8, .1], ['sleep', 'woke_up', .1, .5, .1], ['sleep', 'sleep_interrupted', -.4, .6, -.2]
    ];
    // EXTRA = optional extra fields per event, kept as data next to the table above:
    //   amb = ambiguous: impact comes from the baseline mood (Mendl et al. 2010, Table 1).
    //   food / water = how much of the hunger / hydration meter it refills.   hp = health change.
    //   pulses = a list of {dim, amp, tau} that replaces the default pulses made from the impacts (see SHAPE below).
    //   act(w, s) = what the event does to the world w or the agent s. Manual clicks and random rows both run it.
    const EXTRA = {
      rustle: { amb: true, hide: true },   // hidden from grid. Textbook ambiguous stimulus (Mendl 2010 Table 1) — manual/custom only.
      ate_food: {
        food: .6,                    // refills hunger × P.foodQuality on fire
        pulses: [{ dim: 'v', amp: .7, tau: 5 }, { dim: 'v', amp: .2, tau: 200 }, { dim: 'a', amp: -.2, tau: 10 }, { dim: 'd', amp: .3, tau: 50 }]
      },   // a joy spike, a long satisfied tail, a quick calm-down
      drank_water: { water: .6 },
      predator_attack: {
        hp: -.3,                    // the actual encounter — US for TYPE_TO_US.predator on approach.
        pulses: [{ dim: 'v', amp: -1, tau: 5 }, { dim: 'v', amp: -.25, tau: 500 }, { dim: 'a', amp: 1, tau: 10 }, { dim: 'a', amp: .2, tau: 200 }, { dim: 'd', amp: -1, tau: 30 }, { dim: 'd', amp: -.3, tau: 400 }]
      },   // a sharp jolt, then fear that lingers for minutes
      pain: { hp: -.2 },
      illness_onset: { hp: -.1, act: (w, s) => { s.ill = true; } },
      recovery: { hp: .1, act: (w, s) => { s.ill = false; } }
    };
    const EVENTS = RAW.map(([g, k, v, a, d]) => ({ g, k, v, a, d, ...EXTRA[k] }));   // g group, k key, v/a/d impacts. Salience is calculated dynamically in fireEvents (max of |v|/|a|/|d|, or max of |pulse amps| if the event has custom pulses).
    // SHAPE = the default pulses for an event without its own `pulses`, built from its v / a / d impacts.
    // Each dimension is a list of [share of the impact, tau in ticks]. Valence = a quick spike plus a slow tail; arousal fades fastest; dominance in between.
    const SHAPE = { v: [[.6, 8], [.4, 150]], a: [[1, 15]], d: [[1, 60]] };
    const EVENT_BY_KEY = Object.fromEntries(EVENTS.map(e => [e.k, e]));                  // look an event up by its key

    // EV = frozen map of event-key -> event-key string. Use EV.predator_attack (not the
    // string literal 'predator_attack') everywhere outside RAW / EVENTS / EXTRA (which are
    // the source-of-truth definitions and can't be "wrong" by construction). EV gives:
    //   (a) editor autocomplete — typing EV. shows the list of available event keys,
    //   (b) refactor support — rename in RAW and your IDE flags every reference,
    //   (c) discoverability — one place to see all event keys at a glance.
    // Caveat: in plain JS (no TypeScript / no checkJs), EV.predator_atkkack is still
    // `undefined` at runtime, same as the string-literal typo. The protection is editor-time
    // only; pair with checkJs / JSDoc-typed EV for static analysis.
    const EV = Object.freeze(Object.fromEntries(EVENTS.map(e => [e.k, e.k])));

    // (TYPE_TO_US removed — each ARCHETYPES entry now carries its own `events: [EV.xxx]` array,
    //  so stepApproach reads target.events directly. No more type→events indirection.)

    // Temperament: set by YOU, never changed by the simulation. Boldness + exploration are read by the curiosity/neophobia
    // formulas in decide() and ST.approach_object (via the curiosity() helper below). Activity / aggressiveness / sociability
    // are passed to rules as c.temperament but not read yet — reserved for future scaling of behaviour weights.
    // Axes after Réale et al. 2007, each 0..1 with 0.5 in the middle.
    const TEMP = { boldness: .5, exploration: .5, activity: .5, aggressiveness: .5, sociability: .5 };

    /* ============ Random events ============ */
    // Things that can happen by themselves. To add one, add a row:
    //   id     = a name for you
    //   event  = key of the event to fire (see RAW). Optional: a row can change the world without firing anything
    //   chance = probability per tick (10 ticks a second at speed 1), multiplied by the "random event rate" slider
    //   hp     = optional: true multiplies the chance by the agent's health (sick agents are worse at finding and winning)
    //   when   = the dependencies: a function of c that must be true. c.world = the environment, everything else = the agent
    //   act    = optional: act(w, s) changes the world w or the agent s when the row triggers (the fired event's own act runs too)
    const RANDOM = [
      // Food, water, and predators spawn as surrounding objects (rates on each archetype's .spawns); US events fire via archetype.events on approach.
      // social
      { id: 'conspecific_arrives', chance: .006, when: c => c.world.conspecifics === 0 && !c.asleep, act: w => { w.conspecifics = 1; } },
      { id: 'conspecific_leaves', chance: .008, when: c => c.world.conspecifics > 0, act: w => { w.conspecifics--; } },
      { id: 'social_win', event: EV.social_win, chance: .007, hp: true, when: c => c.state === 'socialising' && c.world.conspecifics > 0 },
      { id: 'social_loss', event: EV.social_loss, chance: .010, when: c => c.state === 'socialising' && c.world.conspecifics > 0 },
      { id: 'grooming', event: EV.grooming_contact, chance: .004, when: c => c.state === 'idle' && c.world.conspecifics > 0 },
      // body (illness: see applyHealth for the full list of places it lives)
      { id: 'illness', event: EV.illness_onset, chance: .001, when: c => !c.asleep && !c.ill },
      { id: 'recover', event: EV.recovery, chance: .004, when: c => c.ill },
      // environment
      { id: 'new_territory', event: EV.new_territory, chance: .005, when: c => c.state === 'explore' },
      // loud noise: awake, it is just a noise. Asleep, it only registers (the mood hit) if it also wakes the sleeper.
      { id: 'loud_noise', event: EV.loud_noise, chance: .002, when: c => !c.asleep },
      { id: 'noise_wakes', event: EV.loud_noise, chance: .0006, when: c => c.asleep, act: () => wake(false) },
      { id: 'noise_stirs', chance: .0014, when: c => c.asleep, act: (w, s) => { s.a += .15; } }   // the other 70% of noises that reach a sleeper: it stirs (arousal bump) but sleeps on
    ];

    /* ============ Behaviour state machine ============ */
    // To add a behaviour, add one entry. Fields (all optional except col):
    //   col = chart colour. hunger = multiplier on hunger AND thirst loss (1 if missing). impact = multiplier on how hard events hit.
    //   push = added to the mood every tick, e.g. {v:.004}. tug = pulled toward a target every tick, e.g. {v:[target, strength]}.
    //   want = how much the agent wants this state right now. can = gate to ENTER it. stay = gate to REMAIN in it.
    //   sleep:true = a sleep stage: chosen by the sleep model below, never by decide(). repair = how strongly this stage heals the baseline.
    // c = what the rules can see, split into the agent's own state and the world:
    //   agent: c.h hunger meter, c.wt hydration meter, c.hp health, c.ill, c.v valence, c.a arousal (as displayed), c.d dominance,
    //          c.sat "full enough" level, c.state behaviour name, c.asleep, c.temperament (boldness + exploration read by curiosity() helper; others reserved)
    //   world: c.world = {light, conspecifics, temp, surrounding} — what is in the environment right now (predator / food / water are all surrounding objects now)

    // reckless(c) = desperation factor: 0 when fed/watered, 1 at empty hunger OR thirst. Drives reckless approach
    // (lower neophobia, higher curiosity, looser flee threshold) so hungry/thirsty agents investigate things they'd
    // otherwise avoid. Kicks in gradually as needs rise (not just at the starving cliff) — h<0.3 or wt<0.4 starts
    // moving the needle; h=0.15 (the starving threshold for OVERRIDE 3) gives desper=0.5; h=0 gives desper=1.
    const reckless = c => Math.max(0, Math.min(1, (0.3 - c.h) / 0.3), Math.min(1, (0.4 - c.wt) / 0.4));
    // curiosity(c, mem) = {cur, neo, ev, desper} — the curiosity / neophobia / learned-valence terms used by OVERRIDE 5
    // in decide() and by ST.approach_object.can/want. Scales with desper: curiosity up to 2.5× at desper=1, neophobia
    // drops to 0 at desper=1. ev = expected valence (valence × confidence), the learned-value term.
    const curiosity = (c, mem) => {
      const desper = reckless(c);
      const nov = mem ? 1 / Math.sqrt(mem.count + 1) : 1;
      const cur = nov * (.3 + .7 * (c.temperament.boldness + c.temperament.exploration) / 2) * (1 + 1.5 * desper);
      const neo = nov * (1 - c.temperament.boldness) * .5 * (1 - desper);
      const ev = mem ? mem.valence * mem.conf : 0;
      return { cur, neo, ev, desper };
    };
    const ST = {
      idle: {
        col: '#7a8a99', tug: { a: [-.2, .02] }, want: c => 1,
      },   // idle: rare encounters (spawn rates live on each archetype's .spawns)
      foraging: {
        col: '#c9772b', hunger: 1.8, push: { a: .002 },    // looks for food AND water, whichever is more urgent
        want: c => Math.max(c.h < c.sat ? (1 - c.h) * 5 : .3, c.wt < .7 ? (1 - c.wt) * 6 : .2),
      },   // foraging: moving around
      socialising: {
        col: '#d0488f', hunger: 1.6, push: { v: .004, a: .001 },   // (renamed from "playing") social contact with conspecifics
        can: c => c.h > .25 && c.wt > .25 && c.v > -.2, stay: c => c.h > .15, want: c => Math.min(c.h, c.wt) * 1.5,
      },   // socialising: some movement
      explore: {
        col: '#4a9e6f', hunger: 1.2, push: { a: .001 },                           // free-time wandering, only when fed and watered
        can: c => c.h > .4 && c.wt > .4, want: c => Math.min(c.h, c.wt) * (.5 + .5 * Math.max(0, c.a)),   // more aroused = more curious. TODO: also scale by c.temperament.exploration
      },   // explore: free-time wandering
      nrem: {
        col: '#3f5fb0', sleep: true, impact: .5, repair: .6, tug: { v: [0, .05], d: [0, .05], a: [-.5, .02] },   // deep sleep: calm, valence and dominance fade to 0
      },   // sleep: no new encounters (archetypes have no spawns in nrem)
      rem: {
        col: '#8a5fd0', sleep: true, impact: .5, repair: 1.4, tug: { v: [.1, .04], d: [0, .05], a: [.05, .03] }   // REM: arousal drifts up a little, mood repairs the most
      },
      approach_object: {
        col: '#e8a020', hunger: 1.5,   //  agent approaches a perceived object it expects to be good (or is curious / desperate enough to investigate). Uses the curiosity() helper so hunger/thirst boost curiosity and damp neophobia.
        can: c => { const t = eyes(); if (!t) return false; const m = memory.get(featureKey(t.features)); const { cur, neo, ev } = curiosity(c, m); return ev + cur - neo > 0; },
        stay: c => !!eyes(),
        want: c => { const t = eyes(); if (!t) return 0; const m = memory.get(featureKey(t.features)); const { cur, neo, ev } = curiosity(c, m); return Math.max(ev + cur - neo, 0); },
      },
      flee_object: {
        col: '#e04040', hunger: 2.5, impact: 1.5,   //  agent flees a perceived object it expects to be bad
        can: c => { const t = eyes(); if (!t) return false; const m = memory.get(featureKey(t.features)); return m && m.valence < 0 && m.conf > 0.3; },
        stay: c => !!eyes(),
        want: c => { const t = eyes(); if (!t) return 0; const m = memory.get(featureKey(t.features)); if (!m || m.valence >= 0) return 0; return Math.abs(m.valence) * m.conf; },
      },
    };

    //  approach mechanics
    const APPROACH_TICKS = 5;   // how many ticks of approach_object before the US fires
    let lastPreviewedKey = null;    //  feature key of the last object we already fired a preview pulse for (so we don't keep re-firing while staring at the same thing)

    // stepApproach = handle approach_object completion. Called from tick() after stepSleepWake.
    // When approachTimer reaches APPROACH_TICKS: fire the US event (marked with fromApproach), consume the target.
    function stepApproach(s) {
      if (behaviour !== 'approach_object') { s.approachTimer = 0; return; }
      const target = eyes();
      if (!target) { behaviour = 'idle'; s.approachTimer = 0; return; }
      s.approachTimer = (s.approachTimer || 0) + 1;
      if (s.approachTimer < APPROACH_TICKS) return;
      // Approach complete!
      s.approachTimer = 0;
      const key = featureKey(target.features);   // the feature key the agent perceived — carried on the US event via `fromApproach`
      const usEvents = target.events || [];   // events array lives ON the target now (was TYPE_TO_US[target.underlyingType])
      if (usEvents.length > 0) {
        const usKey = usEvents[Math.floor(Math.random() * usEvents.length)];
        // Mark the US event with `fromApproach: key` so fireEvents knows:
        //   (a) this event came from an approach (not a manual click or RANDOM row)
        //   (b) which feature key to update in memory
        //   (c) measure the actual valence delta (before/after this event's pulses) as the teaching signal
        Q.push({ ...EVENT_BY_KEY[usKey], fromApproach: key });
      } else {
        // Neutral encounter — tiny curiosity bump, learn "this = nothing"
        s.a += 0.05;
        const entry = memory.get(key) || { valence: 0, conf: 0, count: 0, lastSeen: 0 };
        entry.valence += P.learnRate * (0 - entry.valence);
        entry.conf = Math.min(1, entry.conf + P.learnRate);
        entry.count++; entry.lastSeen = N;
        memory.set(key, entry);
      }
      W.surrounding = W.surrounding.filter(o => o.id !== target.id);   // consume the target
    }

    // previewPulse =  anticipatory affect. When attention locks onto an object, the mood shifts
    // based on the expected outcome stored in memory. Same multi-pulse shape as the matching US event
    // (spike + slow tail on each of v / a / d — like predator_attack / ate_food), but at ~30% of that
    // event's amplitude, gated by confidence (low-conf expectations aren't felt yet — curiosity / neophobia
    // still drive the decision to investigate). Fires ONCE PER ATTENTION SWITCH — staring at the same object
    // does not keep re-firing previews. Malaise dampers (anhedonia, blunting, reactive dominance) apply
    // exactly as they do to real events, so an unwell agent also feels a flattened preview.
    function previewPulse(target, s) {
      const key = featureKey(target.features);
      if (key === lastPreviewedKey) return;             // already previewed this exact feature-key this attention span
      const mem = memory.get(key);
      // Always mark the key as "seen" so we don't retry every tick — even when we skip the actual pulse.
      lastPreviewedKey = key;
      if (!mem) return;                                 // nothing learned yet → nothing to anticipate (curiosity handles it)
      const v = mem.valence, c = mem.conf, gain = P.previewGain;
      if (c < P.previewConfFloor) return;               // low-confidence expectation → not felt yet
      if (Math.abs(v) < P.previewValFloor) return;      // near-neutral valence → no anticipatory tint
      // 6 pulses: spike + tail on each dimension. Same shape as predator_attack / ate_food at ~30% amplitude.
      //   - Valence: tracks the expected sign and magnitude.
      //   - Arousal: rises for BOTH positive (excitement) and negative (wariness) valence — uses |v|.
      //   - Dominance: tracks valence sign (positive → in control; negative → small).
      const pulses = [
        { dim: 'v', amp: v * .25 * c * gain, tau: 4 },
        { dim: 'v', amp: v * .10 * c * gain, tau: 80 },
        { dim: 'a', amp: Math.abs(v) * .20 * c * gain, tau: 5 },
        { dim: 'a', amp: Math.abs(v) * .08 * c * gain, tau: 60 },
        { dim: 'd', amp: v * .15 * c * gain, tau: 20 },
        { dim: 'd', amp: v * .10 * c * gain, tau: 150 },
      ];
      // Apply the same sleep-debt anhedonia as fireEvents so previews flatten along with real events when sleep-deprived.
      const feltV = clamp(s.v + pulseSum().v);          // current felt valence (for situational domScale)
      const domScale = feltV <= 0 ? K.domGainHalf : 1;
      for (const p of pulses) {
        let amp = p.amp;
        if (p.dim === 'v') { amp *= P.pers; if (amp > 0) amp *= 1 - K.sleepDebtAnhedonia * s.dep; }
        if (p.dim === 'd' && amp > 0) amp *= domScale;
        PULSES.push({ dim: p.dim, amp, tau: p.tau, age: 0 });
      }
    }

    // Pick the next awake behaviour (never a sleep stage). Sets the global `behaviour`.
    function decide(c) {
      //  check the attended object for approach/flee decisions
      const target = eyes();
      const desper = reckless(c);                                    // 0 when fed, 1 at empty hunger OR thirst — drives reckless approach
      if (target) {
        const mem = memory.get(featureKey(target.features));
        // OVERRIDE 2: strong negative memory → flee. The "strong negative" threshold slides with desperation —
        //   a fed agent (desper=0) flees anything val<-0.3; a desperate agent (desper=1) only flees val<-0.6.
        //   Predators (innate val=-0.7) still get fled even at desper=1, but mildly-negative objects get approached when starving.
        const fleeThreshold = -0.3 - 0.3 * desper;                   // -0.3 when fed → -0.6 when desperate
        if (mem && mem.valence < fleeThreshold && mem.conf > 0.5) { behaviour = 'flee_object'; return; }
        // OVERRIDE 3: starving → reckless approach of whatever's visible (desperation beats caution — the agent
        //   will try anything except strong negatives that OVERRIDE 2 caught). No target → foraging (need to find something).
        if (c.h < .15 || c.wt < .2) { behaviour = 'approach_object'; return; }
        // OVERRIDE 4: strong positive memory → approach this object
        if (mem && mem.valence > 0.3 && mem.conf > 0.3) { behaviour = 'approach_object'; return; }   // lowered from 0.5 — pre-seed conf=0.3 should trigger
        // OVERRIDE 5: Unknown or low-confidence object + curiosity > neophobia → approach. Curiosity is boosted
        //   and neophobia is damped by desperation, so hungry/thirsty agents investigate things they'd otherwise avoid.
        if (!mem || mem.conf < 0.5) {
          const { cur, neo } = curiosity(c, mem);  
          if (cur > neo && cur > 0.3) { behaviour = 'approach_object'; return; }
        }
      } else {
        if (c.h < .15 || c.wt < .2) { behaviour = 'foraging'; return; }
      }
      const def = ST[behaviour];
      if (def.stay && !def.stay(c)) behaviour = 'idle';
      const w = {}; let sum = 0;                                    // w = weight of each candidate state
      for (const k in ST) {
        if (ST[k].sleep) continue;                                  // sleep is handled by the sleep model
        if (k !== behaviour && ST[k].can && !ST[k].can(c)) continue;   // entry gate
        w[k] = Math.max(0, ST[k].want(c)) * (k === behaviour ? P.sticky : 1);
        sum += w[k];
      }
      let r = Math.random() * sum;                                  // weighted random pick
      for (const k in w) { r -= w[k]; if (r <= 0) { behaviour = k; break; } }
    }

    /* ============ Body clock and light ============ */
    // daylight = sun brightness 0..1 for a world hour: dark before 06:00 and after 18:00, brightest at noon
    const daylight = h => Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    // bodyClock = Process C, scaled to about -1..+1. A sine plus a 2nd harmonic gives the skewed shape.
    // The 8.4 puts the trough at about 04:00 and the peak at about 13:00.
    const bodyClock = h => { const x = 2 * Math.PI * (h - 8.4) / 24; return (Math.sin(x) + .3 * Math.sin(2 * x)) / 1.137; };

    /* ============ Simulation state ============ */
    // S = the AGENT's own state.
    //   v/a/d = valence, arousal, dominance (the layer that behaviour and needs push on; event effects are separate, in PULSES). bv/ba/bd = their baselines (slow layer, "b" for baseline).
    //   h = hunger meter (1 full, 0 starving).  wt = hydration meter (1 hydrated, 0 dehydrated).  hp = health (1 healthy).  ill = is it ill?
    //   sp = sleep pressure (Process S).  ct = body-clock time in hours.  asleep = sleeping now?
    //   tin = hours asleep this episode.  ut = minutes into the current sleep cycle.
    //   slept = hours slept since the daily ledger last closed (12:00 on the body clock).  dbt = sleep debt in hours.
    //   dep = sleep deprivation 0..1.  cool = ticks before it may fall asleep again.  led = has today's ledger closed already?
    // W = the WORLD: what is in the environment right now. Kept apart from the agent.
    // behaviour = name of the current behaviour (a key of ST).
    let S, W, behaviour;
    // H = history (last 600 ticks), N = tick counter, M = chart marks (one per tick that fired events),
    // Q = events waiting for the next tick, LOG = recent events for the list under the chart, evSeq = running event number,
    // PULSES = event effects still fading, each {dim, amp, tau, age}
    let H, N, M, Q, LOG, evSeq, PULSES;
    const MARKS = [];   // MARKS = where each number tag sits on the timeline (rebuilt in place every frame, hence const)

    /* ---- Custom events (user-defined, saved to localStorage) ---- */
    // Each entry is a full event object (same shape as EVENTS entries from RAW+EXTRA merged): {g, k, v, a, d, food?, water?, hp?}.
    // Pushed directly to Q when the user clicks the button. The v/a/d impacts build default pulses via SHAPE
    // (no custom pulse list — for custom pulse shapes, use the one-off custom event composer above the grid).
    let CUSTOM_EVENTS = [];
    const CUSTOM_EVENTS_KEY = 'moodbench_customEvents_v1';
    const loadCustomEvents = () => { try { CUSTOM_EVENTS = JSON.parse(localStorage.getItem(CUSTOM_EVENTS_KEY) || '[]'); } catch (e) { CUSTOM_EVENTS = []; } };
    const saveCustomEvents = () => { try { localStorage.setItem(CUSTOM_EVENTS_KEY, JSON.stringify(CUSTOM_EVENTS)); } catch (e) { } };
    loadCustomEvents();   // load on script init

    // Random-event chances persistence — save tweaked per-tick chances to localStorage so they survive reloads.
    // Stored as {id: per-tick-chance}. loadRandomChances applies them to RANDOM rows on init; the UI input
    // handler calls saveRandomChances after each edit. (The global 'rate' slider is a separate multiplier on top.)
    const RANDOM_CHANCES_KEY = 'moodbench_randomChances_v1';
    const loadRandomChances = () => { try { const saved = JSON.parse(localStorage.getItem(RANDOM_CHANCES_KEY) || '{}'); for (const r of RANDOM) if (saved[r.id] !== undefined) r.chance = saved[r.id]; } catch (e) { } };
    const saveRandomChances = () => { try { localStorage.setItem(RANDOM_CHANCES_KEY, JSON.stringify(Object.fromEntries(RANDOM.map(r => [r.id, r.chance])))); } catch (e) { } };
    loadRandomChances();   // load on script init
    let run = true, circOn = true, clock = true;
    // Custom event composer state. Declared here (above init) so init() can wipe customQueue on Reset.
    // No per-dim defaults — each queued spike starts neutral (amp=0, τ=10) and is adjusted inline.
    const customQueue = [];               // staged pulses: each {dim, amp, tau}. Pushed as one custom event's `pulses` on Fire.

    /* ============ Surrounding objects (Surrounding objects) ============ */
    // Each object in W.surrounding has:
    //   id              — unique monotonic id for tracking
    //   name            — the archetype key (e.g. 'wolf', 'berry_bush'). Mainly for UI/debugging.
    //   features       — {size, color, shape}, the perceptual features the agent learns to associate
    //   events          — array of event keys that fire when this object is approached (was: underlyingType → TYPE_TO_US lookup)
    //   ttl             — ticks until despawn
    //   age             — ticks since spawned
    // Spawned here; read by eyes() / previewPulse() / stepApproach() / renderSurrounding().
    let nextObjectId = 1;
    const SURR_FEATURES = {
      size: ['small', 'medium', 'large'],
      color: ['dark', 'red', 'green', 'blue', 'brown'],
      shape: ['round', 'angular', 'animal', 'plant'],
    };
    const SURR_COLOR_HEX = { dark: '#222', red: '#d33', green: '#3a3', blue: '#36c', brown: '#a52' };
    const SURR_SIZE_PX = { small: 14, medium: 18, large: 22 };
    // ARCHETYPES = the catalog of named object types the world can spawn. Each entry has:
    //   features         — {size, color, shape} perceptual identity (must be unique per archetype, since memory
    //                      keys are derived from featureKey(features) — collisions = ambiguous learning signal)
    //   events           — array of event keys that fire when this object is approached. Empty = neutral (no US,
    //                      stepApproach handles inline with a curiosity bump + "this = nothing" memory update).
    //                      Multiple = the approach picks one at random (e.g. rival → social_loss or social_win).
    //   innateValence?   — if set, the agent is born expecting this much valence from this feature pattern.
    //   innateConf?      — confidence of the innate expectation (defaults to 0.3 if omitted).
    //   spawns?          — { state: rate } per-tick spawn probability for each behaviour state. Absolute chance
    //                      (not relative): stepSurrounding sums the rates of all archetypes for the current state,
    //                      rolls once against the sum, weighted-picks which archetype. Unspecified = 0 (never spawns
    //                      in that state). Tune live via the spawn-rates grid in the UI.
    //   surroundAgeRate? — how fast this object's TTL ages per tick (default 1). The flee/approach target overrides
    //                      in stepSurrounding still apply on top. Tune live via the spawn-rates grid.
    // INNATE_MEMORY is auto-derived from ARCHETYPES (see below).
    const ARCHETYPES = {
      // ── predators (innate wariness of large dark animal shapes — pre-seeded with valence -0.7, conf 0.6) ──
      wolf: { features: { size: 'large', color: 'dark', shape: 'animal' }, events: [EV.predator_attack], innateValence: -.7, innateConf: .6,
              spawns: { idle: 0.00005, foraging: 0.00005, explore: 0.0003, flee_object: 0.005 } },
      fox: { features: { size: 'medium', color: 'red', shape: 'animal' }, events: [EV.predator_attack],
             spawns: { idle: 0.00005, foraging: 0.00005, explore: 0.0003, flee_object: 0.003 } },
      owl: { features: { size: 'small', color: 'dark', shape: 'animal' }, events: [EV.predator_attack],
             spawns: { idle: 0.00005, explore: 0.0003, flee_object: 0.002 } },
      // ── food (innate attraction to small green round shapes — pre-seeded valence +0.5, conf 0.3) ──
      berry_bush: { features: { size: 'small', color: 'green', shape: 'round' }, events: [EV.ate_food], innateValence: .5, innateConf: .3,
                    spawns: { foraging: 0.005, explore: 0.0015 } },
      nut: { features: { size: 'small', color: 'brown', shape: 'round' }, events: [EV.ate_food],
             spawns: { foraging: 0.001, explore: 0.001 } },
      // ── water ──
      stream: { features: { size: 'large', color: 'blue', shape: 'round' }, events: [EV.drank_water],
                spawns: { foraging: 0.005, explore: 0.0006 } },
      puddle: { features: { size: 'small', color: 'blue', shape: 'round' }, events: [EV.drank_water],
                spawns: { foraging: 0.001, explore: 0.0004 } },
      // ── social ──
      friend: { features: { size: 'small', color: 'brown', shape: 'animal' }, events: [EV.grooming_contact],
                spawns: { idle: 0.0001, socialising: 0.0015, explore: 0.0002 } },
      rival: { features: { size: 'medium', color: 'red', shape: 'angular' }, events: [EV.social_loss, EV.social_win],   // 50/50 win-or-lose
               spawns: { socialising: 0.0008, flee_object: 0.002 } },
      // ── environment / novelty ──
      cracker: { features: { size: 'small', color: 'brown', shape: 'angular' }, events: [EV.loud_noise],
                 spawns: { explore: 0.001 } },
      // ── body (healing / sickness) ──
      herb: { features: { size: 'medium', color: 'green', shape: 'plant' }, events: [EV.recovery],
              spawns: { idle: 0.00005, explore: 0.0005 } },
      rotten_food: { features: { size: 'small', color: 'brown', shape: 'plant' }, events: [EV.illness_onset],
                     spawns: { explore: 0.0002 } },
      // ── neutral (no US — approach produces a tiny curiosity bump + "this = nothing" memory update) ──
      pebble: { features: { size: 'small', color: 'dark', shape: 'round' }, events: [],
                spawns: { idle: 0.0007, socialising: 0.0003, explore: 0.003, approach_object: 0.0005 } },
    };

    function objectSvg(features) {
      const sz = SURR_SIZE_PX[features.size], col = SURR_COLOR_HEX[features.color];
      let inner;
      if (features.shape === 'round') inner = `<circle cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2 - 1}" fill="${col}"/>`;
      else if (features.shape === 'angular') inner = `<rect x="1" y="1" width="${sz - 2}" height="${sz - 2}" fill="${col}"/>`;
      else if (features.shape === 'plant') inner = `<ellipse cx="${sz / 2}" cy="${sz / 2}" rx="${sz / 3}" ry="${sz / 2 - 1}" fill="${col}"/>`;   // plant = leaf-shaped ellipse
      else inner = `<polygon points="${sz / 2},1 ${sz - 1},${sz - 1} 1,${sz - 1}" fill="${col}"/>`;   // animal = triangle
      return `<svg width="${sz}" height="${sz}" aria-hidden="true">${inner}</svg>`;
    }

    function randomFeatures() {
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      return { size: pick(SURR_FEATURES.size), color: pick(SURR_FEATURES.color), shape: pick(SURR_FEATURES.shape) };
    }

    // (Spawn rates now live on each archetype's .spawns field — see ARCHETYPES above. The old separate
    // SPAWN_RATES table (organized by state) was folded into the archetypes so each archetype owns its own
    // spawn rates and can be tuned live via the spawn-rates grid in the UI.)

    // spawnObject = push a new archetype instance into W.surrounding.
    // Signature changed: takes the archetype NAME (looked up in ARCHETYPES), not (features, underlyingType).
    function spawnObject(name, ttl = 200) {
      if (W.surrounding.length >= 20) return;   // cap at 20 visible objects so the panel doesn't explode
      const arch = ARCHETYPES[name];
      if (!arch) return;
      W.surrounding.push({ id: nextObjectId++, name, features: arch.features, events: arch.events, ttl, age: 0 });
    }

    // stepSurrounding = ambient random spawning + TTL aging + despawn + preview pulse.
    // Called from tick() after stepWorld(). Takes s so the preview pulse can apply the sleep-debt anhedonia damper (K.sleepDebtAnhedonia × s.dep).
    function stepSurrounding(s) {
      // Spawn: iterate all archetypes, collect each one's spawn rate for the current behaviour state,
      // sum them, roll once against the sum, weighted-pick which archetype. (Rates live on arch.spawns now,
      // not on a separate SPAWN_RATES table — so tuning one archetype's rates doesn't require touching others.)
      const entries = [];
      for (const [name, arch] of Object.entries(ARCHETYPES)) {
        const rate = arch.spawns?.[behaviour] ?? 0;
        if (rate > 0) entries.push([name, rate]);
      }
      const totalRate = entries.reduce((sum, [, r]) => sum + r, 0);
      if (totalRate > 0 && Math.random() < totalRate) {
        let r = Math.random() * totalRate;
        for (const [name, rate] of entries) {
          r -= rate;
          if (r <= 0) { spawnObject(name); break; }
        }
      }
      // Age: each object's TTL ages at its archetype's surroundAgeRate (default 1). The flee/approach target
      // overrides still apply on top — fleeing makes the pursued target leave fast, approaching freezes it.
      const target = eyes();
      for (const obj of W.surrounding) {
        const arch = ARCHETYPES[obj.name];
        let rate = arch?.surroundAgeRate ?? 1;
        if (behaviour === 'flee_object' && target && obj.id === target.id) rate = Math.max(rate, 5);   // fleeing → target leaves view fast
        if (behaviour === 'approach_object' && target && obj.id === target.id) rate = 0;                // approaching → target stays until reached
        obj.age += rate;
      }
      W.surrounding = W.surrounding.filter(obj => obj.age < obj.ttl);
      //  fire a preview pulse when attention switches to a new object (or to anything after a gap).
      const tgt = eyes();
      if (tgt) previewPulse(tgt, s);
      else lastPreviewedKey = null;   // nothing visible → next spawn triggers a fresh preview
    }

    // renderSurrounding = rebuild the surrounding list DOM. Called every frame from readout() (small list, no perf issue).
    function renderSurrounding() {
      const list = $('#surroundingList');
      if (!list) return;
      list.innerHTML = W.surrounding.length === 0
        ? `<small>${t.surrEmpty}</small>`
        : W.surrounding.map(obj => {
          const feats = `${t.feat.size[obj.features.size]} · ${t.feat.color[obj.features.color]} · ${t.feat.shape[obj.features.shape]}`;
          return `<div class="surrItem">${objectSvg(obj.features)} ${feats} <span class="type">${obj.name}</span><span class="ttl">${obj.ttl - obj.age}t</span></div>`;
        }).join('');
    }

    /* ============ Memory & learning  ============ */
    // memory = Map from feature-string to {valence, conf, count, lastSeen}.
    //   valence  = -1..+1, the learned affect (Rescorla-Wagner running average of actual outcomes)
    //   conf     = 0..1, confidence (grows with each encounter, shrinks with contradiction)
    //   count    = how many times this feature-pattern has been encountered
    //   lastSeen = tick of last encounter (for future forgetting / decay)
    
    // The agent never sees the archetype name; it only sees features. Memory links features to expected valence.
    let memory = new Map();

    // featureKey = hash the features object into a string key for the Map (e.g. "large|dark|animal").
    function featureKey(features) {
      return `${features.size}|${features.color}|${features.shape}`;
    }

    // INNATE_MEMORY = auto-derived from ARCHETYPES. Any archetype with `innateValence` set becomes an innate
    // pre-seed entry. Evolutionary predispositions that experience can reinforce (push conf toward 1.0) or override
    // (if a wolf turns out friendly). The wolf entry has HIGH conf (0.6) so OVERRIDE 2 in decide() fires
    // flee_object on first sight. Berry_bush stays at low conf (0.3) — curiosity can still beat innate attraction
    // on first encounter, which is fine because approaching food is rewarded, not punished.
    // (To add more innate predispositions, set `innateValence` + `innateConf` on the archetype entry.)
    const INNATE_MEMORY = Object.entries(ARCHETYPES)
      .filter(([, arch]) => arch.innateValence !== undefined)
      .map(([_, arch]) => ({ features: arch.features, valence: arch.innateValence, conf: arch.innateConf ?? 0.3 }));

    // seedMemory = reset memory to the innate pre-seed entries. Called from init() on Reset.
    function seedMemory() {
      memory.clear();
      for (const e of INNATE_MEMORY)
        memory.set(featureKey(e.features), { valence: e.valence, conf: e.conf, count: 0, lastSeen: 0 });
    }

    // eyes = pick which visible object the agent is currently attending to: most recently spawned (last in W.surrounding).
    function eyes() {
      return W.surrounding.length > 0 ? W.surrounding[W.surrounding.length - 1] : null;
    }

    // learnFromEvent = Rescorla-Wagner update: move expected valence toward the actual felt valence change
    // (the teaching signal), grow confidence. Only called for US events from approach completion (events with
    // `fromApproach` set) — manual clicks and RANDOM row events don't teach, preventing the multi-event-same-tick
    // pollution bug where a negative RANDOM event (e.g. social_loss) could overwrite a positive US (e.g. drank_water).
    function learnFromEvent(key, teachingSignal) {
      if (!key) return;
      const entry = memory.get(key) || { valence: 0, conf: 0, count: 0, lastSeen: 0 };
      entry.valence += P.learnRate * (teachingSignal - entry.valence);
      entry.conf = Math.min(1, entry.conf + P.learnRate);
      entry.count++;
      entry.lastSeen = N;
      memory.set(key, entry);
    }

    function init() {
      // Reset sliders to defaults (fixes the "Reset doesn't reset sliders" bug — P used to retain edits across Reset).
      Object.assign(P, CONFIG);
      // Reset world state FIRST (S.ct reads W.hour for the body-clock start time).
      W = {
        light: 0,           // 0 dark .. 1 full daylight (from the sun)
        conspecifics: 0,    // how many others of its own kind are nearby
        temp: 18,           // ambient temperature in degrees C (comfortable is 20)
        surrounding: [],    // currently-visible objects (see stepSurrounding / renderSurrounding)
        ...WORLD_DEFAULTS
      };   // hour — world state, not parameters
      deriveWorld();   // immediately recompute W.light + W.temp from the (just-reset) hour, so the gauges are consistent even while paused (no tick yet)
      S = {
        v: HOME.v, a: HOME.a, d: HOME.d, bv: HOME.v, ba: HOME.a, bd: HOME.d, h: .8, wt: .8, hp: 1, ill: false, sp: .35, ct: W.hour,
        asleep: false, tin: 0, ut: 0, slept: P.expect, dbt: 0, dep: 0, cool: 0, led: false, approachTimer: 0
      };
      behaviour = 'idle';
      H = []; N = 0; M = []; Q = []; LOG = []; evSeq = 0; PULSES = [];
      customQueue.length = 0;   // also wipe the staged custom-event pulses so Reset returns a clean slate
      lastPreviewedKey = null;   //  clear after reset so the first seen object triggers a fresh preview
      seedMemory();   //  reset memory to innate pre-seed entries
      // Sync every slider to the reset values. (No-op on the very first init() call before build() has run,
      // since the slider elements don't exist yet — sync() bails when !input.)
      for (const [k] of SLIDERS) sync(k);
    }
    init();

    // startSleep / wake = the two sleep transitions. wake(natural): natural = the sleep pressure ran out; otherwise something interrupted.
    function startSleep() { S.asleep = true; S.tin = S.ut = 0; behaviour = 'nrem'; Q.push(EVENT_BY_KEY[EV.fell_asleep]); }
    function wake(natural) { S.asleep = false; behaviour = 'idle'; S.cool = natural ? 0 : P.wakeCooldown; Q.push(EVENT_BY_KEY[natural ? EV.woke_up : EV.sleep_interrupted]); }

    /* ============ One simulation tick ============ */
    // tick() only lists the steps. Each step is a function below, grouped by topic (mood, needs, world, sleep, behaviour).
    function tick() {
      const s = S, def = ST[behaviour];          // s = the agent, def = definition of its current behaviour
      decayMood(s);
      applyBehaviour(s, def);
      applyNeeds(s, def);
      applyHealth(s, def);
      fireEvents(s, def);
      clampMood(s);
      const m = feel(s);                         // m = the felt mood: the slow layer plus every event pulse still fading (this also ages the pulses by one tick)
      moveBaseline(s, def, m);
      stepWorld();
      stepSurrounding(s);   // ambient object spawning + TTL aging + preview pulse
      const body = stepBodyClock(s, m);             // body = {ea: displayed arousal, offset, up, lo: sleep thresholds, noon: passed 12:00}
      stepSleepPressure(s, body.noon);
      stepSleepWake(s, body);
      stepApproach(s);   //  handle approach_object completion (US fires, target consumed)
      if (!s.asleep && N % P.decideevery === 0) chooseBehaviour(s, m, body.ea);
      chooseRandomEvents(s, m, body.ea);
      record(s, m, body);
      N++;
    }

    /* ---- Mood (uses: decay, afast, drift, pers, thr, dep, repair) ---- */
    // Pull the slow layer of the mood (the part behaviour and needs push on) back toward baseline.
    // Event effects are not here: they are pulses with their own fade times (see feel).
    function decayMood(s) {
      s.v += (s.bv - s.v) * P.decay;
      s.d += (s.bd - s.d) * P.decay;
      s.a += (s.ba - s.a) * P.decay;
    }

    // The current behaviour's steady effect on mood: push = nudge, tug = pull toward a target
    function applyBehaviour(s, def) {
      for (const k in def.push) s[k] += def.push[k];
      for (const k in def.tug) s[k] += (def.tug[k][0] - s[k]) * def.tug[k][1];
    }

    // ---- Event pulses ----
    // An event is a few PULSES, each with a size (amp) and a fade time (tau, in ticks). A pulse adds amp x exp(-age / tau) to the mood:
    // a small tau is a quick spike, a big tau is a lingering tail. A pulse is dropped once it has faded to under 0.5% of its size.
    // The felt mood = the slow layer (S.v / S.a / S.d) + the sum of all pulses, clamped to -1..1.
    // pulsesOf = the pulses for an event: its own list if it has one, otherwise built from its impacts (imp) with SHAPE
    function pulsesOf(e, imp) {
      return e.pulses || ['v', 'a', 'd'].flatMap(dim => SHAPE[dim].map(([share, tau]) => ({ dim, amp: imp[dim] * share, tau })));
    }
    
    // needMult = need-relevance multiplier for an event group, based on the agent state s and world W.
    // 1 = neutral, >1 = more salient when the relevant need is high. Incentive-salience-style modulation
    // (Berridge & Robinson 1998): food is more salient when hungry, social events when isolated, etc.
    // Compounds with the base magnitude salience (max of |impacts| or |pulse amps|) in fireEvents.
    function needMult(g, s, W) {
      switch (g) {
        case 'food': return 1 + (1 - s.h) * 0.5;                         // food more salient when hungry (up to 1.5× at empty)
        case 'body': return 1 + (s.ill ? 0.3 : 0) + (1 - s.hp) * 0.3;   // body events (pain, illness, recovery) more salient when sick / low HP
        case 'social': return 1 + (W.conspecifics === 0 ? 0.3 : 0);       // social events more salient when isolated
        case 'sleep': return 1 + s.dep * 0.3;                            // sleep transitions more salient when sleep-deprived
        default: return 1;                                          // threat, env, custom: neutral (could add novelty bonus later)
      }
    }
    // pulseValue = what one pulse contributes right now (0 while it is still waiting to start, i.e. age below 0)
    const pulseValue = p => p.age < 0 ? 0 : p.amp * Math.exp(-p.age / (p.tau * P.plen));
    // pulseSum = every pulse added up per dimension, without ageing them
    function pulseSum() { const sum = { v: 0, a: 0, d: 0 }; for (const p of PULSES) sum[p.dim] += pulseValue(p); return sum; }
    // feel = the felt mood this tick. Also ages every pulse by one tick and drops the faded ones.
    function feel(s) {
      const sum = pulseSum();
      for (const p of PULSES) p.age++;
      PULSES = PULSES.filter(p => p.age < 0 || Math.abs(pulseValue(p)) > .005 * Math.abs(p.amp));
      return { v: clamp(s.v + sum.v), a: clamp(s.a + sum.a), d: clamp(s.d + sum.d) };
    }
    // Run the events waiting in the queue. Each one becomes a few pulses, and also moves needs and sometimes the world.
    function fireEvents(s, def) {
      if (!Q.length) return;
      const names = [];                                                   // names = events that fire this tick (for the chart tag and the list)
      for (const e of Q.splice(0)) {                                      // splice(0) = take every queued event and empty the queue
        names.push(e.k);
        if (e.force) {                                                    // a manual click on a sleep-transition button makes the agent actually do it
          if (e.k === EV.fell_asleep && !s.asleep) startSleep();
          else if (s.asleep && e.k !== EV.fell_asleep) wake(e.k === EV.woke_up);
          continue;                                                       // the mood effect comes from the event that startSleep() / wake() queue
        }
        const imp = e.amb ? { v: K.ambValence * s.bv, a: K.ambArousal + K.ambArousalBase * s.ba, d: 0 } : e;
        const feltV = clamp(s.v + pulseSum().v);       // feltV = valence as it stands after earlier events this tick, but before this one
        const baseSalience = e.pulses ? Math.max(...e.pulses.map(p => Math.abs(p.amp)))
          : e.amb ? Math.max(Math.abs(imp.v), Math.abs(imp.a), Math.abs(imp.d), 0.3)
            : Math.max(Math.abs(e.v), Math.abs(e.a), Math.abs(e.d));
        const salience = baseSalience * needMult(e.g, s, W);
        const k = salience * (e.g === 'sleep' ? 1 : (def.impact ?? 1));
        const domScale = feltV <= 0 ? K.domGainHalf : 1;
        // For approach-US events (fromApproach set): the teaching signal is THIS event's own valence pulse
        // contribution (vContrib) — the sum of the valence amps pushed, pre-clamp and post-anhedonia. This is the
        // US's intrinsic reinforcing value (Rescorla-Wagner λ), NOT the felt mood change, so it is unaffected by
        // saturation (a well-fed agent whose felt valence is already near +1 still learns food is good) and by
        // delayed pulses (their amps count at push time, before they start fading). Motivation modulation comes
        // from needMult via k (food more salient when hungry) and is undone by /k below; anhedonia
        // (sleepDebtAnhedonia) is applied as a known scalar and is NOT undone, so sleep debt reduces the teaching
        // magnitude without flipping the sign.
        let vContrib = 0;
        for (const p of pulsesOf(e, imp)) {
          let amp = p.amp * k;
          if (p.dim === 'v') {
            amp *= P.pers;
            if (amp > 0) amp *= 1 - K.sleepDebtAnhedonia * s.dep;
            vContrib += amp;
          }
          if (p.dim === 'd' && amp > 0) amp *= domScale;
          PULSES.push({ dim: p.dim, amp, tau: p.tau, age: -(p.delay ?? 0) });
        }
        if (e.food) s.h = clamp01(s.h + e.food * P.foodQuality);
        if (e.water) s.wt = clamp01(s.wt + e.water);
        if (e.hp) s.hp = clamp01(s.hp + e.hp);
        if (e.act) e.act(W, s);
        // Learning: only for approach-US events (fromApproach set). teachingSignal = vContrib / k, which undoes the
        // salience scaling to recover a value in the imp.v × pers × (1 - anhedonia) range — compatible with the
        // existing decision thresholds (OVERRIDE 2/4 expect -0.3..+0.3 range; imp.v is ±0.7..1.0, pers-scaled).
        if (e.fromApproach) {
          const teachingSignal = k > 0 ? vContrib / k : vContrib;
          learnFromEvent(e.fromApproach, teachingSignal);
        }
      }
      M.push({ n: N, id: ++evSeq, k: names });
      LOG.unshift({ id: evSeq, time: fmt('hour', W.hour), k: names });
      if (LOG.length > 10) LOG.pop();
      while (M.length && M[0].n < N - 600) M.shift();
    }

    function clampMood(s) { s.v = clamp(s.v); s.a = clamp(s.a); s.d = clamp(s.d); }

    // Awake: the baseline drifts toward recent mood (a slow running mean), and long-term gloom drains it.
    // Asleep: sleep is not "experience", so the running mean is frozen and the baseline is REPAIRED toward HOME instead.
    function moveBaseline(s, def, m) {
      if (!def.sleep) {
        s.bv += (m.v - s.bv) * P.drift;
        s.ba += (m.a - s.ba) * P.drift;
        s.bd += (m.d - s.bd) * P.drift;
        // Per-source unwell pushes (replaces the old malaise aggregator). Each source pushes baseline mood directly,
        // like the `need` push in applyNeeds — not a pull-toward-target. Sleep debt is the biggest driver; sickness
        // and low HP add to the same push. Physiological hyperarousal (cortisol) is NOT routed here — it shows up
        // as asymmetric anhedonia in fireEvents (sleepDebtAnhedonia, Motomura 2013), not as a tonic arousal push.
        const unwell = s.dep + (s.ill ? 1 : 0) + (1 - s.hp);
        s.bv -= K.unwellValence * unwell;                   // being unwell feels bad (valence down)
        s.ba -= K.unwellLethargy * unwell;                   // and lethargic (tonic arousal down)
        s.bd -= K.unwellDominance * unwell;                  // and low in reactive dominance
        if (s.bv < P.thr) { s.ba *= P.depfactor; s.bd *= P.depfactor; }
        // depletion: gloom drains baseline arousal and dominance (separate mechanic — triggers on low valence, not on unwellness)
      } else {
        const r = P.repair * (def.repair ?? 0);
        // r = repair per tick (literature-backed sleep repair, no malaise damper).
        s.bv += (HOME.v - s.bv) * r; s.ba += (HOME.a - s.ba) * r; s.bd += (HOME.d - s.bd) * r;
      }
    }

    /* ---- Needs and body (uses: hrate, wrate, hmood) ---- */
    function applyNeeds(s, def) {
      const comfort = 1 - Math.min(1, Math.abs(W.temp - K.tempIdeal) / K.tempRange);   // 1 at 20 C, 0 at 5 C or 35 C
      const use = def.hunger ?? 1;                                        // ?? 1 = "use 1 if the behaviour has no hunger field"
      s.h = clamp01(s.h - P.hrate * use * (1 + K.sleepDeprivedBurn * s.dep) - (1 - comfort) * K.coldBurn);   // sleep loss and cold both burn energy
      s.wt = clamp01(s.wt - P.wrate * use * (1 + K.thirstFromHunger * (1 - s.h)));                        // thirst runs faster when hungry
      const hurt = m => Math.max(0, K.needFloor - m) / K.needFloor;       // hurt = 0 while a meter is above .4, rising to 1 when empty
      const need = hurt(s.h) + hurt(s.wt);
      s.v -= P.hmood * K.needValence * need;                              // being hungry or thirsty feels bad...
      s.a += P.hmood * K.needArousal * need;                              // ...and restless
      if (comfort < K.coldStress) s.v -= K.coldValence;                   // chronic cold or heat stress
    }
    // Health. ILLNESS lives in these places: the flag s.ill; EXTRA.illness_onset / recovery (set and clear it);
    // the RANDOM rows 'illness' and 'recover' (start and end it by chance); the drain below; the status line (readout).
    function applyHealth(s, def) {
      if (def.sleep) s.hp += s.ill ? P.sickSleepHeal : P.sleepHeal;       // sleep heals, but barely while sick
      if (s.ill) s.hp -= P.illDrain;
      s.hp = clamp01(s.hp);
    }

    /* ---- World (uses: speed, hour, rate) ---- */
    // deriveWorld = recompute the *derived* world fields (light, temp) from W.hour.
    // Called from stepWorld() every tick AND from anywhere that mutates W.hour directly
    // (init(), setParam('hour',…)) so the light/temp gauges stay consistent even while the sim is paused
    // (no ticks running).
    function deriveWorld() {
      W.light = daylight(W.hour);
      W.temp = 18 + 6 * Math.sin((W.hour - 9) / 24 * 2 * Math.PI);   // ambient temperature: daily cycle 12-24°C
    }

    function stepWorld() {
      if (clock) { W.hour = (W.hour + DT) % 24; sync('hour'); }           // only the WORLD clock stops when unticked; the body keeps running
      deriveWorld();
    }

    /* ---- Sleep (uses: sleep, krise, kdecay, camp, cycle, expect, amp, tau, ent) ---- */
    // Process C, the body clock: free-runs at its own period, and light pulls it toward world time.
    function stepBodyClock(s, m) {
      const before = s.ct;                                                // before = body-clock time before this tick (to detect passing 12:00)
      s.ct = wrap24(s.ct + DT * 24 / P.tau);
      if (W.light > 0) s.ct = wrap24(s.ct + P.ent * W.light * (((W.hour - s.ct + 36) % 24) - 12) * DT);   // (...) = signed gap to world time, -12..+12 h
      const level = bodyClock(s.ct), offset = circOn ? P.amp * level : 0;
      return {
        ea: clamp(m.a + offset),                                    // ea = effective (displayed) arousal = stored arousal + body-clock offset
        offset,
        up: UP + P.camp * level, lo: LOW + P.camp * level,          // up = fall-asleep threshold, lo = wake-up threshold; both ride on Process C
        noon: before < 12 && s.ct >= 12
      };
    }
    // Process S, sleep pressure: rises while awake, decays while asleep (both exponential). Also keeps the daily sleep-debt ledger.
    function stepSleepPressure(s, noon) {
      s.sp += s.asleep ? (0 - s.sp) * P.kdecay * DT : (1 - s.sp) * P.krise * DT;
      s.slept += s.asleep ? DT : 0;
      if (noon && !s.led) { s.dbt = Math.max(0, s.dbt + P.expect - s.slept); s.slept = 0; s.led = true; }   
      // body clock passed 12:00: close the day's ledger (a shortfall adds debt, extra sleep pays it down)
      if (s.led && s.ct < 6) s.led = false;                                        
      // re-arm in the morning, so dragging the clock back and forth cannot close it twice
      s.dep = clamp01(s.dbt / P.expect);
      // 0 = well rested, 1 = total deprivation
      if (s.cool > 0) s.cool--;
    }
    
    // Sleep / wake decision and the NREM / REM cycle
    function stepSleepWake(s, body) {
      // wp = wake pressure: positive means "wake up now"
      const wp = (body.lo - s.sp) * .5 + Math.max(0, body.ea - P.sleep) * .3 + (1 - Math.min(s.h, s.wt)) * .2;   // [need for sleep gone] + [alarm: arousal too high] + [hunger or thirst]
      if (!s.asleep) {
        if (s.sp >= body.up && body.ea < P.sleep && wp <= 0 && !s.cool) startSleep();   // tired enough, calm enough, and nothing would wake it straight away
      } else if (wp > 0) {
        wake(s.sp <= body.lo);                                            // natural wake = the pressure ran out; otherwise it was interrupted
      } else {
        // Ultradian cycle: NREM then REM, repeating. Later in the night REM gets longer and NREM shorter.
        s.tin += DT; s.ut += DT * 60;
        const prog = clamp01(s.tin / P.nightlen);                           // prog = how far through the expected night (uses nightlen, separate from expect so the debt target and cycle reference can differ)
        const nrem = P.cycle * .75 * (1 - prog * .5), rem = P.cycle * .25 * (1 + prog * 2);   // lengths in minutes
        if (s.ut >= nrem + rem) s.ut = 0;
        behaviour = s.ut < nrem ? 'nrem' : 'rem';
      }
    }

    /* ---- Behaviour and random events ---- */
    // c = everything the rules can see: the agent's own state plus c.world. sat = how full is "full enough" (sleep-deprived agents need more food).
