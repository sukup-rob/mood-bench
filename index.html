    // chooseBehaviour = wrapper for decide(). Builds the decision context c and runs the behaviour-selection
    // cascade (overrides + weighted pick). Gated by tick() — only called when awake and on the decide schedule
    // (every P.decideevery ticks).
    function chooseBehaviour(s, m, ea) {
      const c = {
        h: s.h, wt: s.wt, hp: s.hp, ill: s.ill, v: m.v, a: ea, d: m.d, sat: Math.min(1, .7 * (1 + .3 * s.dep)),
        state: behaviour, asleep: s.asleep, temperament: TEMP, world: W
      };
      decide(c);
    }
    // chooseRandomEvents = roll the RANDOM table. Each row rolls its chance, then checks its dependencies (when),
    // and may push an event to Q or fire an act. A row may wake the agent or change behaviour, so c is refreshed
    // after each firing row for the later rows to see. Runs every tick regardless of sleep/decide schedule.
    function chooseRandomEvents(s, m, ea) {
      const c = {
        h: s.h, wt: s.wt, hp: s.hp, ill: s.ill, v: m.v, a: ea, d: m.d, sat: Math.min(1, .7 * (1 + .3 * s.dep)),
        state: behaviour, asleep: s.asleep, temperament: TEMP, world: W
      };
      for (const r of RANDOM) {
        // each random row rolls its chance, then checks its dependencies
        if (Math.random() < r.chance * P.rate * (r.hp ? s.hp : 1) && r.when(c))
        { if (r.event) Q.push(EVENT_BY_KEY[r.event]); if (r.act) r.act(W, s); c.asleep = s.asleep; c.state = behaviour; }
        // a row may change the agent (wake it), so refresh what the later rows see
      }
    }

    // Write this tick into the history that the charts read
    function record(s, m, body) {
      H.push({ v: m.v, a: body.ea, d: m.d, bv: s.bv, ba: clamp(s.ba + body.offset), bd: s.bd, h: s.h, wt: s.wt, hp: s.hp, sp: s.sp, b: behaviour });
      if (H.length > 600) H.shift();                                      // keep only the last 600 ticks
    }

    /* ============ Drawing ============ */
    const COL = { v: '#14a39a', a: '#d99a00', d: '#8a63d2', h: '#3d9a2a', wt: '#2f7fd0', hp: '#b5651d', sp: '#888' };   // series colours
    const GC = { threat: '#e04040', food: '#c9772b', social: '#d0488f', env: '#7a8a99', body: '#b5651d', sleep: '#4654d4', custom: '#666' };   // event group colours (for timeline tags + recent events chips). Sleep is blue-purple to distinguish from dominance line colour (#8a63d2).
    // SER = lines on the timeline: [key, text key]. SHOW = which are drawn (the checkboxes in the variable panel).
    const SER = [['v', 'val'], ['a', 'aro'], ['d', 'dom'], ['h', 'hun'], ['wt', 'hyd'], ['sp', 'slp'], ['hp', 'hlt']];
    const SHOW = { v: 1, a: 1, d: 0, h: 1, wt: 1, sp: 0, hp: 0 };
    const BASE_KEY = { v: 'bv', a: 'ba', d: 'bd' };   // which history field holds each line's baseline
    const STRETCH = { h: 1, wt: 1, sp: 1, hp: 1 };     // these are 0..1, so they are stretched over the chart's -1..1 axis
    let INK = '#000';   // INK = the page's text colour, re-read every frame so light/dark mode works

    // Prepare a canvas: match the screen's pixel ratio, clear it, reset every drawing setting. Returns [ctx, width, height].
    function fit(canvas) {
      const ratio = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * ratio) || canvas.height !== Math.round(h * ratio)) { canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio); }
      const x = canvas.getContext('2d');                                  // x = the 2D drawing context
      x.setTransform(ratio, 0, 0, ratio, 0, 0); x.clearRect(0, 0, w, h);
      x.globalAlpha = 1; x.lineWidth = 1; x.setLineDash([]); x.textAlign = 'left';   // settings persist between frames, so reset them
      x.font = '12px system-ui,sans-serif';
      x.fillStyle = x.strokeStyle = INK;
      return [x, w, h];
    }

    // Time series. Top strip = behaviour (y=0-5). Tag strip = number badges (y=6-25, ABOVE the lines).
    // Lines occupy y=lineTop..h-8 so tags never overlap the chart — no clearRect gap-knocking needed.
    function drawTimeline() {
      const [x, w, h] = fit($('#timeline'));
      const pad = 24, lineTop = 28;
      const Y = v => (lineTop + h - 8) / 2 - v * ((h - 8) - lineTop) / 2;   // Y: value (-1..1) to pixel row; lines occupy y=lineTop..h-8
      const L = H.length, X = i => pad + (i + 600 - L) / 599 * (w - pad);   // X: history index to pixel column; newest sits at the right edge
      x.globalAlpha = .25;
      for (const g of [-1, -.5, 0, .5, 1]) { x.beginPath(); x.moveTo(pad, Y(g)); x.lineTo(w, Y(g)); x.stroke(); }
      x.globalAlpha = .7;
      for (const g of [1, 0, -1]) x.fillText(g, 2, Y(g) + 4);
      MARKS.length = 0;
      if (!L) return;
      const tags = M.map(m => ({ m, i: m.n - (N - L) })).filter(o => o.i >= 0);   // tags that are still inside the chart window
      x.globalAlpha = .25;
      for (const { i } of tags) { x.beginPath(); x.moveTo(X(i), lineTop); x.lineTo(X(i), h); x.stroke(); }   
      // faint vertical line per event, only across the line area (below the tag strip)
      x.globalAlpha = 1;
      H.forEach((p, i) => { x.fillStyle = ST[p.b].col; x.fillRect(X(i), 0, (w - pad) / 599 + 1, 5); });   // behaviour strip at the very top
      const path = f => { x.beginPath(); H.forEach((p, i) => i ? x.lineTo(X(i), Y(f(p))) : x.moveTo(X(i), Y(f(p)))); x.stroke(); };
      for (const [k] of SER) {
        if (!SHOW[k]) continue;
        x.strokeStyle = COL[k];
        if (BASE_KEY[k]) { x.globalAlpha = .6; x.lineWidth = 1.5; x.setLineDash([4, 4]); path(p => p[BASE_KEY[k]]); }
        x.globalAlpha = 1; x.lineWidth = 2.2; x.setLineDash([]); path(p => STRETCH[k] ? 2 * p[k] - 1 : p[k]);
      }
      // Number tags live in the tag strip above the line area. Each tag is colored by the primary event group
      // of that tick (the first event in m.k), so you can scan the timeline visually — red = threat, orange = food, etc.
      x.font = '11px system-ui,sans-serif'; x.textAlign = 'center';
      for (const { m, i } of tags) {
        const px = X(i), label = String(m.id), tw = x.measureText(label).width + 8;
        const firstKey = m.k[0];
        const g = (firstKey && EVENT_BY_KEY[firstKey]) ? EVENT_BY_KEY[firstKey].g : 'custom';
        const col = GC[g] || GC.custom;
        x.globalAlpha = .9; x.fillStyle = col; x.fillRect(px - tw / 2, 7, tw, 16);   // colored badge background in the tag strip
        x.globalAlpha = 1; x.fillStyle = '#fff'; x.fillText(label, px, 18);            // white number on the badge
        MARKS.push({ x: px, m });
      }
    }

    // Valence (x axis) by arousal (y axis). The four quadrants come from Mendl et al. 2010, Fig. 1.
    function drawMoodPlane() {
      const [x, w, h] = fit($('#moodPlane'));
      const X = v => w / 2 + v * (w / 2 - 14), Y = a => h / 2 - a * (h / 2 - 14);
      x.globalAlpha = .3; x.strokeRect(14, 14, w - 28, h - 28);           // outer frame
      x.beginPath(); x.moveTo(w / 2, 14); x.lineTo(w / 2, h - 14); x.moveTo(14, h / 2); x.lineTo(w - 14, h / 2); x.stroke();   // centre cross
      x.globalAlpha = .12;
      for (const g of [-.5, .5]) { x.beginPath(); x.moveTo(X(g), 14); x.lineTo(X(g), h - 14); x.moveTo(14, Y(g)); x.lineTo(w - 14, Y(g)); x.stroke(); }   // grid
      x.globalAlpha = .75; x.textAlign = 'center';
      x.fillText(t.hi, w / 2, 11); x.fillText(t.lo, w / 2, h - 3);
      x.fillText(t.pos, w - 36, h / 2 - 4); x.fillText(t.neg, 36, h / 2 - 4);
      x.textAlign = 'right'; x.fillText(t.q[0], w - 20, 32); x.fillText(t.q[1], w - 20, h - 22);   // Q1, Q2 (positive valence)
      x.textAlign = 'left'; x.fillText(t.q[3], 20, 32); x.fillText(t.q[2], 20, h - 22);       // Q4, Q3 (negative valence)
      const L = H.length; if (!L) return;
      const trail = H.slice(-90); x.fillStyle = COL.v;                    // trail = the last 90 ticks
      trail.forEach((p, i) => { x.globalAlpha = i / trail.length * .5; x.beginPath(); x.arc(X(p.v), Y(p.a), 3, 0, 7); x.fill(); });
      const p = H[L - 1];
      x.globalAlpha = .8; x.strokeStyle = COL.a; x.setLineDash([3, 3]);
      x.beginPath(); x.arc(X(p.bv), Y(p.ba), 9, 0, 7); x.stroke();        // dashed ring = baseline
      x.globalAlpha = 1; x.beginPath(); x.arc(X(p.v), Y(p.a), 7, 0, 7); x.fill();   // dot = current mood
    }

    // A gauge with a fixed track from lo to hi. The fill starts at 0 (or at lo if the track has no negative side).
    // marks = optional values to mark with a vertical line (used for the sleep thresholds).
    function gauge(sel, name, val, lo, hi, loTxt, hiTxt, col, marks = []) {
      const [x, w, h] = fit($(sel));
      const X = v => 14 + (v - lo) / (hi - lo) * (w - 28), y = 26;        // X: value to pixel column
      x.globalAlpha = .3; x.lineWidth = 6; x.beginPath(); x.moveTo(X(lo), y); x.lineTo(X(hi), y); x.stroke();   // track
      if (lo < 0) { x.lineWidth = 1; x.beginPath(); x.moveTo(X(0), y - 8); x.lineTo(X(0), y + 8); x.stroke(); } // zero mark
      x.globalAlpha = .8; x.fillText(loTxt, 6, h - 4); x.textAlign = 'right'; x.fillText(hiTxt, w - 6, h - 4);
      x.textAlign = 'left';
      if (!H.length) return;
      x.globalAlpha = 1; x.strokeStyle = x.fillStyle = col; x.lineWidth = 6;
      x.beginPath(); x.moveTo(X(Math.max(lo, 0)), y); x.lineTo(X(val), y); x.stroke();   // fill
      x.beginPath(); x.arc(X(val), y, 8, 0, 7); x.fill();                                // marker
      x.strokeStyle = INK; x.lineWidth = 2;
      for (const m of marks) { const mm = Math.max(lo, Math.min(hi, m)); x.beginPath(); x.moveTo(X(mm), y - 11); x.lineTo(X(mm), y + 11); x.stroke(); }
      x.fillStyle = INK; x.textAlign = 'center'; x.fillText(name + ' ' + val.toFixed(2), w / 2, 11);
    }

    // Update the numbers, labels, and event list
    let lastLogKey = '';   // lastLogKey = what the event list showed last time, so it is rebuilt only when it changes
    function readout() {
      setText('#clockText', fmt('hour', W.hour));
      renderSurrounding();   // Rebuild the surrounding list every frame (objects age and despawn, TTL counts down)
      renderMemory();        //  rebuild the memory list every frame (learned associations update on event fire)
      const logKey = lang + ':' + evSeq;
      if (logKey !== lastLogKey) {
        lastLogKey = logKey;
        $('#eventLog').innerHTML = LOG.slice(0, 10).map(l => {
          // Each entry: a colored number badge (group of the first event in the tick) + time + color-coded chips (one per event).
          const firstE = l.k.length > 0 ? EVENT_BY_KEY[l.k[0]] : null;
          const numG = firstE ? firstE.g : 'custom';
          const numCol = GC[numG] || GC.custom;
          const chips = l.k.map(k => {
            const e = EVENT_BY_KEY[k];
            const g = e ? e.g : 'custom';
            const c = GC[g] || GC.custom;
            return `<span class="evChip" style="background:${c}">${eventLabel(k)}</span>`;
          }).join('');
          return `<div class="evRow"><span class="evNum" style="background:${numCol}">${l.id}</span><span class="evTime">${l.time}</span>${chips}</div>`;
        }).join('') || `<small>${t.logEmpty}</small>`;
      }
      const L = H.length;
      if (!L) { setText('#moodLabel', ''); setText('#behaviourLabel', ''); setText('#status', ''); return; }   // "nothing yet" e.g. just after Reset
      const p = H[L - 1], f = (v, b) => v.toFixed(2) + (b === undefined ? '' : ' (' + b.toFixed(2) + ')');   // baseline in compact parens, e.g. "-0.38"; baseline is also drawn as the dashed line on the chart
      for (const [k] of SER) setText('#value_' + k, f(p[k], BASE_KEY[k] && p[BASE_KEY[k]]));
      setText('#sleepDebt', t.debt + ': ' + S.dbt.toFixed(1) + 'h');   // sleep debt (hours)
      const quad = p.v >= 0 ? (p.a >= 0 ? 0 : 1) : (p.a >= 0 ? 3 : 2);   // quadrant index: 0 Q1 excited, 1 Q2 calm, 2 Q3 sad, 3 Q4 anxious
      setText('#moodLabel', Math.abs(p.v) < .15 && Math.abs(p.a) < .15 ? t.neutral : t.q[quad]);
      setText('#behaviourLabel', t.st[behaviour]); $('#behaviourLabel').style.color = ST[behaviour].col;
      setText('#status', [S.ill && t.sick, S.bv < P.thr && t.depl].filter(Boolean).join(' ') || t.hint);   // warnings first, otherwise the hint
    }

    /* ============ Main loop ============ */
    let last = performance.now(), owed = 0;   // last = previous frame time, owed = accumulated ticks still to run
    function frame(now) {
      INK = getComputedStyle(document.body).color;
      const dt = Math.min(.25, (now - last) / 1000); last = now;          // seconds since last frame, capped at 0.25
      // 10 ticks per second at speed 1. At most 60 ticks per frame: if the page lags, the sim falls behind real time instead of freezing the tab.
      if (run) { owed += dt * 10 * P.speed; let n = 0; while (owed >= 1 && n++ < 60) { tick(); owed--; } }
      const p = H[H.length - 1] || S, level = bodyClock(S.ct);            // S also has d, h, wt, hp and sp, so it stands in before the first tick
      drawTimeline(); drawMoodPlane();
      gauge('#gaugeDominance', t.dom, p.d, -1, 1, t.sb, t.dm, COL.d);
      gauge('#gaugeHunger', t.hun, p.h, 0, 1, t.sv, t.fl, COL.h);
      gauge('#gaugeHydration', t.hyd, p.wt, 0, 1, t.dh, t.hy, COL.wt);
      gauge('#gaugeHealth', t.hlt, p.hp, 0, 1, t.hl0, t.hl1, COL.hp);
      gauge('#gaugeLight', t.light, W.light, 0, 1, t.dark, t.bright, '#e0b020');
      gauge('#gaugeSleep', t.slp, p.sp, 0, 1, t.rest, t.tired, COL.sp, [LOW + P.camp * level, UP + P.camp * level]);   // black lines = wake and sleep thresholds
      gauge('#gaugeTemp', t.tempg, W.temp, -10, 40, t.cold, t.hot, '#d97740', [K.tempIdeal]);   // ambient temperature with comfort mark at K.tempIdeal (20°C)
      readout();
      requestAnimationFrame(frame);
    }

    /* ============ UI ============ */
    const sign = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1);   // format a number with + or −
    // fmt = format a slider value for display. Hours become HH:MM (rounded as whole minutes, so ":60" cannot appear).
    const fmt = (key, v, step) => {
      if (key === 'hour') { const m = Math.round(v * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
      return (+v).toFixed((String(step).split('.')[1] || '').length);
    };
    const clockLabel = () => {   // updates the optClock checkbox's tooltip when the speed slider changes (label text is just t.clock, set once by addCheck)
      const el = $('#optClockLabel');
      if (el && el.parentElement) el.parentElement.title = t.clockTip.replace('{s}', (2 / P.speed).toFixed(1));
    };
    const evName = e => t.ev[e.k] || e.k.replace(/_/g, ' ').replace(/^./, ch => ch.toUpperCase());          // translated name, or made from the key
    const eventLabel = k => EVENT_BY_KEY[k] ? evName(EVENT_BY_KEY[k]) : t.cust;                              // name for an event key ('custom' has no table row)
    // glyph = three little bars (valence, arousal, dominance) in the series colours: up = the event raises it, down = lowers it
    const glyph = e => `<svg width="38" height="22" aria-hidden="true">${['v', 'a', 'd'].map((k, i) => {
      const impact = e.amb ? 0 : e[k], bar = Math.abs(impact) * 10;
      return `<rect x="${i * 13}" y="${impact >= 0 ? 11 - bar : 11}" width="9" height="${Math.max(bar, .6)}" fill="${COL[k]}"/>`;
    }).join('')}<line x1="0" x2="38" y1="11" y2="11" stroke="currentColor" opacity=".4"/></svg>`;

    // Add one labelled slider to `box`. The input event is handled by a delegated listener
    // on #params in wireUI() (which dispatches by slider ID prefix) — no per-element
    // attachment here, so re-rendering the parameter tree doesn't re-attach N listeners.
    // Ids: slider_<key>, out_<key>.
    function addSlider(box, key, label, min, max, step, val) {
      const d = document.createElement('div');
      d.innerHTML = `<label>${label} <output id="out_${key}"></output><br><input type="range" id="slider_${key}" min="${min}" max="${max}" step="${step}" style="width:100%"></label>`;
      box.appendChild(d);
      const input = d.querySelector('input'), out = d.querySelector('output');
      input.value = val; out.textContent = fmt(key, val, step);
    }
    // Move a slider to match a value the code changed (the running clock)
    function sync(key) {
      const input = $('#slider_' + key), row = SLIDERS.find(r => r[0] === key); if (!input || !row) return;   // only the main sliders have a row
      const v = getParam(key);   // 'hour' lives in W now; everything else in P
      input.value = v; $('#out_' + key).textContent = fmt(key, v, row[3]);
    }
    // A titled box with a grid inside (used for event groups) and a collapsible branch of the parameter tree.
    function addGroup(parent, title) {
      const f = document.createElement('fieldset');
      f.innerHTML = `<legend>${title}</legend><div class="grid"></div>`;
      parent.appendChild(f);
      return f.lastChild;
    }
    function addBranch(parent, title) {
      const d = document.createElement('details');
      d.innerHTML = `<summary>${title}</summary><div class="grid"></div>`;
      parent.appendChild(d);
      return d.lastChild;
    }

    // buildText = set all translated text on the page (data-t, data-a, labels). Called from build() on load + language change.
    function buildText() {
      t = T[lang]; document.documentElement.lang = lang; document.title = t.title;
      document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
      document.querySelectorAll('[data-a]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.a]); el.title = t[el.dataset.a]; });
      $('#pause').textContent = run ? t.pause : t.resume;
      clockLabel();
      lastLogKey = '';
      $('#behaviourLegend').innerHTML = Object.keys(ST).map(k => `<span style="color:${ST[k].col}">\u25a0</span> ${t.st[k]}`).join(' &nbsp; ');
    }

    // buildVariablePanel = the checkboxes + live numbers next to the timeline.
    // The change event is delegated on #variableList in wireUI() — no per-element attachment.
    function buildVariablePanel() {
      $('#variableList').innerHTML = SER.map(([k, n]) => `<label><input type="checkbox" data-s="${k}" ${SHOW[k] ? 'checked' : ''}> <span style="color:${COL[k]}">\u25a0</span> ${t[n]} <b id="value_${k}"></b></label><br>`).join('');
    }


    // buildParameterTree = all parameter sliders grouped by branch + temperament sub-branch.
    // input + change events on the sliders and optClock/optCircadian checkboxes are
    // delegated on #params in wireUI() — no per-element attachments here, so re-rendering
    // the parameter tree (e.g. on language change) doesn't re-attach N listeners.
    function buildParameterTree() {
      const root = $('#params'); root.innerHTML = '';
      [['gm', 0], ['gn', 1], ['gs', 2], ['gw', 3], ['gh', 4], ['gb', 5], ['gl', 7], ['gpv', 8]].forEach(([title, group]) => {
        const branch = addBranch(root, t[title]);
        SLIDERS.filter(row => row[4] === group).forEach(([k, min, max, step]) => {
          addSlider(branch, k, t.p[k], min, max, step, getParam(k));
          const tip = t.pd[k];
          if (tip) { const el = $('#slider_' + k); el.title = tip; if (el.parentElement) el.parentElement.title = tip; }
        });
      });
      const tempBranch = addBranch(root, t.temph);
      Object.keys(TEMP).forEach(k => addSlider(tempBranch, 'temp_' + k, t.tp[k], 0, 1, .05, TEMP[k]));
      // Clock / light / rhythm options: built dynamically here so they inherit the same bordered-box style
      // as the other parameter branches. Each checkbox's change event is handled by the delegated listener
      // on #params (which dispatches on the checkbox ID).
      const woptBranch = addBranch(root, t.wopt);
      const addCheck = (id, labelKey, tipKey, checked, spanId) => {
        const lbl = document.createElement('label');
        lbl.style.cssText = 'display:block;margin:2px 0';
        const text = typeof labelKey === 'string' ? t[labelKey] : labelKey();
        const tip = typeof tipKey === 'string' ? t[tipKey] : (tipKey ? tipKey() : '');
        lbl.innerHTML = `<input type="checkbox" id="${id}" ${checked ? 'checked' : ''}> <span${spanId ? ` id="${spanId}"` : ''}>${text}</span>`;
        if (tip) lbl.title = tip;
        woptBranch.appendChild(lbl);
        return lbl;
      };
      // optClock's span gets id="optClockLabel" so clockLabel() can update its tooltip when the speed slider changes.
      addCheck('optClock', 'clock', () => t.clockTip.replace('{s}', (2 / P.speed).toFixed(1)), clock, 'optClockLabel');
      addCheck('optCircadian', 'circ', 'circTip', circOn);
    }

    // buildCustomEventComposer = the three "+ add pulse" buttons + queue list.
    // The click event is delegated on #customButtons in wireUI() — each button carries data-dim.
    function buildCustomEventComposer() {
      $('#customButtons').innerHTML = '';
      [['v', 'val', '#14a39a'], ['a', 'aro', '#d99a00'], ['d', 'dom', '#8a63d2']].forEach(([dim, lbl, col]) => {
        const btn = document.createElement('button');
        btn.id = 'cadd_' + dim;
        btn.dataset.dim = dim;
        btn.innerHTML = `<span style="color:${col}">\u25a0</span> ${t.custAddFmt.replace('{dim}', t[lbl])}`;
        btn.style.borderColor = col;
        $('#customButtons').appendChild(btn);
      });
      renderCustomQueue();
    }

    // buildEventGrid = the preset event buttons, grouped by category.
    // Click events are delegated on #events in wireUI() — buttons carry data-event-key,
    // data-cust-idx, or data-cust-del-idx depending on which action they trigger.
    function buildEventGrid() {
      $('#events').innerHTML = '';
      // Sleep events only — these are "more complicated than random" (they force the sleep state machine
      // via force:true in the #events click handler). Random events get trigger buttons in the random-rate
      // config (#randomCfg) instead; US events (ate_food, drank_water, predator_attack) fire via archetype
      // approach. The big preset grid that duplicated all those is gone.
      const sleepBox = addGroup($('#events'), t.eg.sleep); sleepBox.classList.add('eventGrid');
      EVENTS.filter(e => e.g === 'sleep' && !e.hide).forEach(e => {
        const button = document.createElement('button');
        button.style.cssText = 'width:100%;text-align:left';
        button.dataset.eventKey = e.k;
        button.title = e.amb ? t.amb
          : e.pulses ? e.pulses.map(p => `${p.dim === 'v' ? t.val : p.dim === 'a' ? t.aro : t.dom} ${sign(p.amp)} (\u03c4=${p.tau})`).join('  \u00b7  ')
            : `${t.val} ${sign(e.v)}  ${t.aro} ${sign(e.a)}  ${t.dom} ${sign(e.d)}`;
        button.innerHTML = `${glyph(e)}<br><b>${evName(e)}</b>${e.amb ? `<br><small>${t.amb}</small>` : ''}`;
        sleepBox.appendChild(button);
      });
      // Custom events group (user-defined, saved to localStorage). Each entry is a button + small × delete.
      const custBox = addGroup($('#events'), t.custEventGroupCustom); custBox.classList.add('eventGrid');
      if (CUSTOM_EVENTS.length === 0) {
        const empty = document.createElement('small');
        empty.textContent = t.custEmpty;
        empty.style.cssText = 'opacity:.6;grid-column:1/-1';
        custBox.appendChild(empty);
      } else {
        CUSTOM_EVENTS.forEach((e, i) => {
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;gap:4px;align-items:stretch';
          const button = document.createElement('button');
          button.style.cssText = 'flex:1;text-align:left;min-width:0';
          button.dataset.custIdx = i;
          const sideFx = [];
          if (e.hp) sideFx.push(`hp ${sign(e.hp)}`);
          if (e.food) sideFx.push(`${t.custEventFood} ${e.food}`);
          if (e.water) sideFx.push(`${t.custEventWater} ${e.water}`);
          button.title = `${t.val} ${sign(e.v)}  ${t.aro} ${sign(e.a)}  ${t.dom} ${sign(e.d)}` + (sideFx.length ? '  ·  ' + sideFx.join('  ') : '');
          button.innerHTML = `${glyph(e)}<br><b>${evName(e)}</b>`;
          const del = document.createElement('button');
          del.textContent = '×';
          del.dataset.custDelIdx = i;
          del.style.cssText = 'flex:0 0 auto;width:24px;padding:0;background:transparent;border:1px solid currentColor;border-radius:3px;cursor:pointer;color:#e04040;font-size:14px;line-height:1';
          del.title = t.custEventDelete;
          wrap.appendChild(button);
          wrap.appendChild(del);
          custBox.appendChild(wrap);
        });
      }
    }

    // ---------- Bestiary + memory panel UI (moved here from the Memory & learning section) ----------
    // These four functions read ARCHETYPES / TYPE_TO_US / memory / objectSvg to build/refresh
    // the bestiary list (#bestiary), the add-archetype form (#archForm), the custom-event
    // editor form (#custEventForm), and the memory list (#memoryList). Pure DOM — no sim logic.
    // (Originally colocated with the memory Map for "nearby data" reasons; moved here so the
    // Memory & learning section contains only memory logic + lifecycle.)

    // renderBestiary = show the archetype catalog grouped by event group (threat/food/social/env/body/sleep/neutral).
    // Each group header uses t.eg[g] (existing translation). Neutral (no events) uses t.eg.neutral.
    function renderBestiary() {
      const list = $('#bestiary');
      if (!list) return;
      const byGroup = {};
      for (const [name, arch] of Object.entries(ARCHETYPES)) {
        const firstEvent = arch.events[0];
        const g = firstEvent ? (EVENT_BY_KEY[firstEvent]?.g || 'other') : 'neutral';
        (byGroup[g] ??= []).push([name, arch]);
      }
      // Sort groups in a stable, meaningful order
      const groupOrder = ['threat', 'food', 'social', 'env', 'body', 'sleep', 'neutral', 'other'];
      const sortedGroups = Object.entries(byGroup).sort((a, b) => groupOrder.indexOf(a[0]) - groupOrder.indexOf(b[0]));
      list.innerHTML = sortedGroups.map(([g, entries]) => {
        const groupLabel = t.eg[g] || g;
        const items = entries.map(([name, arch]) => {
          const feats = `${t.feat.size[arch.features.size]} \u00b7 ${t.feat.color[arch.features.color]} \u00b7 ${t.feat.shape[arch.features.shape]}`;
          // Per-archetype spawn-rate config: a compact table of state-rate inputs (encounters/sim-hour,
          // CFG_STATES only — approach/flee hidden) + a despawn input. Hidden until the gear button is
          // clicked. Changes write through live (delegated in wireUI). Display = per-tick × TICKS_PER_HOUR.
          const cfgRows = CFG_STATES.map(s => {
            const v = (arch.spawns?.[s] ?? 0) * TICKS_PER_HOUR;
            return `<tr><td>${STATE_LABELS[s]}</td><td><input type="number" class="spawnCell" data-name="${name}" data-state="${s}" step="0.01" min="0" value="${+v.toFixed(3)}" title="${t.spawnCellTip}"></td></tr>`;
          }).join('');
          const av = arch.surroundAgeRate ?? 1;
          const ageRow = `<tr><td>${t.ageh}</td><td><input type="number" class="spawnCell" data-name="${name}" data-field="age" step="0.1" min="0" value="${av}" title="${t.ageCellTip}"></td></tr>`;
          return `<div class="bestItem">${objectSvg(arch.features)} <b>${name}</b> ${feats} <button class="spawnArch" data-name="${name}">+</button><button class="archCfg" data-name="${name}" title="${t.spawnTip}">\u2699</button><div class="bestCfg" hidden><table><tbody>${cfgRows}${ageRow}</tbody></table></div></div>`;
        }).join('');
        return `<div class="bestCat">${groupLabel}</div><div class="bestCatGrid">${items}</div>`;
      }).join('');
      // Click on .spawnArch / .archCfg and input on .spawnCell are delegated on #bestiary in wireUI().
    }

    // SPAWN_STATES + STATE_LABELS = the behaviour states that can spawn objects, and short labels for the
    // per-archetype spawn-rate config form (rendered inline inside each bestiary item by renderBestiary).
    // nrem/rem are excluded — no archetype spawns while sleeping. Each archetype's config is a compact
    // table of state-rate inputs + a despawn (surroundAgeRate) input, toggled by the gear button.
    // CFG_STATES = SPAWN_STATES minus approach_object/flee_object — those are agent reaction states, not
    // environment conditions, so they're hidden from the config UI (their source defaults still apply).
    // TICKS_PER_HOUR = ticks per sim-hour (DT = 0.05 sim-hours/tick → 20). The UI displays spawn rates as
    // encounters per sim-hour (= per-tick rate × TICKS_PER_HOUR) and converts back to per-tick on input.
    const SPAWN_STATES = ['idle', 'foraging', 'socialising', 'explore', 'approach_object', 'flee_object'];
    const STATE_LABELS = { idle: 'idle', foraging: 'forage', socialising: 'social', explore: 'explore', approach_object: 'approach', flee_object: 'flee' };
    const CFG_STATES = SPAWN_STATES.filter(s => s !== 'approach_object' && s !== 'flee_object');
    const TICKS_PER_HOUR = 1 / DT;

    // renderRandomCfg = build the live-tunable random-event chances editor. One row per RANDOM entry,
    // a single number input showing encounters/sim-hour (= per-tick chance × TICKS_PER_HOUR). Changes
    // write through to r.chance (÷ TICKS_PER_HOUR) immediately and persist to localStorage. The global
    // 'rate' slider multiplies all of these on top — it is not duplicated here. Called from build().
    function renderRandomCfg() {
      const box = $('#randomCfg');
      if (!box) return;
      const rows = RANDOM.map(r => {
        const label = r.id.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
        const v = r.chance * TICKS_PER_HOUR;
        return `<tr><td>${label}</td><td><input type="number" class="randChance" data-id="${r.id}" step="0.01" min="0" value="${+v.toFixed(3)}" title="${t.randChanceTip}"></td><td><button class="randTrigger" data-id="${r.id}" title="${t.randTriggerTip}">\u25b6</button></td></tr>`;
      }).join('');
      box.innerHTML = `<table><tbody>${rows}</tbody></table>`;
    }

    // buildArchForm = populate the add-archetype modal's dropdowns (translated). Called from build().
    // The "Outcome" dropdown now lists EVENTS directly (no more TYPE_TO_US indirection) — the user picks
    // which event fires when this archetype is approached. Multi-event archetypes (like rival) are
    // not editable via this form; edit ARCHETYPES in source for those.
    function buildArchForm() {
      const form = $('#archForm');
      if (!form) return;
      form.innerHTML = `
    <label>${t.archName} <input type="text" id="archName" size="10"></label>
    <label>${t.archUT} <select id="archUT">${EVENTS.filter(e => !e.hide).map(e => `<option value="${e.k}">${evName(e)}</option>`).join('')}</select></label>
    <label>${t.archSize} <select id="archSize">${SURR_FEATURES.size.map(s => `<option value="${s}">${t.feat.size[s]}</option>`).join('')}</select></label>
    <label>${t.archColor} <select id="archColor">${SURR_FEATURES.color.map(s => `<option value="${s}">${t.feat.color[s]}</option>`).join('')}</select></label>
    <label>${t.archShape} <select id="archShape">${SURR_FEATURES.shape.map(s => `<option value="${s}">${t.feat.shape[s]}</option>`).join('')}</select></label>
  `;
    }

    // buildCustEventForm = populate the custom-event editor modal's fields (translated). Called from build().
    // The form fields: name (text), group (dropdown), v/a/d impacts (number -1..1), hp/food/water (number, optional).
    // On Create, the form values are read by the #custEventCreate click handler (below the script body).
    function buildCustEventForm() {
      const form = $('#custEventForm');
      if (!form) return;
      const groups = ['threat', 'food', 'social', 'env', 'body', 'sleep', 'custom'];
      form.innerHTML = `
    <label>${t.custEventName} <input type="text" id="custEventName" size="14"></label>
    <label>${t.custEventGroup} <select id="custEventGroupSelect">${groups.map(g => `<option value="${g}">${t.eg[g] || g}</option>`).join('')}</select></label>
    <label>${t.custEventV} <input type="number" id="custEventV" step="0.1" value="0" min="-1" max="1"></label>
    <label>${t.custEventA} <input type="number" id="custEventA" step="0.1" value="0" min="-1" max="1"></label>
    <label>${t.custEventD} <input type="number" id="custEventD" step="0.1" value="0" min="-1" max="1"></label>
    <label>${t.custEventHP} <input type="number" id="custEventHP" step="0.1" value="0" min="-1" max="1"></label>
    <label>${t.custEventFood} <input type="number" id="custEventFood" step="0.1" value="0" min="0" max="1"></label>
    <label>${t.custEventWater} <input type="number" id="custEventWater" step="0.1" value="0" min="0" max="1"></label>
  `;
    }

    // renderMemory = rebuild the memory list DOM. Called every frame from readout().
    function renderMemory() {
      const list = $('#memoryList');
      if (!list) return;
      if (memory.size === 0) { list.innerHTML = `<small>${t.memEmpty}</small>`; return; }
      list.innerHTML = Array.from(memory.entries())
        .sort((a, b) => a[1].valence - b[1].valence)   // sort by valence: most negative (fear) first, most positive (attraction) last
        .map(([key, entry]) => {
          const [size, color, shape] = key.split('|');
          const features = { size, color, shape };
          const valCol = entry.valence >= 0 ? COL.h : COL.v;   // green for positive, teal for negative
          const valStr = (entry.valence >= 0 ? '+' : '') + entry.valence.toFixed(2);
          const feats = `${t.feat.size[size]} \u00b7 ${t.feat.color[color]} \u00b7 ${t.feat.shape[shape]}`;
          const sal = Math.abs(entry.valence) * entry.conf;   // 0..1, how much this memory matters
          const opa = (.08 + sal * .8).toFixed(2);              // faded for weak memories, bold for strong ones
          return `<div class="memItem" style="background:rgba(127,127,127,${opa})">${objectSvg(features)} ${feats} <span class="memVal" style="color:${valCol}">${valStr}</span> <span class="memConf">conf ${(entry.conf * 100).toFixed(0)}%</span> <span class="memCount">\u00d7${entry.count}</span></div>`;
        }).join('');
    }

    // (Re)build everything that holds text. Runs at load and on every language change.
    function build() {
      buildText();
      buildVariablePanel();
      buildParameterTree();
      buildCustomEventComposer();
      buildEventGrid();
      $('#slider_hour').disabled = clock;
      renderRefs();
      renderBestiary();
      renderRandomCfg();
      buildArchForm();
      buildCustEventForm();
    }

    // Render the staged custom-event pulse queue. Each item is a row with inline-editable
    // amp + τ sliders (no per-dim defaults — every spike starts at amp=0, τ=10 and is tuned in place).
    // Called from build() (so it re-renders on language change) and whenever the queue changes.
    const TICK_REAL_S = 0.1;   // seconds of real time per tick at speed 1 (10 ticks/sec)
    const TICK_SIM_MIN = 3;    // sim minutes per tick (DT = 0.05 sim hours)
    const PULSE_LIFE = 5.3;   // ~exp(-x) drop threshold: pulse fades to <0.5% of amp after ~5.3×τ ticks
    function fmtLife(tau) {
      const realS = (PULSE_LIFE * tau * TICK_REAL_S).toFixed(1);
      const simMin = Math.round(PULSE_LIFE * tau * TICK_SIM_MIN);
      return `~${realS}s / ${simMin} sim-min`;
    }
    function renderCustomQueue() {
      const q = $('#customQueue');
      if (!q) return;
      q.innerHTML = customQueue.length === 0
        ? `<small>${t.custEmpty}</small>`
        : customQueue.map((p, i) => {
          const lbl = p.dim === 'v' ? 'val' : p.dim === 'a' ? 'aro' : 'dom';
          return `<div class="queueItem">
          <span style="color:${COL[p.dim]}">■</span> ${t[lbl]}
          <label>${t.custAmp} <input type="range" class="qsl_a" data-idx="${i}" min="-1" max="1" step=".05" value="${p.amp}"><output>${p.amp.toFixed(2)}</output></label>
          <label>${t.custTau} <input type="range" class="qsl_t" data-idx="${i}" min="1" max="500" step="1" value="${p.tau}"><output>${p.tau}</output></label>
          <span class="life">${fmtLife(p.tau)}</span>
          <button class="rmCustom" data-idx="${i}" aria-label="×">×</button>
        </div>`;
        }).join('');
      // input + click events are delegated on #customQueue in wireUI() — no per-element attachments here.
    }
    /* ============ UI event wiring (delegated) ============ */
    // wireUI attaches every event listener ONCE on script load. Listeners on stable
    // parents (#customQueue, #bestiary, #events, #variableList, #params, #customButtons,
    // #timeline) catch clicks/changes/inputs from their children via event bubbling —
    // no re-attachment when build() re-renders the DOM on language change. Static
    // element handlers (#pause, #reset, #sidebtn, #lang, modal open + create buttons)
    // attach once here too.
    //
    // Convention: every dynamically-created interactive element carries a data-* attribute
    // (data-idx, data-type, data-event-key, data-cust-idx, data-cust-del-idx, data-dim,
    // data-s) so the delegated handler can identify which child was acted on. The older
    // forEach(b => b.onclick = ...) patterns were dropped during the delegation refactor.
    function wireUI() {
      // ===== Static button handlers (attach once) =====
      $('#pause').addEventListener('click', () => { run = !run; $('#pause').textContent = run ? t.pause : t.resume; });
      $('#reset').addEventListener('click', init);
      $('#sidebtn').addEventListener('click', () => { const side = $('#side'); side.hidden = !side.hidden; $('#sidebtn').setAttribute('aria-expanded', !side.hidden); });
      $('#lang').addEventListener('click', () => { lang = lang === 'en' ? 'cs' : 'en'; build(); });

      // Custom event composer buttons
      $('#fireCustom').addEventListener('click', () => {
        if (customQueue.length === 0) return;                              // nothing staged → no-op (avoids a free mood blip)
        Q.push({ g: 'custom', k: 'custom', pulses: customQueue.map(p => ({ ...p })) });   // pulses go straight through pulsesOf() — no SHAPE fallback. Salience is calculated from the pulse amps.
      });
      $('#clearCustom').addEventListener('click', () => { customQueue.length = 0; renderCustomQueue(); });
      $('#randomEvent').addEventListener('click', () => {
        // Pick a random non-sleep event, decompose it into pulses (via pulsesOf), and load them into the custom queue.
        // The user can then inspect / adjust / fire — no more firing straight to Q. (For ambiguous events the impacts are read through the current baseline mood, same as in fireEvents.)
        const pool = EVENTS.filter(e => e.g !== 'sleep');
        const e = pool[Math.floor(Math.random() * pool.length)];
        const imp = e.amb ? { v: K.ambValence * S.bv, a: K.ambArousal + K.ambArousalBase * S.ba, d: 0 } : e;
        customQueue.length = 0;
        for (const p of pulsesOf(e, imp)) customQueue.push({ dim: p.dim, amp: p.amp, tau: p.tau });
        renderCustomQueue();
      });

      // Modal open buttons
      $('#refs').addEventListener('click', () => { $('#refsModal').hidden = false; });
      $('#openArchEditor').addEventListener('click', () => { $('#archModal').hidden = false; });
      $('#openCustEventEditor').addEventListener('click', () => { $('#custEventModal').hidden = false; });

      // Modal "create" buttons
      $('#archCreate').addEventListener('click', () => {
        const form = $('#archForm');
        const name = form.querySelector('#archName').value.trim();
        if (!name || ARCHETYPES[name]) return;
        ARCHETYPES[name] = {
          features: {
            size: form.querySelector('#archSize').value,
            color: form.querySelector('#archColor').value,
            shape: form.querySelector('#archShape').value,
          },
          events: [form.querySelector('#archUT').value],   // single event (the picked one) — for multi-event archetypes, edit source
        };
        renderBestiary();
        $('#archModal').hidden = true;
      });
      $('#custEventCreate').addEventListener('click', () => {
        const form = $('#custEventForm');
        const rawName = form.querySelector('#custEventName').value.trim();
        if (!rawName) return;
        // Sanitize name → event key: lowercase, replace non-alphanumeric with _, prefix 'custom_' to avoid collisions with built-in keys.
        const k = 'custom_' + rawName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        // Refuse if a custom event with this key already exists (avoid duplicates).
        if (CUSTOM_EVENTS.some(e => e.k === k)) return;
        const num = id => { const v = parseFloat(form.querySelector(id).value); return isNaN(v) ? 0 : v; };
        const e = { g: form.querySelector('#custEventGroupSelect').value, k, v: num('#custEventV'), a: num('#custEventA'), d: num('#custEventD') };
        const hp = num('#custEventHP'), food = num('#custEventFood'), water = num('#custEventWater');
        if (hp) e.hp = hp;
        if (food) e.food = food;
        if (water) e.water = water;
        CUSTOM_EVENTS.push(e);
        saveCustomEvents();
        buildEventGrid();
        $('#custEventModal').hidden = true;
        // Clear the form for next time
        form.querySelector('#custEventName').value = '';
      });

      // ===== Timeline hover (delegated on #timeline canvas) =====
      // Hovering a numbered tag on the timeline shows which events it stands for. When no tag is hovered,
      // the title is cleared (so the canvas doesn't carry a persistent "Mood over time" tooltip that
      // flickers on every mouse move). Hit zone widened to 14px (was 7) so the numbers are actually hoverable.
      $('#timeline').addEventListener('mousemove', e => {
        const px = e.clientX - e.target.getBoundingClientRect().left;
        const tag = MARKS.find(mk => Math.abs(mk.x - px) < 14);
        e.target.title = tag ? '#' + tag.m.id + ' · ' + tag.m.k.map(eventLabel).join(', ') : '';
      });
      $('#timeline').addEventListener('mouseleave', e => { e.target.title = ''; });

      // ===== Variable panel checkboxes — delegate on #variableList =====
      $('#variableList').addEventListener('change', e => {
        const box = e.target.closest('input[type=checkbox][data-s]');
        if (!box) return;
        SHOW[box.dataset.s] = box.checked;
      });

      // ===== #params: slider input + optClock/optCircadian change (delegated) =====
      // Sliders dispatch by ID prefix: 'slider_temp_*' writes to TEMP, others write to P via setParam.
      // 'speed' is special-cased to also refresh the optClock tooltip.
      $('#params').addEventListener('input', e => {
        const slider = e.target.closest('input[type=range]');
        if (!slider || !slider.id || !slider.id.startsWith('slider_')) return;
        const k = slider.id.slice('slider_'.length);
        const v = +slider.value;
        const out = document.getElementById('out_' + k);
        if (out) out.textContent = fmt(k, v, slider.step);
        if (k.startsWith('temp_')) {
          TEMP[k.slice('temp_'.length)] = v;
        } else {
          setParam(k, v);
          if (k === 'speed') clockLabel();
        }
      });
      $('#params').addEventListener('change', e => {
        const box = e.target.closest('input[type=checkbox]');
        if (!box) return;
        if (box.id === 'optClock') {
          clock = box.checked;
          const sliderHour = document.getElementById('slider_hour');
          if (sliderHour) sliderHour.disabled = clock;
        } else if (box.id === 'optCircadian') {
          circOn = box.checked;
        }
      });

      // ===== Bestiary — delegate click + input on #bestiary =====
      // .spawnArch = spawn one instance now. .archCfg = toggle that archetype's spawn-rate config.
      // input.spawnCell = live write of spawn rate / despawn rate to ARCHETYPES (no persistence).
      $('#bestiary').addEventListener('click', e => {
        const spawnBtn = e.target.closest('.spawnArch');
        if (spawnBtn) {
          const name = spawnBtn.dataset.name;
          if (ARCHETYPES[name]) spawnObject(name);
          renderSurrounding();
          return;
        }
        const cfgBtn = e.target.closest('.archCfg');
        if (cfgBtn) {
          const cfg = cfgBtn.parentElement.querySelector('.bestCfg');
          if (cfg) cfg.hidden = !cfg.hidden;
        }
      });
      $('#bestiary').addEventListener('input', e => {
        const inp = e.target.closest('input.spawnCell');
        if (!inp) return;
        const name = inp.dataset.name;
        const arch = ARCHETYPES[name];
        if (!arch) return;
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        if (inp.dataset.field === 'age') {
          arch.surroundAgeRate = v;   // despawn rate is a raw multiplier — no conversion
        } else {
          // Spawn rates display as encounters/sim-hour; convert back to per-tick for storage.
          const tickRate = v / TICKS_PER_HOUR;
          const state = inp.dataset.state;
          if (!arch.spawns) arch.spawns = {};
          if (tickRate === 0) delete arch.spawns[state];   // keep the table clean — 0 = unspecified
          else arch.spawns[state] = tickRate;
        }
      });

      // ===== Random-event chances — delegate on #randomCfg (live writes + persist) =====
      $('#randomCfg').addEventListener('input', e => {
        const inp = e.target.closest('input.randChance');
        if (!inp) return;
        const row = RANDOM.find(r => r.id === inp.dataset.id);
        if (!row) return;
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        row.chance = v / TICKS_PER_HOUR;   // encounters/sim-hour → per-tick
        saveRandomChances();
      });
      // Trigger button: fire a random event manually (bypasses chance roll + when-gate).
      $('#randomCfg').addEventListener('click', e => {
        const btn = e.target.closest('button.randTrigger');
        if (!btn) return;
        const r = RANDOM.find(row => row.id === btn.dataset.id);
        if (!r) return;
        if (r.event) Q.push(EVENT_BY_KEY[r.event]);
        if (r.act) r.act(W, S);
      });

      // ===== Custom-event add buttons — delegate on #customButtons =====
      $('#customButtons').addEventListener('click', e => {
        const btn = e.target.closest('button[data-dim]');
        if (!btn) return;
        customQueue.push({ dim: btn.dataset.dim, amp: 0, tau: 10 });
        renderCustomQueue();
      });

      // ===== Custom queue: amp/τ sliders (input) + remove buttons (click) — delegate on #customQueue =====
      $('#customQueue').addEventListener('input', e => {
        const aSlider = e.target.closest('.qsl_a');
        if (aSlider) {
          const i = +aSlider.dataset.idx;
          customQueue[i].amp = +aSlider.value;
          aSlider.parentElement.querySelector('output').textContent = (+aSlider.value).toFixed(2);
          return;
        }
        const tSlider = e.target.closest('.qsl_t');
        if (tSlider) {
          const i = +tSlider.dataset.idx;
          customQueue[i].tau = +tSlider.value;
          tSlider.parentElement.querySelector('output').textContent = tSlider.value;
          const item = tSlider.closest('.queueItem');
          if (item) item.querySelector('.life').textContent = fmtLife(+tSlider.value);
          return;
        }
      });
      $('#customQueue').addEventListener('click', e => {
        const rmBtn = e.target.closest('.rmCustom');
        if (!rmBtn) return;
        customQueue.splice(+rmBtn.dataset.idx, 1);
        renderCustomQueue();
      });

      // ===== Event grid: preset buttons + custom event buttons + delete buttons — delegate on #events =====
      $('#events').addEventListener('click', e => {
        // Delete button on a saved custom event
        const del = e.target.closest('button[data-cust-del-idx]');
        if (del) {
          CUSTOM_EVENTS.splice(+del.dataset.custDelIdx, 1);
          saveCustomEvents();
          buildEventGrid();
          return;
        }
        // Saved custom event fire button
        const custBtn = e.target.closest('button[data-cust-idx]');
        if (custBtn) {
          Q.push(CUSTOM_EVENTS[+custBtn.dataset.custIdx]);   // fire the saved event directly (no force flag, no act — just push to Q)
          return;
        }
        // Preset event button
        const evtBtn = e.target.closest('button[data-event-key]');
        if (evtBtn) {
          const ev = EVENT_BY_KEY[evtBtn.dataset.eventKey];
          if (ev) Q.push(ev.g === 'sleep' ? { ...ev, force: true } : ev);
          return;
        }
      });

      // ===== Escape closes all modals =====
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { $('#refsModal').hidden = true; $('#archModal').hidden = true; $('#custEventModal').hidden = true; }
      });
    }

    build();
    wireUI();   // attach all event listeners ONCE — survives build() re-runs on language change
    requestAnimationFrame(frame);

    /* ============ References modal ============ */
    // Renders the bibliography from t.refs into the modal. Called from build() so it tracks language changes.
    // Refs are grouped under their `topic` field — emitted as a small uppercase header whenever the topic changes.
    function renderRefs() {
      let html = '', lastTopic = null;
      for (const r of t.refs) {
        if (r.topic !== lastTopic) { html += `<h3 class="refTopic">${r.topic}</h3>`; lastTopic = r.topic; }
        html += `<div class="ref"><cite>${r.cite}</cite><div class="desc">${r.desc}</div><div class="where">${r.where}</div></div>`;
      }
      $('#refsList').innerHTML = html;
    }
  </script>
</body>

</html>
