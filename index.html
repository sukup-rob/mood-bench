    const INNATE_MEMORY = Object.entries(ARCHETYPES)
      .filter(([, arch]) => arch.innateValence !== undefined)
      .map(([_, arch]) => ({ features: arch.features, valence: arch.innateValence, conf: arch.innateConf ?? 0.3 }));

    // Auto-derive each archetype's `fulfills` (need-payoff profile) by merging the `needs` dicts of all events
    // in its events[] array. EXAMPLE: berry_bush.events = [ate_food], EXTRA.ate_food.needs = {h:.6} → berry_bush
    // .fulfills = {h:.6}. Neutral archetypes (pebble, events=[]) → fulfills = {} → salience always 0. Rival
    // (events: [social_loss, social_win]) currently fulfills nothing since neither carries a `needs` dict —
    // that's correct, rival payoff is valence (win/loss), not need-satisfaction. Runs once at init; mutates
    // ARCHETYPES in place. If you hand-author `fulfills` on an archetype, this leaves it alone.
    for (const [, arch] of Object.entries(ARCHETYPES)) {
      if (arch.fulfills) continue;                          // hand-authored — respect it
      const f = {};
      for (const ek of arch.events ?? []) {
        const ev = EVENT_BY_KEY[ek];
        if (!ev || !ev.needs) continue;
        for (const k in ev.needs) f[k] = Math.max(f[k] ?? 0, ev.needs[k]);   // max across events (don't double-count)
      }
      arch.fulfills = f;
    }

    function seedMemory() {
      memory.clear();
      for (const e of INNATE_MEMORY)
        memory.set(featureKey(e.features), { valence: e.valence, conf: e.conf, count: 0, lastSeen: 0 });
    }

    // ── Perception / selection split ──
    // perceive() = what's in the visual field. Reads ONLY W.surrounding (no agent state, no memory).
    //   Returns a copy so callers can sort/mutate freely. Thin seam for a future perception radius / FOV /
    //   occlusion check — callers should never touch W.surrounding directly.
    const perceive = () => W.surrounding.slice();

    // select(s) = perceived objects ranked by salience (desc). Reads memory (valence/conf) and needs (craving)
    // to decide what's worth dealing with right now. Pure w.r.t. its inputs: no side effects, safe to call
    // repeatedly. The sort key is salience(obj, s) — dot-product of obj.fulfills with cravingVector(s).
    // Callers wanting "the one I'm dealing with" use select(s)[0]. (Replaces the old eyes() heuristic of
    // "most recently spawned", which conflated perception with selection.)
    const select = s => perceive().sort((a, b) => salience(b, s) - salience(a, s));

    // eyes() kept as a thin shim returning select(s)[0] for the existing call sites that want the attended-to
    // object. Prefer select(s)[0] in new code. TODO: migrate remaining eyes() callers to select(s)[0] directly.
    function eyes(s) { const r = select(s); return r.length ? r[0] : null; }

    // learnFromEvent = Rescorla-Wagner update: move expected valence toward the actual felt valence change
    // (the teaching signal), grow confidence. Only called for US events from approach completion (events with
    // `fromApproach` set) — manual clicks and RANDOM row events don't teach, preventing the multi-event-same-tick
    // pollution bug where a negative RANDOM event (e.g. social_loss) could overwrite a positive US (e.g. ate_food).
    function learnFromEvent(key, teachingSignal) {
      if (!key) return;
      const entry = memory.get(key) || { valence: 0, conf: 0, count: 0, lastSeen: 0 };
      entry.valence += P.learnRate * (teachingSignal - entry.valence);
      entry.conf = Math.min(1, entry.conf + P.learnRate);
      entry.count++;
      entry.lastSeen = N;
      memory.set(key, entry);
    }

    function init() {
      // Reset sliders to defaults (fixes the "Reset doesn't reset sliders" bug — P used to retain edits across Reset).
      Object.assign(P, CONFIG);
      // Reset world state FIRST (S.ct reads W.hour for the body-clock start time).
      W = {
        light: 0,           // 0 dark .. 1 full daylight (from the sun)
        conspecifics: 0,    // how many others of its own kind are nearby
        temp: 18,           // ambient temperature in degrees C (comfortable is 20)
        surrounding: [],    // currently-visible objects (see stepSurrounding / renderSurrounding)
        environment: DEFAULT_ENV,   // active ENVIRONMENT key (plains by default) — drives spawns + temp range + wander
        ...WORLD_DEFAULTS
      };   // hour — world state, not parameters
      deriveWorld();   // immediately recompute W.light + W.temp from the (just-reset) hour, so the gauges are consistent even while paused (no tick yet)
      S = {
        v: HOME.v, a: HOME.a, d: HOME.d, bv: HOME.v, ba: HOME.a, bd: HOME.d, hp: 1, ill: false, sp: .35, ct: W.hour,
        asleep: false, tin: 0, ut: 0, slept: P.expect, dbt: 0, dep: 0, cool: 0, led: false, approachTimer: 0
      };
      // Seed every registered need (builtin hunger included when present) at .8. Needs removed from the
      // registry get no field — readers treat a missing need as "full" (1.0 = no deficit) via ?? 1 guards.
      for (const n of NEEDS) if (S[n.key] === undefined) S[n.key] = .8;
      behaviour = 'idle';
      H = []; N = 0; M = []; Q = []; LOG = []; evSeq = 0; PULSES = [];
      customQueue.length = 0;   // also wipe the staged custom-event pulses so Reset returns a clean slate
      customFx.hp = 0; customFx.needs = {};   // and wipe staged side effects (HP + need refills)
      lastPreviewedKey = null;   //  clear after reset so the first seen object triggers a fresh preview
      seedMemory();   //  reset memory to innate pre-seed entries
      // Sync every slider to the reset values. (No-op on the very first init() call before build() has run,
      // since the slider elements don't exist yet — sync() bails when !input.)
      for (const [k] of SLIDERS) sync(k);
    }
    init();

    // startSleep / wake = the two sleep transitions. wake(natural): natural = the sleep pressure ran out; otherwise something interrupted.
    function startSleep() { S.asleep = true; S.tin = S.ut = 0; behaviour = 'nrem'; Q.push(EVENT_BY_KEY[EV.fell_asleep]); }
    function wake(natural) { S.asleep = false; behaviour = 'idle'; S.cool = natural ? 0 : P.wakeCooldown; Q.push(EVENT_BY_KEY[natural ? EV.woke_up : EV.sleep_interrupted]); }

    /* ============ One simulation tick ============ */
    // tick() only lists the steps. Each step is a function below, grouped by topic (mood, needs, world, sleep, behaviour).
    function tick() {
      const s = S, def = ST[behaviour];          // s = the agent, def = definition of its current behaviour
      decayMood(s);
      applyBehaviour(s, def);
      applyNeeds(s, def);
      applyHealth(s, def);
      fireEvents(s, def);
      clampMood(s);
      const m = feel(s);                         // m = the felt mood: the slow layer plus every event pulse still fading (this also ages the pulses by one tick)
      moveBaseline(s, def, m);
      stepWorld();
      stepSurrounding(s);   // ambient object spawning + TTL aging + preview pulse
      const body = stepBodyClock(s, m);             // body = {ea: displayed arousal, offset, up, lo: sleep thresholds, noon: passed 12:00}
      stepSleepPressure(s, body.noon);
      stepSleepWake(s, body);
      stepApproach(s);   //  handle approach_object completion (US fires, target consumed)
      if (!s.asleep && N % P.decideevery === 0) chooseBehaviour(s, m, body.ea);
      chooseRandomEvents(s, m, body.ea);
      record(s, m, body);
      N++;
    }

    /* ---- Mood (uses: decay, afast, drift, pers, thr, dep, repair) ---- */
    // Event effects are not here: they are pulses with their own fade times (see feel).
    function decayMood(s) {
      s.v += (s.bv - s.v) * P.decay;
      s.d += (s.bd - s.d) * P.decay;
      s.a += (s.ba - s.a) * P.decay;
    }

    // The current behaviour's steady effect on mood: push = nudge, tug = pull toward a target
    function applyBehaviour(s, def) {
      for (const k in def.push) s[k] += def.push[k];
      for (const k in def.tug) s[k] += (def.tug[k][0] - s[k]) * def.tug[k][1];
    }

    // ---- Event pulses ----
    // An event is a few PULSES, each with a size (amp) and a fade time (tau, in ticks). A pulse adds amp x exp(-age / tau) to the mood:
    // a small tau is a quick spike, a big tau is a lingering tail. A pulse is dropped once it has faded to under 0.5% of its size.
    // The felt mood = the slow layer (S.v / S.a / S.d) + the sum of all pulses, clamped to -1..1.
    // pulsesOf = the pulses for an event: its own list if it has one, otherwise built from its impacts (imp) with SHAPE
    function pulsesOf(e, imp) {
      return e.pulses || ['v', 'a', 'd'].flatMap(dim => SHAPE[dim].map(([share, tau]) => ({ dim, amp: imp[dim] * share, tau })));
    }
    
    // needMult = need-relevance multiplier for an event group, based on the agent state s and world W.
    // 1 = neutral, >1 = more salient when the relevant need is high. Incentive-salience-style modulation
    // (Berridge & Robinson 1998): food is more salient when hungry, social events when isolated, etc.
    // Compounds with the base magnitude salience (max of |impacts| or |pulse amps|) in fireEvents.
    // NOTE: the food case used to read s.h literally; it now derives from the event's own `needs` payoff
    // matched against cravingVector(s) — same data as object-salience, so any event that fulfills a craved
    // need gets the boost (not just hardcoded hunger). Events with no `needs` dict fall through to neutral.
    function needMult(g, s, W, e) {
      switch (g) {
        case 'food': {
          if (!e?.needs) return 1;                                      // no payoff profile → neutral
          const crave = cravingVector(s);
          let match = 0;
          for (const k in e.needs) match += e.needs[k] * (crave[k] ?? 0);
          return 1 + match * 0.5;                                       // up to 1.5× when the craved need is fully empty
        }
        case 'body': return 1 + (s.ill ? 0.3 : 0) + (1 - s.hp) * 0.3;   // body events (pain, illness, recovery) more salient when sick / low HP
        case 'social': return 1 + (W.conspecifics === 0 ? 0.3 : 0);       // social events more salient when isolated
        case 'sleep': return 1 + s.dep * 0.3;                            // sleep transitions more salient when sleep-deprived
        default: return 1;                                          // threat, env, custom: neutral (could add novelty bonus later)
      }
    }
    // pulseValue = what one pulse contributes right now (0 while it is still waiting to start, i.e. age below 0)
    const pulseValue = p => p.age < 0 ? 0 : p.amp * Math.exp(-p.age / (p.tau * P.plen));
    // pulseSum = every pulse added up per dimension, without ageing them
    function pulseSum() { const sum = { v: 0, a: 0, d: 0 }; for (const p of PULSES) sum[p.dim] += pulseValue(p); return sum; }
    // feel = the felt mood this tick. Also ages every pulse by one tick and drops the faded ones.
    function feel(s) {
      const sum = pulseSum();
      for (const p of PULSES) p.age++;
      PULSES = PULSES.filter(p => p.age < 0 || Math.abs(pulseValue(p)) > .005 * Math.abs(p.amp));
      return { v: clamp(s.v + sum.v), a: clamp(s.a + sum.a), d: clamp(s.d + sum.d) };
    }
    // Run the events waiting in the queue. Each one becomes a few pulses, and also moves needs and sometimes the world.
    function fireEvents(s, def) {
      if (!Q.length) return;
      const names = [];                                                   // names = events that fire this tick (for the chart tag and the list)
      for (const e of Q.splice(0)) {                                      // splice(0) = take every queued event and empty the queue
        names.push(e.k);
        if (e.force) {                                                    // a manual click on a sleep-transition button makes the agent actually do it
          if (e.k === EV.fell_asleep && !s.asleep) startSleep();
          else if (s.asleep && e.k !== EV.fell_asleep) wake(e.k === EV.woke_up);
          continue;                                                       // the mood effect comes from the event that startSleep() / wake() queue
        }
        const imp = e.amb ? { v: K.ambValence * s.bv, a: K.ambArousal + K.ambArousalBase * s.ba, d: 0 } : e;
        const feltV = clamp(s.v + pulseSum().v);       // feltV = valence as it stands after earlier events this tick, but before this one
        const baseSalience = e.pulses ? Math.max(...e.pulses.map(p => Math.abs(p.amp)))
          : e.amb ? Math.max(Math.abs(imp.v), Math.abs(imp.a), Math.abs(imp.d), 0.3)
            : Math.max(Math.abs(e.v), Math.abs(e.a), Math.abs(e.d));
        const salience = baseSalience * needMult(e.g, s, W, e);
        const k = salience * (e.g === 'sleep' ? 1 : (def.impact ?? 1));
        const domScale = feltV <= 0 ? K.domGainHalf : 1;
        // For approach-US events (fromApproach set): the teaching signal is THIS event's own valence pulse
        // contribution (vContrib) — the sum of the valence amps pushed, pre-clamp and post-anhedonia. This is the
        // US's intrinsic reinforcing value (Rescorla-Wagner λ), NOT the felt mood change, so it is unaffected by
        // saturation (a well-fed agent whose felt valence is already near +1 still learns food is good) and by
        // delayed pulses (their amps count at push time, before they start fading). Motivation modulation comes
        // from needMult via k (food more salient when hungry) and is undone by /k below; anhedonia
        // (sleepDebtAnhedonia) is applied as a known scalar and is NOT undone, so sleep debt reduces the teaching
        // magnitude without flipping the sign.
        let vContrib = 0;
        for (const p of pulsesOf(e, imp)) {
          let amp = p.amp * k;
          if (p.dim === 'v') {
            amp *= P.pers;
            if (amp > 0) amp *= 1 - K.sleepDebtAnhedonia * s.dep;
            vContrib += amp;
          }
          if (p.dim === 'd' && amp > 0) amp *= domScale;
          PULSES.push({ dim: p.dim, amp, tau: p.tau, age: -(p.delay ?? 0) });
        }
        // Legacy e.food (pre-NEEDS-registry saved events) → treat as a hunger refill of e.food, 1:1.
        if (e.food && s.h !== undefined) s.h = clamp01(s.h + e.food);
        if (e.needs) for (const k in e.needs) {
          if (s[k] === undefined) continue;                              // need was removed mid-session — skip silently
          s[k] = clamp01(s[k] + e.needs[k]);                              // saturation is on the event itself, 1:1 (no global quality multiplier)
        }
        if (e.hp) s.hp = clamp01(s.hp + e.hp);
        if (e.act) e.act(W, s);
        // Learning: only for approach-US events (fromApproach set). teachingSignal = vContrib / k, which undoes the
        // salience scaling to recover a value in the imp.v × pers × (1 - anhedonia) range — compatible with the
        // existing decision thresholds (OVERRIDE 2/4 expect -0.3..+0.3 range; imp.v is ±0.7..1.0, pers-scaled).
        if (e.fromApproach) {
          const teachingSignal = k > 0 ? vContrib / k : vContrib;
          learnFromEvent(e.fromApproach, teachingSignal);
        }
      }
      M.push({ n: N, id: ++evSeq, k: names });
      LOG.unshift({ id: evSeq, time: fmt('hour', W.hour), k: names });
      if (LOG.length > 200) LOG.pop();   // cap high enough that every on-screen timeline badge still has a LOG row for hover detail (timeline window ≈ 600 ticks)
      while (M.length && M[0].n < N - 600) M.shift();
    }

    function clampMood(s) { s.v = clamp(s.v); s.a = clamp(s.a); s.d = clamp(s.d); }

    // Awake: the baseline drifts toward recent mood (a slow running mean), and long-term gloom drains it.
    // Asleep: sleep is not "experience", so the running mean is frozen and the baseline is REPAIRED toward HOME instead.
    function moveBaseline(s, def, m) {
      if (!def.sleep) {
        s.bv += (m.v - s.bv) * P.drift;
        s.ba += (m.a - s.ba) * P.drift;
        s.bd += (m.d - s.bd) * P.drift;
        // Per-source unwell pushes (replaces the old malaise aggregator). Each source pushes baseline mood directly,
        // like the `need` push in applyNeeds — not a pull-toward-target. Sleep debt is the biggest driver; sickness
        // and low HP add to the same push. Physiological hyperarousal (cortisol) is NOT routed here — it shows up
        // as asymmetric anhedonia in fireEvents (sleepDebtAnhedonia, Motomura 2013), not as a tonic arousal push.
        const unwell = s.dep + (s.ill ? 1 : 0) + (1 - s.hp);
        s.bv -= K.unwellValence * unwell;                   // being unwell feels bad (valence down)
        s.ba -= K.unwellLethargy * unwell;                   // and lethargic (tonic arousal down)
        s.bd -= K.unwellDominance * unwell;                  // and low in reactive dominance
        if (s.bv < P.thr) { s.ba *= P.depfactor; s.bd *= P.depfactor; }
        // depletion: gloom drains baseline arousal and dominance (separate mechanic — triggers on low valence, not on unwellness)
      } else {
        const r = P.repair * (def.repair ?? 0);
        // r = repair per tick (literature-backed sleep repair, no malaise damper).
        s.bv += (HOME.v - s.bv) * r; s.ba += (HOME.a - s.ba) * r; s.bd += (HOME.d - s.bd) * r;
      }
    }

    /* ---- Needs and body (uses: hrate, hmood; iterates NEEDS registry) ---- */
    function applyNeeds(s, def) {
      const comfort = 1 - Math.min(1, Math.abs(W.temp - K.tempIdeal) / K.tempRange);   // 1 at 20 C, 0 at 5 C or 35 C
      const coldDrain = (1 - comfort) * K.coldBurn;                          // cold burns energy — today routed through hunger until energy becomes a registered need
      // Decay every need by its decayParam × behaviour multiplier × (1 + sleep-deprived burn). The cold drain
      // is added to hunger specifically for now (preserves prior tuning); when energy registers, it moves there.
      for (const n of NEEDS) {
        const use = (def.needs && def.needs[n.key]) ?? 1;                    // behaviour's multiplier on this need's decay (1 if unset)
        const burn = n.key === 'h' ? coldDrain : 0;                          // cold → hunger only (legacy; see energy TODO above)
        s[n.key] = clamp01(s[n.key] - P[n.decayParam] * use * (1 + K.sleepDeprivedBurn * s.dep) - burn);
      }
      // Mood coupling: weighted sum of hurts across all needs (needMood aggregator).
      const need = needMood(s);
      s.v -= P.hmood * K.needValence * need;                              // being hungry feels bad...
      s.a += P.hmood * K.needArousal * need;                             // ...and restless
      if (comfort < K.coldStress) s.v -= K.coldValence;                   // chronic cold or heat stress
    }
    // Health. ILLNESS lives in these places: the flag s.ill; EXTRA.illness_onset / recovery (set and clear it);
    // the RANDOM rows 'illness' and 'recover' (start and end it by chance); the drain below; the status line (readout).
    function applyHealth(s, def) {
      if (def.sleep) s.hp += s.ill ? P.sickSleepHeal : P.sleepHeal;       // sleep heals, but barely while sick
      if (s.ill) s.hp -= P.illDrain;
      s.hp = clamp01(s.hp);
    }

    /* ---- World (uses: speed, hour, rate) ---- */
    // deriveWorld = recompute the *derived* world fields (light, temp) from W.hour.
    // Called from stepWorld() every tick AND from anywhere that mutates W.hour directly
    // (init(), setParam('hour',…)) so the light/temp gauges stay consistent even while the sim is paused
    // (no ticks running).
    function deriveWorld() {
      W.light = daylight(W.hour);
      // Temperature: oscillates within the ACTIVE env's tempRange across the day cycle (min at dawn ~06:00,
      // max in the afternoon ~15:00). The env sets the range; the clock sets the phase. If no env, fall back
      // to the legacy 12-24°C cycle so a broken env state can't NaN the temperature.
      const env = ENVIRONMENTS[W.environment];
      const [lo, hi] = env?.tempRange ?? [12, 24];
      const phase = Math.sin((W.hour - 9) / 24 * 2 * Math.PI);   // -1..+1, peaks ~15:00, troughs ~03:00
      W.temp = (lo + hi) / 2 + (hi - lo) / 2 * phase;
    }

    function stepWorld() {
      if (clock) { W.hour = (W.hour + DT) % 24; sync('hour'); }           // only the WORLD clock stops when unticked; the body keeps running
      deriveWorld();
    }

    /* ---- Sleep (uses: sleep, krise, kdecay, camp, cycle, expect, amp, tau, ent) ---- */
    // Process C, the body clock: free-runs at its own period, and light pulls it toward world time.
    function stepBodyClock(s, m) {
      const before = s.ct;                                                // before = body-clock time before this tick (to detect passing 12:00)
      s.ct = wrap24(s.ct + DT * 24 / P.tau);
      if (W.light > 0) s.ct = wrap24(s.ct + P.ent * W.light * (((W.hour - s.ct + 36) % 24) - 12) * DT);   // (...) = signed gap to world time, -12..+12 h
      const level = bodyClock(s.ct), offset = circOn ? P.amp * level : 0;
      return {
        ea: clamp(m.a + offset),                                    // ea = effective (displayed) arousal = stored arousal + body-clock offset
        offset,
        up: UP + P.camp * level, lo: LOW + P.camp * level,          // up = fall-asleep threshold, lo = wake-up threshold; both ride on Process C
        noon: before < 12 && s.ct >= 12
      };
    }
    // Process S, sleep pressure: rises while awake, decays while asleep (both exponential). Also keeps the daily sleep-debt ledger.
    function stepSleepPressure(s, noon) {
      s.sp += s.asleep ? (0 - s.sp) * P.kdecay * DT : (1 - s.sp) * P.krise * DT;
      s.slept += s.asleep ? DT : 0;
      if (noon && !s.led) { s.dbt = Math.max(0, s.dbt + P.expect - s.slept); s.slept = 0; s.led = true; }   
      // body clock passed 12:00: close the day's ledger (a shortfall adds debt, extra sleep pays it down)
      if (s.led && s.ct < 6) s.led = false;                                        
      // re-arm in the morning, so dragging the clock back and forth cannot close it twice
      s.dep = clamp01(s.dbt / P.expect);
      // 0 = well rested, 1 = total deprivation
      if (s.cool > 0) s.cool--;
    }
    
    // Sleep / wake decision and the NREM / REM cycle
    function stepSleepWake(s, body) {
      // wp = wake pressure: positive means "wake up now"
      // wp = wake pressure: positive means "wake up now". The third term is the agent's most-deprived need
      // (desperation, 0..1) — whichever need is hurting most drives wake pressure. With no needs registered
      // desperation() = 0, so this contributes nothing. (Previously a hunger-only `(1 - s.h)` term.)
      const wp = (body.lo - s.sp) * .5 + Math.max(0, body.ea - P.sleep) * .3 + desperation(s) * .2;
      if (!s.asleep) {
        if (s.sp >= body.up && body.ea < P.sleep && wp <= 0 && !s.cool) startSleep();   // tired enough, calm enough, and nothing would wake it straight away
      } else if (wp > 0) {
        wake(s.sp <= body.lo);                                            // natural wake = the pressure ran out; otherwise it was interrupted
      } else {
        // Ultradian cycle: NREM then REM, repeating. Later in the night REM gets longer and NREM shorter.
        s.tin += DT; s.ut += DT * 60;
        const prog = clamp01(s.tin / P.nightlen);                           // prog = how far through the expected night (uses nightlen, separate from expect so the debt target and cycle reference can differ)
        const nrem = P.cycle * .75 * (1 - prog * .5), rem = P.cycle * .25 * (1 + prog * 2);   // lengths in minutes
        if (s.ut >= nrem + rem) s.ut = 0;
        behaviour = s.ut < nrem ? 'nrem' : 'rem';
      }
    }

    /* ---- Behaviour and random events ---- */
    // c = everything the rules can see: the agent's own state plus c.world. sat = how full is "full enough" (sleep-deprived agents need more food).
    // chooseBehaviour = wrapper for decide(). Builds the decision context c and runs the behaviour-selection
    // cascade (overrides + weighted pick). Gated by tick() — only called when awake and on the decide schedule
    // (every P.decideevery ticks).
    function chooseBehaviour(s, m, ea) {
      const c = {
        h: s.h ?? 1, hp: s.hp, ill: s.ill, v: m.v, a: ea, d: m.d, sat: Math.min(1, .7 * (1 + .3 * s.dep)),
        state: behaviour, asleep: s.asleep, temperament: TEMP, world: W
      };
      decide(c);
    }
    // chooseRandomEvents = roll the RANDOM table. Each row rolls its chance, then checks its dependencies (when),
    // and may push an event to Q or fire an act. A row may wake the agent or change behaviour, so c is refreshed
    // after each firing row for the later rows to see. Runs every tick regardless of sleep/decide schedule.
    function chooseRandomEvents(s, m, ea) {
      const c = {
        h: s.h ?? 1, hp: s.hp, ill: s.ill, v: m.v, a: ea, d: m.d, sat: Math.min(1, .7 * (1 + .3 * s.dep)),
        state: behaviour, asleep: s.asleep, temperament: TEMP, world: W
      };
      for (const r of RANDOM) {
        // each random row rolls its chance, then checks its dependencies
        if (Math.random() < r.chance * P.rate * (r.hp ? s.hp : 1) && r.when(c))
        { if (r.event) Q.push(EVENT_BY_KEY[r.event]); if (r.act) r.act(W, s); c.asleep = s.asleep; c.state = behaviour; }
        // a row may change the agent (wake it), so refresh what the later rows see
      }
    }

    function record(s, m, body) {
      // Builtin non-need series + one field per registered need (builtin or custom). Needs are sparsely
      // keyed, so a history point naturally omits any need that didn't exist when it was recorded — older
      // history just has no value for newer/removed needs, and drawTimeline / readout skip missing keys.
      const entry = { v: m.v, a: body.ea, d: m.d, bv: s.bv, ba: clamp(s.ba + body.offset), bd: s.bd, hp: s.hp, sp: s.sp, b: behaviour };
      for (const n of NEEDS) entry[n.key] = s[n.key];
      H.push(entry);
      if (H.length > 600) H.shift();                                      // keep only the last 600 ticks
    }

    /* ============ Drawing ============ */
    const COL = { v: '#14a39a', a: '#d99a00', d: '#8a63d2', hp: '#b5651d', sp: '#888' };   // builtin NON-need series colours. Need colours come from each need object (see seriesColor).
    const GC = { threat: '#e04040', food: '#c9772b', social: '#d0488f', env: '#7a8a99', body: '#b5651d', sleep: '#4654d4', custom: '#666' };   // event group colours (for timeline tags + recent events chips). Sleep is blue-purple to distinguish from dominance line colour (#8a63d2).
    // SER = builtin NON-need lines on the timeline: [key, text key]. Need series are appended at draw time
    // via seriesList() from NEEDS (so adding/removing a need — hunger included — immediately adds/removes
    // its line + legend entry + gauge, with no hardcoded 'h' anywhere).
    const SER = [['v', 'val'], ['a', 'aro'], ['d', 'dom'], ['sp', 'slp'], ['hp', 'hlt']];
    let SHOW = { v: 1, a: 1, d: 0, sp: 0, hp: 0 };   // let: needs add their own entries on first render (hunger defaults on)
    const BASE_KEY = { v: 'bv', a: 'ba', d: 'bd' };   // which history field holds each line's baseline
    const STRETCH = { sp: 1, hp: 1 };     // builtin 0..1 series that stretch over the chart's -1..1 axis (needs stretch too — see seriesStretch)
    // seriesList = the effective set of chartable series: builtin non-need SER + one per need (builtin or
    // custom). A need's text key is 'need_<key>' so the i18n lookup in the variable panel falls back to
    // the need's label via needLabel().
    const seriesList = () => [...SER, ...NEEDS.map(n => [n.key, 'need_' + n.key])];
    // seriesColor = colour for a series key. Builtin non-need keys use COL; need keys use the need's own colour.
    const seriesColor = k => COL[k] || (NEEDS.find(n => n.key === k)?.color) || '#888';
    // seriesStretch = whether a series is 0..1 (stretched to -1..1 for the chart axis). sp/hp + every need.
    const seriesStretch = k => !!STRETCH[k] || NEEDS.some(n => n.key === k);
    let INK = '#000';   // INK = the page's text colour, re-read every frame so light/dark mode works

    // Prepare a canvas: match the screen's pixel ratio, clear it, reset every drawing setting. Returns [ctx, width, height].
    function fit(canvas) {
      const ratio = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== Math.round(w * ratio) || canvas.height !== Math.round(h * ratio)) { canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio); }
      const x = canvas.getContext('2d');                                  // x = the 2D drawing context
      x.setTransform(ratio, 0, 0, ratio, 0, 0); x.clearRect(0, 0, w, h);
      x.globalAlpha = 1; x.lineWidth = 1; x.setLineDash([]); x.textAlign = 'left';   // settings persist between frames, so reset them
      x.font = '12px system-ui,sans-serif';
      x.fillStyle = x.strokeStyle = INK;
      return [x, w, h];
    }

    // Time series. Top strip = behaviour (y=0-5). Tag strip = number badges (y=6-25, ABOVE the lines).
    // Lines occupy y=lineTop..h-8 so tags never overlap the chart — no clearRect gap-knocking needed.
    function drawTimeline() {
      const [x, w, h] = fit($('#timeline'));
      const pad = 24, lineTop = 28;
      const Y = v => (lineTop + h - 8) / 2 - v * ((h - 8) - lineTop) / 2;   // Y: value (-1..1) to pixel row; lines occupy y=lineTop..h-8
      const L = H.length, X = i => pad + (i + 600 - L) / 599 * (w - pad);   // X: history index to pixel column; newest sits at the right edge
      x.globalAlpha = .25;
      for (const g of [-1, -.5, 0, .5, 1]) { x.beginPath(); x.moveTo(pad, Y(g)); x.lineTo(w, Y(g)); x.stroke(); }
      x.globalAlpha = .7;
      for (const g of [1, 0, -1]) x.fillText(g, 2, Y(g) + 4);
      MARKS.length = 0;
      if (!L) return;
      const tags = M.map(m => ({ m, i: m.n - (N - L) })).filter(o => o.i >= 0);   // tags that are still inside the chart window
      x.globalAlpha = .25;
      for (const { i } of tags) { x.beginPath(); x.moveTo(X(i), lineTop); x.lineTo(X(i), h); x.stroke(); }   
      // faint vertical line per event, only across the line area (below the tag strip)
      x.globalAlpha = 1;
      H.forEach((p, i) => { x.fillStyle = ST[p.b].col; x.fillRect(X(i), 0, (w - pad) / 599 + 1, 5); });   // behaviour strip at the very top
      const path = f => { x.beginPath(); H.forEach((p, i) => i ? x.lineTo(X(i), Y(f(p))) : x.moveTo(X(i), Y(f(p)))); x.stroke(); };
      // pegV = clamp a baseline value into the chart's -1..1 range. moveBaseline's unwell push can drive
      // bv/bd below -1 (see K.unwellValence etc.), and without this the dashed line walks off the canvas.
      // The true unclamped value is still shown in the readout strip; this only clips the drawn line.
      const pegV = v => v < -1 ? -1 : v > 1 ? 1 : v;
      // Custom needs have no baseline (BASE_KEY only covers v/a/d), so they draw as a solid line.
      // For older history points recorded before a custom need existed, p[k] is undefined — we skip those
      // points by breaking the path rather than drawing through 0 (which would fabricate a downward spike).
      const pathStretch = (f, stretch) => {
        x.beginPath();
        let started = false;
        H.forEach((p, i) => {
          const raw = f(p);
          if (raw === undefined || raw === null || isNaN(raw)) { started = false; return; }
          const v = stretch ? 2 * raw - 1 : raw;
          const px = X(i), py = Y(v);
          if (started) x.lineTo(px, py); else { x.moveTo(px, py); started = true; }
        });
        x.stroke();
      };
      for (const [k] of seriesList()) {
        if (!SHOW[k]) continue;
        x.strokeStyle = seriesColor(k);
        if (BASE_KEY[k]) {
          x.globalAlpha = .6; x.lineWidth = 1.5; x.setLineDash([4, 4]); path(p => pegV(p[BASE_KEY[k]]));
          // edge peg: if the latest baseline is off-axis, drop a triangle at the chart edge pointing outward,
          // so a pegged baseline reads as "lower than -1" rather than "sitting at -1".
          const last = H[L - 1][BASE_KEY[k]];
          if (last < -1 || last > 1) {
            const px = X(L - 1), down = last < -1, py = down ? h - 8 : lineTop;
            x.globalAlpha = .9; x.setLineDash([]); x.fillStyle = seriesColor(k);
            x.beginPath(); x.moveTo(px, py + (down ? 6 : -6)); x.lineTo(px - 4, py); x.lineTo(px + 4, py); x.fill();
          }
        }
        x.globalAlpha = 1; x.lineWidth = 2.2; x.setLineDash([]);
        pathStretch(p => p[k], seriesStretch(k));
      }
      // Event tags live in the tag strip above the line area. Each tag is a small colored square (no number —
      // the id is meaningless on the canvas now, and a flat color reads at a glance: red = threat, orange = food…)
      // drawn at ~0.6 alpha so overlapping tags COMPOSITE darker, letting you see every event even when they stack
      // densely (events firing on adjacent ticks). Uniform square width → simpler hit-test and more forgiving hover.
      // The faint vertical line below each tag (drawn earlier) still traces an event down to the chart.
      const SQ = 10;   // square edge, px — also the hit-test width (MARKS.w)
      x.textAlign = 'left';
      for (const { m, i } of tags) {
        const px = X(i);
        const firstKey = m.k[0];
        const g = (firstKey && EVENT_BY_KEY[firstKey]) ? EVENT_BY_KEY[firstKey].g : 'custom';
        x.globalAlpha = .6; x.fillStyle = GC[g] || GC.custom;
        x.fillRect(px - SQ / 2, 9, SQ, SQ);   // square centered on the event's column, in the tag strip
        MARKS.push({ x: px, w: SQ, m });      // w = square width, used by the hover/click hit-test
      }
      // Pinned-badge highlights: a white ring around every pinned tag's square still on screen, so the full set
      // of pinned tags stays visible as they scroll left. _pinned is keyed by event id (stable per event); badges
      // that have scrolled off simply aren't in MARKS — their detail still shows from the snapshotted LOG rows.
      if (_pinned.size) {
        x.globalAlpha = 1; x.strokeStyle = '#fff'; x.lineWidth = 1.5;
        for (const id of _pinned.keys()) {
          const mk = MARKS.find(m => m.m.id === id);
          if (mk) x.strokeRect(mk.x - SQ / 2 - .5, 8.5, SQ + 1, SQ + 1);
        }
        x.lineWidth = 1;
      }
    }

    // Valence (x axis) by arousal (y axis). The four quadrants come from Mendl et al. 2010, Fig. 1.
    function drawMoodPlane() {
      const [x, w, h] = fit($('#moodPlane'));
      const X = v => w / 2 + v * (w / 2 - 14), Y = a => h / 2 - a * (h / 2 - 14);
      x.globalAlpha = .3; x.strokeRect(14, 14, w - 28, h - 28);           // outer frame
      x.beginPath(); x.moveTo(w / 2, 14); x.lineTo(w / 2, h - 14); x.moveTo(14, h / 2); x.lineTo(w - 14, h / 2); x.stroke();   // centre cross
      x.globalAlpha = .12;
      for (const g of [-.5, .5]) { x.beginPath(); x.moveTo(X(g), 14); x.lineTo(X(g), h - 14); x.moveTo(14, Y(g)); x.lineTo(w - 14, Y(g)); x.stroke(); }   // grid
      x.globalAlpha = .75; x.textAlign = 'center';
      x.fillText(t.hi, w / 2, 11); x.fillText(t.lo, w / 2, h - 3);
      x.fillText(t.pos, w - 36, h / 2 - 4); x.fillText(t.neg, 36, h / 2 - 4);
      x.textAlign = 'right'; x.fillText(t.q[0], w - 20, 32); x.fillText(t.q[1], w - 20, h - 22);   // Q1, Q2 (positive valence)
      x.textAlign = 'left'; x.fillText(t.q[3], 20, 32); x.fillText(t.q[2], 20, h - 22);       // Q4, Q3 (negative valence)
      const L = H.length; if (!L) return;
      const trail = H.slice(-90); x.fillStyle = COL.v;                    // trail = the last 90 ticks
      trail.forEach((p, i) => { x.globalAlpha = i / trail.length * .5; x.beginPath(); x.arc(X(p.v), Y(p.a), 3, 0, 7); x.fill(); });
      const p = H[L - 1];
      // Baseline ring position is clamped to the plane so it can't leave the frame (see pegV in drawTimeline).
      // The actual bv/ba can exceed the -1..1 axis under sustained unwellness; the ring pegs at the edge,
      // and a small arrow on the ring points outward to signal "below the floor".
      const rBv = p.bv < -1 ? -1 : p.bv > 1 ? 1 : p.bv, rBa = p.ba < -1 ? -1 : p.ba > 1 ? 1 : p.ba;
      x.globalAlpha = .8; x.strokeStyle = COL.a; x.setLineDash([3, 3]);
      x.beginPath(); x.arc(X(rBv), Y(rBa), 9, 0, 7); x.stroke();        // dashed ring = baseline (pegged to frame)
      if (p.bv < -1 || p.bv > 1 || p.ba < -1 || p.ba > 1) {
        // outward arrow: points from ring center toward the true (off-axis) baseline position.
        const dx = p.bv - rBv, dy = (p.ba - rBa) * -1;   // y axis inverted: arousal up = smaller pixel row
        const a = Math.atan2(dy, dx);
        x.setLineDash([]); x.globalAlpha = .9; x.strokeStyle = COL.a;
        x.beginPath();
        x.moveTo(X(rBv) + Math.cos(a) * 9, Y(rBa) + Math.sin(a) * 9);
        x.lineTo(X(rBv) + Math.cos(a) * 16, Y(rBa) + Math.sin(a) * 16);
        x.stroke();
      }
      x.globalAlpha = 1; x.beginPath(); x.arc(X(p.v), Y(p.a), 7, 0, 7); x.fill();   // dot = current mood
    }

    // A gauge with a fixed track from lo to hi. The fill starts at 0 (or at lo if the track has no negative side).
    // marks = optional values to mark with a vertical line (used for the sleep thresholds).
    function gauge(sel, name, val, lo, hi, loTxt, hiTxt, col, marks = []) {
      const [x, w, h] = fit($(sel));
      const X = v => 14 + (v - lo) / (hi - lo) * (w - 28), y = 26;        // X: value to pixel column
      x.globalAlpha = .3; x.lineWidth = 6; x.beginPath(); x.moveTo(X(lo), y); x.lineTo(X(hi), y); x.stroke();   // track
      if (lo < 0) { x.lineWidth = 1; x.beginPath(); x.moveTo(X(0), y - 8); x.lineTo(X(0), y + 8); x.stroke(); } // zero mark
      x.globalAlpha = .8; x.fillText(loTxt, 6, h - 4); x.textAlign = 'right'; x.fillText(hiTxt, w - 6, h - 4);
      x.textAlign = 'left';
      if (!H.length) return;
      x.globalAlpha = 1; x.strokeStyle = x.fillStyle = col; x.lineWidth = 6;
      x.beginPath(); x.moveTo(X(Math.max(lo, 0)), y); x.lineTo(X(val), y); x.stroke();   // fill
      x.beginPath(); x.arc(X(val), y, 8, 0, 7); x.fill();                                // marker
      x.strokeStyle = INK; x.lineWidth = 2;
      for (const m of marks) { const mm = Math.max(lo, Math.min(hi, m)); x.beginPath(); x.moveTo(X(mm), y - 11); x.lineTo(X(mm), y + 11); x.stroke(); }
      x.fillStyle = INK; x.textAlign = 'center'; x.fillText(name + ' ' + val.toFixed(2), w / 2, 11);
    }

    // _hoverMarks = every timeline tag currently under the cursor (badges overlap when events fire on adjacent
    // ticks), in paint order front→back. Hovering shows ALL of them in #eventDetail at once.
    // _pinned = a Map<id, logRow> of every tag clicked to pin — MULTI-pin, mirroring the hover mental model:
    // click a cluster and every tag at that x is pinned together, then another cluster adds to the set. Detail
    // precedence is hover > pin > hint. Each pin snapshots the tag's LOG row into the map at click time so its
    // detail survives even after the badge scrolls off the left edge (LOG is capped; the snapshots aren't).
    // Cleared on reset.
    let _hoverMarks = [], _pinned = new Map();
    // _lastSig = cached signature of which status badges are active ('ill,depl' style). Avoids rebuilding the
    // #status DOM every frame — only re-renders when a condition flips on/off. Cleared on reset.
    let _lastSig = '';
    function readout() {
      setText('#clockText', fmt('hour', W.hour));
      const env = ENVIRONMENTS[W.environment];
      setText('#envBadge', env ? (t.env?.[W.environment] || env.label) : W.environment);   // active environment badge (i18n or raw label)
      renderSurrounding();   // Rebuild the surrounding list every frame (objects age and despawn, TTL counts down)
      renderMemory();        //  rebuild the memory list every frame (learned associations update on event fire)
      // The recent-events list under the chart is gone — the timeline squares ARE the recent events. #eventDetail
      // shows, in precedence order: (1) EVERY square under the cursor — one .evRow each, so overlapping tags are
      // all visible at once; (2) if nothing hovered but tags are pinned, a row per pinned tag (sticky fallback
      // after the cursor leaves); (3) a hint/empty message. logRowHTML takes a LOG row directly so pinned rows
      // render from the snapshotted map even after their badges scroll off (LOG is capped; the snapshots aren't).
      const logRowHTML = l => {
        if (!l) return '';
        const numG = l.k.length && EVENT_BY_KEY[l.k[0]] ? EVENT_BY_KEY[l.k[0]].g : 'custom';
        const numCol = GC[numG] || GC.custom;
        if (l.env) {   // env-change row: old → new env chip, colored neutral
          const fromL = t.env?.[l.env.from] || ENVIRONMENTS[l.env.from]?.label || l.env.from;
          const toL = t.env?.[l.env.to] || ENVIRONMENTS[l.env.to]?.label || l.env.to;
          return `<span class="evNum" style="background:${numCol}">${l.id}</span><span class="evTime">${l.time}</span><span class="evChip" style="background:#2a3540" title="via ${l.env.via}">${fromL} → ${toL}</span>`;
        }
        const chips = l.k.map(k => {
          const e = EVENT_BY_KEY[k], g = e ? e.g : 'custom', c = GC[g] || GC.custom;
          return `<span class="evChip" style="background:${c}">${eventLabel(k)}</span>`;
        }).join('');
        return `<span class="evNum" style="background:${numCol}">${l.id}</span><span class="evTime">${l.time}</span>${chips}`;
      };
      const L = H.length;
      if (L) {
        let detHtml;
        if (_hoverMarks.length) {                                   // (1) hover: every tag under the cursor
          detHtml = _hoverMarks.map(mk => {
            const l = LOG.find(x => x.id === mk.m.id);
            return l ? `<div class="evRow">${logRowHTML(l)}</div>` : '';
          }).join('');
        } else if (_pinned.size) {                                  // (2) pins (sticky when not hovering), oldest id first
          const rows = [..._pinned.values()].sort((a, b) => a.id - b.id)
            .map(l => `<div class="evRow pinned">${logRowHTML(l)}</div>`).join('');
          detHtml = rows || `<small>${t.logHint}</small>`;
        } else {                                                    // (3) hint / empty
          detHtml = LOG.length ? `<small>${t.logHint}</small>` : `<small>${t.logEmpty}</small>`;
        }
        const ed = $('#eventDetail');
        if (ed.innerHTML !== detHtml) ed.innerHTML = detHtml;
      }
      if (!L) { setText('#moodLabel', ''); setText('#behaviourLabel', ''); setText('#status', ''); $('#eventDetail').innerHTML = ''; _lastSig = ''; _hoverMarks = []; _pinned.clear(); return; }   // "nothing yet" e.g. just after Reset
      const p = H[L - 1], f = (v, b) => v.toFixed(2) + (b === undefined ? '' : ' (' + b.toFixed(2) + ')');   // baseline in compact parens, e.g. "-0.38"; baseline is also drawn as the dashed line on the chart
      for (const [k] of seriesList()) {
        if (p[k] === undefined) continue;                                       // need didn't exist / had no value when this point was recorded
        setText('#value_' + k, f(p[k], BASE_KEY[k] && p[BASE_KEY[k]]));
      }
      setText('#sleepDebt', t.debt + ': ' + S.dbt.toFixed(1) + 'h');   // sleep debt (hours)
      const quad = p.v >= 0 ? (p.a >= 0 ? 0 : 1) : (p.a >= 0 ? 3 : 2);   // quadrant index: 0 Q1 excited, 1 Q2 calm, 2 Q3 sad, 3 Q4 anxious
      setText('#moodLabel', Math.abs(p.v) < .15 && Math.abs(p.a) < .15 ? t.neutral : t.q[quad]);
      setText('#behaviourLabel', t.st[behaviour]); $('#behaviourLabel').style.color = ST[behaviour].col;
      // #status = small pill badges (Sick / Depleting) shown only while the condition is active, plus an always-on
      // ⓘ legend chip. Each badge carries its full sentence as a hover tooltip (title), so the row stays compact.
      // _lastSig caches the active-condition signature so we re-render #status only on change (not every frame).
      const ill = !!S.ill, depl = S.bv < P.thr, sig = ill + ',' + depl;
      if (sig !== _lastSig) {
        const html = [
          ill  && `<span class="statusBadge sick"  title="${t.sick_text}">${t.sick_label}</span>`,
          depl && `<span class="statusBadge depl"  title="${t.depl_text}">${t.depl_label}</span>`,
          `<span class="statusBadge hint"  title="${t.hint_text}">${t.hint_label}</span>`,
        ].filter(Boolean).join('');
        const el = $('#status');
        if (el.innerHTML !== html) el.innerHTML = html;
        _lastSig = sig;
      }
    }

    // renderGauges = rebuild the #needGauges canvas set from the current NEEDS registry. Called on need
    // add / delete (and on load) so the gauge row matches the need set exactly — hunger's gauge appears
    // when hunger is present and disappears when it's removed. The frame loop draws into the canvases.
    function renderGauges() {
      const box = $('#needGauges');
      if (!box) return;
      box.innerHTML = NEEDS.map(n => `<canvas id="gaugeNeed_${n.key}" class="gauge" role="img"></canvas>`).join('');
    }

    /* ============ Main loop ============ */
    let last = performance.now(), owed = 0;   // last = previous frame time, owed = accumulated ticks still to run
    function frame(now) {
      INK = getComputedStyle(document.body).color;
      const dt = Math.min(.25, (now - last) / 1000); last = now;          // seconds since last frame, capped at 0.25
      // 10 ticks per second at speed 1. At most 60 ticks per frame: if the page lags, the sim falls behind real time instead of freezing the tab.
      if (run) { owed += dt * 10 * P.speed; let n = 0; while (owed >= 1 && n++ < 60) { tick(); owed--; } }
      const p = H[H.length - 1] || S, level = bodyClock(S.ct);            // S also has d, h, hp and sp, so it stands in before the first tick
      drawTimeline(); drawMoodPlane();
      gauge('#gaugeDominance', t.dom, p.d, -1, 1, t.sb, t.dm, COL.d);
      // Need gauges: one canvas per registered need (hunger included when present), rebuilt by renderGauges()
      // whenever needs change. Each frame we just (re)draw into whatever canvases exist.
      for (const n of NEEDS) gauge('#gaugeNeed_' + n.key, needLabel(n), S[n.key] ?? 0, 0, 1, t.sv, t.fl, n.color);
      gauge('#gaugeHealth', t.hlt, p.hp, 0, 1, t.hl0, t.hl1, COL.hp);
      gauge('#gaugeLight', t.light, W.light, 0, 1, t.dark, t.bright, '#e0b020');
      gauge('#gaugeSleep', t.slp, p.sp, 0, 1, t.rest, t.tired, COL.sp, [LOW + P.camp * level, UP + P.camp * level]);   // black lines = wake and sleep thresholds
      gauge('#gaugeTemp', t.tempg, W.temp, -10, 40, t.cold, t.hot, '#d97740', [K.tempIdeal]);   // ambient temperature with comfort mark at K.tempIdeal (20°C)
      readout();
      requestAnimationFrame(frame);
    }

    /* ============ UI ============ */
    const sign = x => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toFixed(1);   // format a number with + or −
    // fmt = format a slider value for display. Hours become HH:MM (rounded as whole minutes, so ":60" cannot appear).
    const fmt = (key, v, step) => {
      if (key === 'hour') { const m = Math.round(v * 60) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }
      return (+v).toFixed((String(step).split('.')[1] || '').length);
    };
    const clockLabel = () => {   // updates the optClock checkbox's tooltip when the speed slider changes (label text is just t.clock, set once by addCheck)
      const el = $('#optClockLabel');
      if (el && el.parentElement) el.parentElement.title = t.clockTip.replace('{s}', (2 / P.speed).toFixed(1));
    };
    const evName = e => t.ev[e.k] || e.k.replace(/_/g, ' ').replace(/^./, ch => ch.toUpperCase());          // translated name, or made from the key
    const eventLabel = k => EVENT_BY_KEY[k] ? evName(EVENT_BY_KEY[k]) : t.cust;                              // name for an event key ('custom' has no table row)
    // glyph = three little bars (valence, arousal, dominance) in the series colours: up = the event raises it, down = lowers it
    const glyph = e => `<svg width="38" height="22" aria-hidden="true">${['v', 'a', 'd'].map((k, i) => {
      const impact = e.amb ? 0 : e[k], bar = Math.abs(impact) * 10;
      return `<rect x="${i * 13}" y="${impact >= 0 ? 11 - bar : 11}" width="9" height="${Math.max(bar, .6)}" fill="${COL[k]}"/>`;
    }).join('')}<line x1="0" x2="38" y1="11" y2="11" stroke="currentColor" opacity=".4"/></svg>`;

    // Add one labelled slider to `box`. The input event is handled by a delegated listener
    // on #params in wireUI() (which dispatches by slider ID prefix) — no per-element
    // attachment here, so re-rendering the parameter tree doesn't re-attach N listeners.
    // Ids: slider_<key>, out_<key>.
    function addSlider(box, key, label, min, max, step, val) {
      const d = document.createElement('div');
      d.innerHTML = `<label>${label} <output id="out_${key}"></output><br><input type="range" id="slider_${key}" min="${min}" max="${max}" step="${step}" style="width:100%"></label>`;
      box.appendChild(d);
      const input = d.querySelector('input'), out = d.querySelector('output');
      input.value = val; out.textContent = fmt(key, val, step);
    }
    function sync(key) {
      const input = $('#slider_' + key), row = SLIDERS.find(r => r[0] === key); if (!input || !row) return;   // only the main sliders have a row
      const v = getParam(key);   // 'hour' lives in W now; everything else in P
      input.value = v; $('#out_' + key).textContent = fmt(key, v, row[3]);
    }
    function addGroup(parent, title) {
      const f = document.createElement('fieldset');
      f.innerHTML = `<legend>${title}</legend><div class="grid"></div>`;
      parent.appendChild(f);
      return f.lastChild;
    }
    function addBranch(parent, title) {
      const d = document.createElement('details');
      d.open = true;   // parameter sub-branches open by default (drawer declutter: show everything until the user closes it)
      d.innerHTML = `<summary>${title}</summary><div class="grid"></div>`;
      parent.appendChild(d);
      return d.lastChild;
    }

    // buildText = set all translated text on the page (data-t, data-a, labels). Called from build() on load + language change.
    function buildText() {
      t = T[lang]; document.documentElement.lang = lang; document.title = t.title;
      document.querySelectorAll('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
      document.querySelectorAll('[data-a]').forEach(el => { el.setAttribute('aria-label', t[el.dataset.a]); el.title = t[el.dataset.a]; });
      $('#pause').textContent = run ? t.pause : t.resume;
      clockLabel();
      $('#behaviourLegend').innerHTML = Object.keys(ST).map(k => `<span style="color:${ST[k].col}">\u25a0</span> ${t.st[k]}`).join(' &nbsp; ');
    }

    // The change event is delegated on #variableList in wireUI() — no per-element attachment.
    function buildVariablePanel() {
      // Builtin non-need series use t[textkey] for the label; need series (builtin hunger + custom) use
      // needLabel(n) and the need's own colour. Needs default to SHOW on for builtin hunger, off otherwise,
      // so the chart isn't cluttered — the user opts in per need.
      const rows = seriesList().map(([k, n]) => {
        const need = NEEDS.find(x => x.key === k);
        const label = need ? needLabel(need) : t[n];
        const col = seriesColor(k);
        if (need && SHOW[k] === undefined) SHOW[k] = need.builtin ? 1 : 0;   // first-seen default
        return `<label><input type="checkbox" data-s="${k}" ${SHOW[k] ? 'checked' : ''}> <span style="color:${col}">\u25a0</span> ${label} <b id="value_${k}"></b></label><br>`;
      }).join('');
      $('#variableList').innerHTML = rows;
    }


    // input + change events on the sliders and optClock/optCircadian checkboxes are
    // delegated on #params in wireUI() — no per-element attachments here, so re-rendering
    // the parameter tree (e.g. on language change) doesn't re-attach N listeners.
    function buildParameterTree() {
      const root = $('#params'); root.innerHTML = '';
      // Group 1 (needs: hrate, hmood) lives in the Needs drawer now — configured per-need there.
      [['gm', 0], ['gs', 2], ['gw', 3], ['gh', 4], ['gb', 5], ['gl', 7], ['gpv', 8]].forEach(([title, group]) => {
        const branch = addBranch(root, t[title]);
        SLIDERS.filter(row => row[4] === group).forEach(([k, min, max, step]) => {
          addSlider(branch, k, t.p[k], min, max, step, getParam(k));
          const tip = t.pd[k];
          if (tip) { const el = $('#slider_' + k); el.title = tip; if (el.parentElement) el.parentElement.title = tip; }
        });
      });
      const tempBranch = addBranch(root, t.temph);
      Object.keys(TEMP).forEach(k => addSlider(tempBranch, 'temp_' + k, t.tp[k], 0, 1, .05, TEMP[k]));
      // Clock / light / rhythm options: built dynamically here so they inherit the same bordered-box style
      // as the other parameter branches. Each checkbox's change event is handled by the delegated listener
      // on #params (which dispatches on the checkbox ID).
      const woptBranch = addBranch(root, t.wopt);
      const addCheck = (id, labelKey, tipKey, checked, spanId) => {
        const lbl = document.createElement('label');
        lbl.style.cssText = 'display:block;margin:2px 0';
        const text = typeof labelKey === 'string' ? t[labelKey] : labelKey();
        const tip = typeof tipKey === 'string' ? t[tipKey] : (tipKey ? tipKey() : '');
        lbl.innerHTML = `<input type="checkbox" id="${id}" ${checked ? 'checked' : ''}> <span${spanId ? ` id="${spanId}"` : ''}>${text}</span>`;
        if (tip) lbl.title = tip;
        woptBranch.appendChild(lbl);
        return lbl;
      };
      // optClock's span gets id="optClockLabel" so clockLabel() can update its tooltip when the speed slider changes.
      addCheck('optClock', 'clock', () => t.clockTip.replace('{s}', (2 / P.speed).toFixed(1)), clock, 'optClockLabel');
      addCheck('optCircadian', 'circ', 'circTip', circOn);
    }

    // The click event is delegated on #customButtons in wireUI() — each button carries data-dim.
    function buildCustomEventComposer() {
      $('#customButtons').innerHTML = '';
      [['v', 'val', '#14a39a'], ['a', 'aro', '#d99a00'], ['d', 'dom', '#8a63d2']].forEach(([dim, lbl, col]) => {
        const btn = document.createElement('button');
        btn.id = 'cadd_' + dim;
        btn.dataset.dim = dim;
        btn.innerHTML = `<span style="color:${col}">\u25a0</span> ${t.custAddFmt.replace('{dim}', t[lbl])}`;
        btn.style.borderColor = col;
        $('#customButtons').appendChild(btn);
      });
      renderCustomQueue();
    }

    // Click events are delegated on #events in wireUI() — buttons carry data-event-key,
    // data-cust-idx, or data-cust-del-idx depending on which action they trigger.
    function buildEventGrid() {
      $('#events').innerHTML = '';
      // Sleep events only — these are "more complicated than random" (they force the sleep state machine
      // via force:true in the #events click handler). Random events get trigger buttons in the random-rate
      // config (#randomCfg) instead; US events (ate_food, predator_attack) fire via archetype
      // approach. The big preset grid that duplicated all those is gone.
      const sleepBox = addGroup($('#events'), t.eg.sleep); sleepBox.classList.add('eventGrid');
      EVENTS.filter(e => e.g === 'sleep' && !e.hide).forEach(e => {
        const button = document.createElement('button');
        button.style.cssText = 'width:100%;text-align:left';
        button.dataset.eventKey = e.k;
        button.title = e.amb ? t.amb
          : e.pulses ? e.pulses.map(p => `${p.dim === 'v' ? t.val : p.dim === 'a' ? t.aro : t.dom} ${sign(p.amp)} (\u03c4=${p.tau})`).join('  \u00b7  ')
            : `${t.val} ${sign(e.v)}  ${t.aro} ${sign(e.a)}  ${t.dom} ${sign(e.d)}`;
        button.innerHTML = `${glyph(e)}<br><b>${evName(e)}</b>${e.amb ? `<br><small>${t.amb}</small>` : ''}`;
        sleepBox.appendChild(button);
      });
      // Custom events group (user-defined, saved to localStorage). Each entry is a button + small × delete.
      const custBox = addGroup($('#events'), t.custEventGroupCustom); custBox.classList.add('eventGrid');
      if (CUSTOM_EVENTS.length === 0) {
        const empty = document.createElement('small');
        empty.textContent = t.custEmpty;
        empty.style.cssText = 'opacity:.6;grid-column:1/-1';
        custBox.appendChild(empty);
      } else {
        CUSTOM_EVENTS.forEach((e, i) => {
          const wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex;gap:4px;align-items:stretch';
          const button = document.createElement('button');
          button.style.cssText = 'flex:1;text-align:left;min-width:0';
          button.dataset.custIdx = i;
          const sideFx = [];
          if (e.hp) sideFx.push(`hp ${sign(e.hp)}`);
          if (e.food) { const hn = NEEDS.find(x => x.key === 'h'); sideFx.push(`${hn ? needLabel(hn) : t.custEventFood} ${e.food}`); }   // legacy e.food (old saved events) — always meant hunger
          if (e.needs) for (const k in e.needs) {
            const n = NEEDS.find(x => x.key === k);
            sideFx.push(`${n ? needLabel(n) : k} ${e.needs[k]}`);
          }
          button.title = `${t.val} ${sign(e.v)}  ${t.aro} ${sign(e.a)}  ${t.dom} ${sign(e.d)}` + (sideFx.length ? '  ·  ' + sideFx.join('  ') : '');
          button.innerHTML = `${glyph(e)}<br><b>${evName(e)}</b>`;
          const del = document.createElement('button');
          del.textContent = '×';
          del.dataset.custDelIdx = i;
          del.style.cssText = 'flex:0 0 auto;width:24px;padding:0;background:transparent;border:1px solid currentColor;border-radius:3px;cursor:pointer;color:#e04040;font-size:14px;line-height:1';
          del.title = t.custEventDelete;
          wrap.appendChild(button);
          wrap.appendChild(del);
          custBox.appendChild(wrap);
        });
      }
    }

    // ---------- Bestiary + memory panel UI (moved here from the Memory & learning section) ----------
    // These four functions read ARCHETYPES / TYPE_TO_US / memory / objectSvg to build/refresh
    // the bestiary list (#bestiary), the add-archetype form (#archForm), and the memory list (#memoryList). Pure DOM — no sim logic.
    // (Originally colocated with the memory Map for "nearby data" reasons; moved here so the
    // Memory & learning section contains only memory logic + lifecycle.)

    // Each group header uses t.eg[g] (existing translation). Neutral (no events) uses t.eg.neutral.
    function renderBestiary() {
      const list = $('#bestiary');
      if (!list) return;
      const byGroup = {};
      for (const [name, arch] of Object.entries(ARCHETYPES)) {
        const firstEvent = arch.events[0];
        const g = firstEvent ? (EVENT_BY_KEY[firstEvent]?.g || 'other') : 'neutral';
        (byGroup[g] ??= []).push([name, arch]);
      }
      // Sort groups in a stable, meaningful order
      const groupOrder = ['threat', 'food', 'social', 'env', 'body', 'sleep', 'neutral', 'other'];
      const sortedGroups = Object.entries(byGroup).sort((a, b) => groupOrder.indexOf(a[0]) - groupOrder.indexOf(b[0]));
      list.innerHTML = sortedGroups.map(([g, entries]) => {
        const groupLabel = t.eg[g] || g;
        const items = entries.map(([name, arch]) => {
          const feats = `${t.feat.size[arch.features.size]} \u00b7 ${t.feat.color[arch.features.color]} \u00b7 ${t.feat.shape[arch.features.shape]}`;
          // Per-archetype despawn (surroundAgeRate) config — the only spawn-related knob that's a property of the
          // object TYPE rather than the environment. Spawn RATES moved to the Environment drawer (per-env per-state).
          // Hidden until the gear is clicked. Changes write through live (delegated in wireUI).
          const av = arch.surroundAgeRate ?? 1;
          const ageRow = `<tr><td>${t.ageh}</td><td><input type="number" class="spawnCell" data-name="${name}" data-field="age" step="0.1" min="0" value="${av}" title="${t.ageCellTip}"></td></tr>`;
          return `<div class="bestItem">${objectSvg(arch.features)} <b>${name}</b> ${feats} <button class="miniBtn spawnArch" data-name="${name}">+</button><button class="archCfg" data-name="${name}" title="${t.spawnTip}">\u2699</button><div class="bestCfg" hidden><table><tbody>${ageRow}</tbody></table></div></div>`;
        }).join('');
        return `<div class="bestCat">${groupLabel}</div><div class="bestCatGrid">${items}</div>`;
      }).join('');
      // Click on .spawnArch / .archCfg and input on .spawnCell are delegated on #bestiary in wireUI().
    }

    // SPAWN_STATES + STATE_LABELS = the behaviour states that can spawn objects, and short labels for the
    // per-archetype spawn-rate config form (rendered inline inside each bestiary item by renderBestiary).
    // nrem/rem are excluded — no archetype spawns while sleeping. Each archetype's config is a compact
    // table of state-rate inputs + a despawn (surroundAgeRate) input, toggled by the gear button.
    // CFG_STATES = SPAWN_STATES minus approach_object/flee_object — those are agent reaction states, not
    // environment conditions, so they're hidden from the config UI (their source defaults still apply).
    // TICKS_PER_HOUR = ticks per sim-hour (DT = 0.05 sim-hours/tick → 20). The UI displays spawn rates as
    // encounters per sim-hour (= per-tick rate × TICKS_PER_HOUR) and converts back to per-tick on input.
    const SPAWN_STATES = ['idle', 'foraging', 'socialising', 'explore', 'approach_object', 'flee_object'];
    const STATE_LABELS = { idle: 'Idle', foraging: 'Forage', socialising: 'Social', explore: 'Explore', approach_object: 'Approach', flee_object: 'Flee' };
    const CFG_STATES = SPAWN_STATES.filter(s => s !== 'approach_object' && s !== 'flee_object');
    const TICKS_PER_HOUR = 1 / DT;

    // renderRandomCfg = build the live-tunable random-event chances editor. One row per RANDOM entry,
    // a single number input showing encounters/sim-hour (= per-tick chance × TICKS_PER_HOUR). Changes
    // write through to r.chance (÷ TICKS_PER_HOUR) immediately and persist to localStorage. The global
    // 'rate' slider multiplies all of these on top — it is not duplicated here. Called from build().
    function renderRandomCfg() {
      const box = $('#randomCfg');
      if (!box) return;
      const rows = RANDOM.map(r => {
        const label = r.id.replace(/_/g, ' ').replace(/^\w/, c => c.toUpperCase());
        const v = r.chance * TICKS_PER_HOUR;
        return `<tr><td>${label}</td><td><input type="number" class="randChance" data-id="${r.id}" step="0.01" min="0" value="${+v.toFixed(3)}" title="${t.randChanceTip}"></td><td><button class="randTrigger" data-id="${r.id}" title="${t.randTriggerTip}">\u25b6</button></td></tr>`;
      }).join('');
      box.innerHTML = `<table><tbody>${rows}</tbody></table>`;
    }

    /* ---- Environment drawer ----
    // renderEnvironments builds the env list with the active env highlighted, and a per-env editor:
    //   - Force button (throws the agent into this env immediately — bypasses wander roll) — non-active envs only
    //   - Edit button (toggles the editor panel) — sits next to Force; always present
    //   - editor: editable label (custom envs only), temp range, enterWeight, leaveFactor (live number inputs),
    //     a spawn-rule list (one row per archetype: dropdown + rate + remove), and an "add rule" row
    //   - Delete button (×) — every env EXCEPT the active one. Deleting a builtin persists (ENV_DELETED set).
    // Spawn rates are flat (one per archetype, behaviour-independent). Rate displays as encounters/sim-hour
    // (= per-tick × TICKS_PER_HOUR) and converts back to per-tick on input. Edits write through live + persist.
    // openEditors (a Set of env keys) preserves which editors are expanded across re-renders. */
    const openEditors = new Set();
    function renderEnvironments() {
      const box = $('#envList');
      if (!box) return;
      const archNames = Object.keys(ARCHETYPES);
      box.innerHTML = ENV_KEYS.map(key => {
        const env = ENVIRONMENTS[key];
        const active = key === W.environment;
        const label = t.env?.[key] || env.label || key;
        const built = env.builtin;
        const open = openEditors.has(key);
        // Spawn-rule rows: one per archetype that currently has a rate > 0. Dropdown (archetype) + rate input + ×.
        const rules = Object.entries(env.spawns || {}).filter(([, r]) => r > 0).map(([an, rate]) => {
          const v = rate * TICKS_PER_HOUR;
          const opts = archNames.map(n => `<option value="${n}"${n === an ? ' selected' : ''}>${n}</option>`).join('');
          return `<div class="envRule"><select class="envSpawnArch" data-env="${key}" data-prev="${an}">${opts}</select><input type="number" class="envSpawnRate" data-env="${key}" data-arch="${an}" step="0.01" min="0" value="${+v.toFixed(3)}" title="${t.spawnCellTip}"><button class="miniBtn envRuleDel" data-env="${key}" data-arch="${an}" title="${t.envSpawnDelTip}">\u00d7</button></div>`;
        }).join('');
        // Add-rule row: a dropdown of archetypes not yet used + an "add" button. Hidden if every archetype is used.
        const used = new Set(Object.keys(env.spawns || {}).filter(a => env.spawns[a] > 0));
        const free = archNames.filter(n => !used.has(n));
        const addOpts = free.map(n => `<option value="${n}">${n}</option>`).join('');
        const addRow = free.length ? `<div class="envRule envRuleAdd"><select class="envSpawnArchNew" data-env="${key}">${addOpts}</select><button class="miniBtn envSpawnAdd" data-env="${key}">${t.envSpawnAdd}</button></div>` : '';
        const [tlo, thi] = env.tempRange || [12, 24];
        const labelEl = built
          ? `<b class="envLabelStatic">${label}</b>`
          : `<input type="text" class="envLabel" data-env="${key}" value="${env.label || key}" size="10">`;
        return `<div class="envItem${active ? ' envActive' : ''}">
          <div class="envHead">
            ${labelEl}
            ${active ? `<span class="envTag">${t.envActive}</span>` : `<button class="miniBtn envForce" data-env="${key}" title="${t.envForceTip}">${t.envForce}</button>`}
            <button class="miniBtn envEdit" data-env="${key}" title="${t.envEditTip}">${t.envEdit}</button>
            ${active ? '' : `<button class="miniBtn envDel" data-env="${key}" title="${t.envDelTip}">\u00d7</button>`}
          </div>
          <div class="envEditor" ${open ? '' : 'hidden'}>
            <div class="envProps">
              <label>${t.envTempLo} <input type="number" class="envTemp" data-env="${key}" data-field="lo" step="0.5" value="${tlo}"></label>
              <label>${t.envTempHi} <input type="number" class="envTemp" data-env="${key}" data-field="hi" step="0.5" value="${thi}"></label>
              <label title="${t.envEnterTip}">${t.envEnter} <input type="number" class="envFactor" data-env="${key}" data-field="enter" step="0.1" min="0" value="${env.enterWeight ?? 1}"></label>
              <label title="${t.envLeaveTip}">${t.envLeave} <input type="number" class="envFactor" data-env="${key}" data-field="leave" step="0.1" min="0" value="${env.leaveFactor ?? 1}"></label>
            </div>
            <div class="envRules">${rules}${addRow}</div>
          </div>
        </div>`;
      }).join('');
    }

    // The "Outcome" dropdown now lists EVENTS directly (no more TYPE_TO_US indirection) — the user picks
    // which event fires when this archetype is approached. Multi-event archetypes (like rival) are
    // not editable via this form; edit ARCHETYPES in source for those.
    function buildArchForm() {
      const form = $('#archForm');
      if (!form) return;
      form.innerHTML = `
    <label>${t.archName} <input type="text" id="archName" size="10"></label>
    <label>${t.archUT} <select id="archUT">${[...EVENTS.filter(e => !e.hide), ...CUSTOM_EVENTS].map(e => `<option value="${e.k}">${evName(e)}</option>`).join('')}</select></label>
    <label>${t.archSize} <select id="archSize">${SURR_FEATURES.size.map(s => `<option value="${s}">${t.feat.size[s]}</option>`).join('')}</select></label>
    <label>${t.archColor} <select id="archColor">${SURR_FEATURES.color.map(s => `<option value="${s}">${t.feat.color[s]}</option>`).join('')}</select></label>
    <label>${t.archShape} <select id="archShape">${SURR_FEATURES.shape.map(s => `<option value="${s}">${t.feat.shape[s]}</option>`).join('')}</select></label>
  `;
    }

    // renderNeedsList = the Needs drawer. Each need is a compact row (swatch + label + key + live value +
    // ⚙ gear + × delete) mirroring the bestiary pattern. ⚙ toggles a hidden inline .needCfg table with
    // the need's tuning sliders (decay, mood weight, desper floor); hunger additionally owns the global
    // hmood slider on its config table. All needs are deletable (hunger included).
    // input on .needRow is delegated on #needsList in wireUI(); ⚙ / × clicks are delegated there too.
    function renderNeedsList() {
      const box = $('#needsList');
      if (!box) return;
      box.innerHTML = NEEDS.map((n, i) => {
        const val = S[n.key] ?? 0;
        const decayVal = P[n.decayParam] ?? 0;
        // Hunger carries the global mood-coupling multiplier (hmood) on its config table — it scales the
        // weighted-sum needMood(s) across all needs, so it lives with the canonical need rather than a slider bank.
        const hungerExtra = n.key === 'h' ? `
          <tr><td>${t.p.hmood}</td><td><input type="range" class="nsl_param" data-param="hmood" min="0" max="3" step=".1" value="${P.hmood}"><output>${P.hmood.toFixed(2)}</output></td></tr>` : '';
        return `<div class="needItem">
          <span class="needSwatch" style="background:${n.color}"></span>
          <b>${needLabel(n)}</b>
          <small style="opacity:.6">${n.key}</small>
          <small style="opacity:.7;margin-left:auto">= ${val.toFixed(2)}</small>
          <button class="miniBtn needCfgBtn" data-need-idx="${i}" title="${t.needTune ?? '⚙'}">⚙</button>
          <button class="miniBtn needDel" data-need-del-idx="${i}" title="${t.needDelete}">×</button>
          <div class="needCfg" hidden><table><tbody>
            <tr><td>${t.needDecay}</td><td><input type="range" class="nsl_decay" data-need-idx="${i}" min=".0001" max=".003" step=".0001" value="${decayVal}"><output>${decayVal.toFixed(4)}</output></td></tr>
            <tr><td>${t.needMoodW}</td><td><input type="range" class="nsl_mood" data-need-idx="${i}" min="0" max="3" step=".1" value="${n.moodWeight}"><output>${n.moodWeight.toFixed(2)}</output></td></tr>
            <tr><td>${t.needDesper}</td><td><input type="range" class="nsl_desp" data-need-idx="${i}" min="0" max="1" step=".05" value="${n.desperFloor}"><output>${n.desperFloor.toFixed(2)}</output></td></tr>
            ${hungerExtra}
          </tbody></table></div>
        </div>`;
      }).join('');
    }

    // buildNeedForm = the Add-need modal form. key (sanitised) + label + colour + decay + mood weight +
    // desper floor. Decay and moodWeight/desperFloor become the need's P entry on Create (the decay slider
    // for a custom need is created on the fly when buildParameterTree runs — see Phase 5/deferred note).
    function buildNeedForm() {
      const form = $('#needForm');
      if (!form) return;
      const colorChoices = ['#1f77b4', '#d62728', '#9467bd', '#ff7f0e', '#17becf', '#8c564b', '#e377c2', '#2ca02c'];
      form.innerHTML = `
    <label>${t.needKey} <input type="text" id="needKeyInput" size="10" placeholder="e.g. thirst"></label>
    <label>${t.needLabelField} <input type="text" id="needLabelInput" size="14" placeholder="display name"></label>
    <label>${t.needColor} <select id="needColorInput">${colorChoices.map(c => `<option value="${c}">${c}</option>`).join('')}</select></label>
    <label>${t.needDecay} <input type="number" id="needDecayInput" step="0.0001" min="0.0001" max="0.003" value="0.0005"></label>
    <label>${t.needMoodW} <input type="number" id="needMoodWInput" step="0.1" min="0" max="3" value="1"></label>
    <label>${t.needDesper} <input type="number" id="needDesperInput" step="0.05" min="0" max="1" value="0.3"></label>
  `;
    }

    function renderNeeds() {
      renderNeedsList();
      buildNeedForm();
      renderGauges();
    }

    function renderMemory() {
      const list = $('#memoryList');
      if (!list) return;
      if (memory.size === 0) { list.innerHTML = `<small>${t.memEmpty}</small>`; return; }
      list.innerHTML = Array.from(memory.entries())
        .sort((a, b) => a[1].valence - b[1].valence)   // sort by valence: most negative (fear) first, most positive (attraction) last
        .map(([key, entry]) => {
          const [size, color, shape] = key.split('|');
          const features = { size, color, shape };
          const valCol = entry.valence >= 0 ? COL.h : COL.v;   // green for positive, teal for negative
          const valStr = (entry.valence >= 0 ? '+' : '') + entry.valence.toFixed(2);
          const feats = `${t.feat.size[size]} \u00b7 ${t.feat.color[color]} \u00b7 ${t.feat.shape[shape]}`;
          const sal = Math.abs(entry.valence) * entry.conf;   // 0..1, how much this memory matters
          const opa = (.08 + sal * .8).toFixed(2);              // faded for weak memories, bold for strong ones
          return `<div class="memItem" style="background:rgba(127,127,127,${opa})">${objectSvg(features)} ${feats} <span class="memVal" style="color:${valCol}">${valStr}</span> <span class="memConf">conf ${(entry.conf * 100).toFixed(0)}%</span> <span class="memCount">\u00d7${entry.count}</span></div>`;
        }).join('');
    }

    function build() {
      buildText();
      buildVariablePanel();
      buildParameterTree();
      buildCustomEventComposer();
      buildEventGrid();
      $('#slider_hour').disabled = clock;
      renderRefs();
      renderBestiary();
      renderEnvironments();
      renderRandomCfg();
      buildArchForm();
      renderNeeds();
    }

    // Render the staged custom-event pulse queue. Each item is a row with inline-editable
    // amp + τ sliders (no per-dim defaults — every spike starts at amp=0, τ=10 and is tuned in place).
    // Called from build() (so it re-renders on language change) and whenever the queue changes.
    const TICK_REAL_S = 0.1;   // seconds of real time per tick at speed 1 (10 ticks/sec)
    const TICK_SIM_MIN = 3;    // sim minutes per tick (DT = 0.05 sim hours)
    const PULSE_LIFE = 5.3;   // ~exp(-x) drop threshold: pulse fades to <0.5% of amp after ~5.3×τ ticks
    function fmtLife(tau) {
      const realS = (PULSE_LIFE * tau * TICK_REAL_S).toFixed(1);
      const simMin = Math.round(PULSE_LIFE * tau * TICK_SIM_MIN);
      return `~${realS}s / ${simMin} sim-min`;
    }
    function renderCustomQueue() {
      const q = $('#customQueue');
      if (!q) return;
      // Each staged pulse = a card: header (swatch + dim + life + remove) on top, amp + τ as full-width
      // slider rows below. Side effects render as their own aligned grid regardless of queue state, so a
      // pure side-effect event (e.g. "Drink Water" with only a thirst refill) needs no placeholder text.
      const pulseCards = customQueue.map((p, i) => {
        const lbl = p.dim === 'v' ? 'val' : p.dim === 'a' ? 'aro' : 'dom';
        const col = COL[p.dim];
        return `<div class="queueItem" style="border-left-color:${col}">
          <div class="qHead">
            <span style="color:${col}">\u25a0</span> ${t[lbl]}
            <span class="life">${fmtLife(p.tau)}</span>
            <button class="miniBtn rmCustom" data-idx="${i}" aria-label="×">×</button>
          </div>
          <div class="qRow"><span>${t.custAmp}</span><input type="range" class="qsl_a" data-idx="${i}" min="-1" max="1" step=".05" value="${p.amp}"><output>${p.amp.toFixed(2)}</output></div>
          <div class="qRow"><span>${t.custTau}</span><input type="range" class="qsl_t" data-idx="${i}" min="1" max="500" step="1" value="${p.tau}"><output>${p.tau}</output></div>
        </div>`;
      }).join('');
      // Side effects: HP first, then one row per registered need (including custom needs). Stage into customFx;
      // read by Fire / Save. Always rendered — no empty state needed.
      const fxRows = NEEDS.map(n => {
        const val = customFx.needs[n.key] ?? 0;
        return `<div class="fxRow"><span><span style="color:${n.color}">\u25a0</span> ${needLabel(n)}</span><input type="range" class="fxsl_need" data-need="${n.key}" min="0" max="1" step=".05" value="${val}"><output>${val.toFixed(2)}</output></div>`;
      }).join('');
      const fxSection = `<div class="fxSection">
        <div class="fxTitle">${t.custFxTitle}</div>
        <div class="fxRow"><span>${t.custEventHP}</span><input type="range" class="fxsl_hp" min="-1" max="1" step=".05" value="${customFx.hp}"><output>${customFx.hp.toFixed(2)}</output></div>
        ${fxRows}
      </div>`;
      q.innerHTML = pulseCards + fxSection;
      // input + click events are delegated on #customQueue in wireUI() — no per-element attachments here.
    }
    /* ============ UI event wiring (delegated) ============ */
    // wireUI attaches every event listener ONCE on script load. Listeners on stable
    // parents (#customQueue, #bestiary, #events, #variableList, #params, #customButtons,
    // #timeline) catch clicks/changes/inputs from their children via event bubbling —
    // no re-attachment when build() re-renders the DOM on language change. Static
    // element handlers (#pause, #load, #save, #drawerbtn, #lang, modal open + create buttons)
    // attach once here too.
    //
    // Convention: every dynamically-created interactive element carries a data-* attribute
    // (data-idx, data-type, data-event-key, data-cust-idx, data-cust-del-idx, data-dim,
    // data-s) so the delegated handler can identify which child was acted on. The older
    // forEach(b => b.onclick = ...) patterns were dropped during the delegation refactor.
    function wireUI() {
      // ===== Static button handlers (attach once) =====
      $('#pause').addEventListener('click', () => { run = !run; $('#pause').textContent = run ? t.pause : t.resume; });
      // Load / Save are stubs for now — no persistence wired up. Buttons stay visible so the affordance is
      // discoverable, but clicking only surfaces the "not implemented yet" tooltip. init() (full reset) is
      // still callable internally but has no UI entry point until Save/Load lands.
      $('#load').addEventListener('click', () => { /* TODO: load saved sim state */ });
      $('#save').addEventListener('click', () => { /* TODO: persist current sim state */ });
      $('#drawerbtn').addEventListener('click', () => { const d = $('#drawer'); d.hidden = !d.hidden; $('#drawerbtn').setAttribute('aria-expanded', !d.hidden); });
      $('#lang').addEventListener('click', () => { lang = lang === 'en' ? 'cs' : 'en'; build(); });

      // Custom event composer buttons
      // stagedFx = collect non-zero customFx into a clean object for the event. Returns null if nothing staged.
      const stagedFx = () => {
        const out = {};
        if (customFx.hp) out.hp = customFx.hp;
        const needs = {};
        for (const k in customFx.needs) if (customFx.needs[k]) needs[k] = customFx.needs[k];
        if (Object.keys(needs).length) out.needs = needs;
        return Object.keys(out).length ? out : null;
      };
