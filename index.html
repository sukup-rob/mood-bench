      $('#fireCustom').addEventListener('click', () => {
        const fx = stagedFx();
        if (customQueue.length === 0 && !fx) return;                          // nothing staged → no-op (avoids a free mood blip)
        const ev = { g: 'custom', k: 'custom', pulses: customQueue.map(p => ({ ...p })) };   // pulses go straight through pulsesOf() — no SHAPE fallback. Salience is calculated from the pulse amps.
        if (fx) Object.assign(ev, fx);                                        // attach staged hp / needs side effects
        Q.push(ev);
      });
      $('#clearCustom').addEventListener('click', () => { customQueue.length = 0; customFx.hp = 0; customFx.needs = {}; renderCustomQueue(); });
      // Save the composed pulses as a reusable custom event. Derives v/a/d from max pulse amp per dim so
      // the saved button shows a glyph and has a salience fallback; stores explicit `pulses` so the exact
      // multi-pulse shape the user composed is what fires (not a SHAPE rebuild from impacts).
      $('#saveCustom').addEventListener('click', () => {
        const fx = stagedFx();
        if (customQueue.length === 0 && !fx) { alert(t.custSaveEmpty); return; }
        const rawName = prompt(t.custSavePrompt, '').trim();
        if (!rawName) return;
        const k = 'custom_' + rawName.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        if (CUSTOM_EVENTS.some(e => e.k === k)) { alert(t.custSaveExists); return; }
        const maxByDim = dim => {
          const amps = customQueue.filter(p => p.dim === dim).map(p => Math.abs(p.amp));
          return amps.length ? Math.max(...amps) * Math.sign(customQueue.find(p => p.dim === dim).amp || 1) : 0;
        };
        const e = {
          g: 'custom', k,
          v: maxByDim('v'), a: maxByDim('a'), d: maxByDim('d'),
          pulses: customQueue.map(p => ({ dim: p.dim, amp: p.amp, tau: p.tau })),
        };
        if (fx) Object.assign(e, fx);   // attach staged hp / needs side effects
        CUSTOM_EVENTS.push(e);
        saveCustomEvents();
        syncEventByKey();
        buildEventGrid();
        buildArchForm();
        alert(t.custSaveDone);
      });

      // Modal open buttons
      $('#refs').addEventListener('click', () => { $('#refsModal').hidden = false; });
      $('#openArchEditor').addEventListener('click', () => { $('#archModal').hidden = false; });
      $('#openNeedEditor').addEventListener('click', () => { $('#needModal').hidden = false; });

      // Modal "create" buttons
      $('#archCreate').addEventListener('click', () => {
        const form = $('#archForm');
        const name = form.querySelector('#archName').value.trim();
        if (!name || ARCHETYPES[name]) return;
        ARCHETYPES[name] = {
          features: {
            size: form.querySelector('#archSize').value,
            color: form.querySelector('#archColor').value,
            shape: form.querySelector('#archShape').value,
          },
          events: [form.querySelector('#archUT').value],   // single event (the picked one) — for multi-event archetypes, edit source
        };
        renderBestiary();
        renderEnvironments();   // new archetype = new column in every env's spawn table
        $('#archModal').hidden = true;
      });
      // Add a custom need (or restore a previously-deleted builtin like hunger). The key is sanitised
      // (a–z0–9, _); collisions with existing need keys or P keys refuse — except a hidden builtin key,
      // which is restored (un-hidden) instead of refused. On Create: register the need, persist, re-merge
      // into NEEDS, seed S[key]=.8, re-render the needs list + composer + chart legend + gauges.
      $('#needCreate').addEventListener('click', () => {
        const form = $('#needForm');
        const rawKey = form.querySelector('#needKeyInput').value.trim();
        if (!rawKey) return;
        const key = rawKey.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
        // Restore a previously-deleted builtin need (e.g. hunger) instead of refusing the collision.
        const hiddenBuiltin = BUILTIN_NEEDS.find(n => n.key === key && HIDDEN_BUILTIN_NEEDS.has(n.key));
        if (hiddenBuiltin) {
          restoreBuiltinNeed(key);
          if (S[key] === undefined) S[key] = .8;           // re-seed live state (was deleted)
          renderNeeds();
          renderCustomQueue();
          buildVariablePanel();
          $('#needModal').hidden = true;
          form.querySelector('#needKeyInput').value = '';
          form.querySelector('#needLabelInput').value = '';
          return;
        }
        if (!key || NEEDS.some(n => n.key === key) || P[key + 'rate'] !== undefined) return;   // refuse collisions
        const num = id => { const v = parseFloat(form.querySelector(id).value); return isNaN(v) ? 0 : v; };
        const decayParam = key + 'rate';
        const need = {
          key,
          label: form.querySelector('#needLabelInput').value.trim() || key,
          color: form.querySelector('#needColorInput').value,
          decayParam,
          moodWeight: num('#needMoodWInput') || 1,
          desperFloor: num('#needDesperInput') || 0.3,
          builtin: false,
        };
        CUSTOM_NEEDS.push(need);
        saveCustomNeeds(CUSTOM_NEEDS);
        syncNeeds();
        // Register the decay rate in P so applyNeeds' P[n.decayParam] resolves and a slider can be built.
        P[decayParam] = num('#needDecayInput') || 0.0005;
        if (S[key] === undefined) S[key] = .8;   // seed live agent state for the new need
        renderNeeds();
        renderCustomQueue();   // refresh composer so the new need appears as a slider
        buildVariablePanel(); // refresh chart legend so the new need gets a checkbox
        $('#needModal').hidden = true;
        form.querySelector('#needKeyInput').value = '';
        form.querySelector('#needLabelInput').value = '';
      });
      // ===== Timeline tag interaction (delegated on #timeline canvas) =====
      // The colored squares on the timeline ARE the recent-events list now. Hovering shows EVERY square under the
      // cursor in #eventDetail (one row each) — so when tags overlap (adjacent ticks) you see all of them at once.
      // Click pins a CLUSTER: every square at the clicked x is pinned together (mirroring hover-shows-all),
      // and clicks accumulate — pin one cluster, then another, all stack up in #eventDetail. Clicking a cluster
      // whose tags are ALL already pinned un-pins them (whole-cluster toggle). Clicking empty canvas clears every
      // pin. Each pinned tag snapshots its LOG row at click time, so detail survives even after the badge scrolls
      // off the left edge. Hit zone = the square's own width (MARKS.w=10).
      const hitAt = px => MARKS.filter(mk => Math.abs(mk.x - px) <= mk.w / 2 + 1);   // every tag under the cursor, front→back in paint order
      $('#timeline').addEventListener('mousemove', e => {
        const px = e.clientX - e.target.getBoundingClientRect().left;
        _hoverMarks = hitAt(px);
      });
      $('#timeline').addEventListener('mouseleave', () => { _hoverMarks = []; });
      $('#timeline').addEventListener('click', e => {
        const px = e.clientX - e.target.getBoundingClientRect().left;
        const stack = hitAt(px);
        if (!stack.length) { _pinned.clear(); return; }                      // clicked empty → drop all pins
        const allPinned = stack.every(mk => _pinned.has(mk.m.id));
        if (allPinned) {                                                     // cluster fully pinned → unpin them all
          for (const mk of stack) _pinned.delete(mk.m.id);
        } else {                                                            // pin every tag in the cluster, snapshot its LOG row
          for (const mk of stack) {
            if (!_pinned.has(mk.m.id)) _pinned.set(mk.m.id, LOG.find(x => x.id === mk.m.id) || null);
          }
        }
      });

      // ===== Variable panel checkboxes — delegate on #variableList =====
      $('#variableList').addEventListener('change', e => {
        const box = e.target.closest('input[type=checkbox][data-s]');
        if (!box) return;
        SHOW[box.dataset.s] = box.checked;
      });

      // ===== #params: slider input + optClock/optCircadian change (delegated) =====
      // Sliders dispatch by ID prefix: 'slider_temp_*' writes to TEMP, others write to P via setParam.
      // 'speed' is special-cased to also refresh the optClock tooltip.
      $('#params').addEventListener('input', e => {
        const slider = e.target.closest('input[type=range]');
        if (!slider || !slider.id || !slider.id.startsWith('slider_')) return;
        const k = slider.id.slice('slider_'.length);
        const v = +slider.value;
        const out = document.getElementById('out_' + k);
        if (out) out.textContent = fmt(k, v, slider.step);
        if (k.startsWith('temp_')) {
          TEMP[k.slice('temp_'.length)] = v;
        } else {
          setParam(k, v);
          if (k === 'speed') clockLabel();
        }
      });
      $('#params').addEventListener('change', e => {
        const box = e.target.closest('input[type=checkbox]');
        if (!box) return;
        if (box.id === 'optClock') {
          clock = box.checked;
          const sliderHour = document.getElementById('slider_hour');
          if (sliderHour) sliderHour.disabled = clock;
        } else if (box.id === 'optCircadian') {
          circOn = box.checked;
        }
      });

      // ===== Needs-list: ⚙ toggle + × delete (delegated click on #needsList) =====
      // ⚙ toggles the inline .needCfg tuning table (same pattern as bestiary .archCfg).
      // × deletes ANY need (hunger included): removes it from NEEDS, wipes its live state + decay param,
      // and records the deletion so it survives reload. Series/gauge/history adapt dynamically (see
      // seriesList / frame / readout — all derive the need set from NEEDS, not a hardcoded 'h').
      $('#needsList').addEventListener('click', e => {
        const cfgBtn = e.target.closest('button.needCfgBtn');
        if (cfgBtn) {
          const cfg = cfgBtn.parentElement.querySelector('.needCfg');
          if (cfg) cfg.hidden = !cfg.hidden;
          return;
        }
        const del = e.target.closest('button[data-need-del-idx]');
        if (!del) return;
        const idx = +del.dataset.needDelIdx;
        const n = NEEDS[idx];
        if (!n) return;
        if (n.builtin) {
          // Builtin (hunger): record the hide so it stays gone on reload; keep hmood in P (harmless).
          HIDDEN_BUILTIN_NEEDS.add(n.key);
          saveHiddenBuiltinNeeds(HIDDEN_BUILTIN_NEEDS);
        } else {
          CUSTOM_NEEDS = CUSTOM_NEEDS.filter(x => x.key !== n.key);
          saveCustomNeeds(CUSTOM_NEEDS);
        }
        syncNeeds();
        delete S[n.key];            // wipe live agent state for the removed need
        if (!n.builtin) delete P[n.decayParam];    // wipe its decay param (custom needs only)
        renderNeeds();              // rebuilds needs list + gauges (hunger gauge disappears with the need)
        renderCustomQueue();      // refresh composer so the deleted need's slider disappears
        buildVariablePanel();     // refresh chart legend so the deleted need's checkbox disappears
      });

      // ===== Needs-list: inline tuning sliders (delegated input on #needsList) =====
      // .nsl_decay → P[n.decayParam] (live). .nsl_mood / .nsl_desp → mutate the need object's
      // moodWeight / desperFloor live and persist for custom needs. .nsl_param → P[paramKey] for the
      // hunger-only global (hmood). No full re-render on drag — just the output updates.
      $('#needsList').addEventListener('input', e => {
        const sl = e.target.closest('input[type=range]');
        if (!sl) return;
        const td = sl.closest('td');
        const out = td && td.querySelector('output');
        const v = parseFloat(sl.value);
        if (sl.classList.contains('nsl_decay') || sl.classList.contains('nsl_mood') || sl.classList.contains('nsl_desp')) {
          const n = NEEDS[+sl.dataset.needIdx];
          if (!n) return;
          if (sl.classList.contains('nsl_decay')) {
            P[n.decayParam] = v;
            if (out) out.textContent = v.toFixed(4);
          } else if (sl.classList.contains('nsl_mood')) {
            n.moodWeight = v;
            if (out) out.textContent = v.toFixed(2);
            if (!n.builtin) saveCustomNeeds(CUSTOM_NEEDS);
          } else {
            n.desperFloor = v;
            if (out) out.textContent = v.toFixed(2);
            if (!n.builtin) saveCustomNeeds(CUSTOM_NEEDS);
          }
        } else if (sl.classList.contains('nsl_param')) {
          P[sl.dataset.param] = v;
          if (out) out.textContent = v.toFixed(2);
        }
      });

      $('#bestiary').addEventListener('click', e => {
        const spawnBtn = e.target.closest('.spawnArch');
        if (spawnBtn) {
          const name = spawnBtn.dataset.name;
          if (ARCHETYPES[name]) spawnObject(name);
          renderSurrounding();
          return;
        }
        const cfgBtn = e.target.closest('.archCfg');
        if (cfgBtn) {
          const cfg = cfgBtn.parentElement.querySelector('.bestCfg');
          if (cfg) cfg.hidden = !cfg.hidden;
        }
      });
      $('#bestiary').addEventListener('input', e => {
        const inp = e.target.closest('input.spawnCell');
        if (!inp) return;
        const name = inp.dataset.name;
        const arch = ARCHETYPES[name];
        if (!arch) return;
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        if (inp.dataset.field === 'age') {
          arch.surroundAgeRate = v;   // despawn rate is a raw multiplier — no conversion. (Spawn rates live on envs now.)
        }
      });

      // ===== Environment drawer — delegate on #envList (live edits + force + edit + delete) =====
      $('#envList').addEventListener('input', e => {
        const inp = e.target;
        const key = inp.dataset.env;
        const env = ENVIRONMENTS[key];
        if (!env) return;
        if (inp.classList.contains('envLabel')) {
          env.label = inp.value || key;   // custom env rename — live, no re-render needed (input already shows it)
          saveEnvEdits();
          return;
        }
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        if (inp.classList.contains('envSpawnRate')) {
          // Flat spawn rate: encounters/sim-hour → per-tick. 0 = remove the archetype from env.spawns.
          const an = inp.dataset.arch;
          if (!env.spawns) env.spawns = {};
          const tickRate = v / TICKS_PER_HOUR;
          if (tickRate === 0) { delete env.spawns[an]; saveEnvEdits(); renderEnvironments(); }   // 0 = row removed
          else { env.spawns[an] = tickRate; saveEnvEdits(); }
        } else if (inp.classList.contains('envTemp')) {
          const [lo, hi] = env.tempRange || [12, 24];
          env.tempRange = inp.dataset.field === 'lo' ? [v, hi] : [lo, v];
          saveEnvEdits();
          if (key === W.environment) deriveWorld();   // live temp update if editing active env
        } else if (inp.classList.contains('envFactor')) {
          if (inp.dataset.field === 'enter') env.enterWeight = v;
          else env.leaveFactor = v;
          saveEnvEdits();
        }
      });
      // Change-event (selects don't fire 'input' reliably): when a spawn-rule's archetype dropdown changes,
      // move the rate to the new archetype key (deleting the old one). Re-render to refresh the add-rule dropdown.
      $('#envList').addEventListener('change', e => {
        const sel = e.target.closest('select.envSpawnArch');
        if (!sel) return;
        const key = sel.dataset.env;
        const env = ENVIRONMENTS[key];
        if (!env || !env.spawns) return;
        const prev = sel.dataset.prev, next = sel.value;
        if (prev === next || env.spawns[next]) { renderEnvironments(); return; }   // no-op or collision → revert via re-render
        env.spawns[next] = env.spawns[prev];
        delete env.spawns[prev];
        saveEnvEdits();
        renderEnvironments();
      });
      $('#envList').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const key = btn.dataset.env;
        const env = ENVIRONMENTS[key];
        if (!env) return;
        if (btn.classList.contains('envForce')) {
          changeEnvironment(key, 'forced');   // grab + throw — bypasses wander roll, logs "via forced"
          renderEnvironments();   // re-render so the active highlight + button set moves
        } else if (btn.classList.contains('envEdit')) {
          if (openEditors.has(key)) openEditors.delete(key); else openEditors.add(key);   // toggle editor panel
          renderEnvironments();
        } else if (btn.classList.contains('envDel')) {
          if (key === W.environment) return;   // can't delete the active env (no fall-back is safe mid-tick)
          if (env.builtin) ENV_DELETED.add(key);   // builtin deletion persists across reloads
          delete ENVIRONMENTS[key];
          ENV_KEYS = Object.keys(ENVIRONMENTS);
          openEditors.delete(key);
          saveEnvEdits();
          renderEnvironments();
        } else if (btn.classList.contains('envSpawnAdd')) {
          // Add rule: read the new-archetype dropdown next to this button, give it a default rate, re-render.
          const row = btn.closest('.envRuleAdd');
          const sel = row && row.querySelector('select.envSpawnArchNew');
          const an = sel && sel.value;
          if (!an) return;
          if (!env.spawns) env.spawns = {};
          env.spawns[an] = env.spawns[an] ?? 0.001;   // 0.001/tick default (~0.02/hr) — user tunes from there
          saveEnvEdits();
          renderEnvironments();
        } else if (btn.classList.contains('envRuleDel')) {
          const an = btn.dataset.arch;
          if (env.spawns) delete env.spawns[an];
          saveEnvEdits();
          renderEnvironments();
        }
      });

      // Add-environment button: creates a blank custom env and re-renders. The new env starts empty (no spawns)
      // with neutral factors; the user fills it in via the editor. Its editor opens automatically for convenience.
      $('#openEnvEditor').addEventListener('click', () => {
        let i = 1, key = `env_${i}`;
        while (ENVIRONMENTS[key]) key = `env_${++i}`;
        ENVIRONMENTS[key] = { label: key, tempRange: [12, 24], enterWeight: 1, leaveFactor: 1, spawns: {} };
        ENV_KEYS = Object.keys(ENVIRONMENTS);
        openEditors.add(key);
        saveEnvEdits();
        renderEnvironments();
      });

      // ===== Random-event chances — delegate on #randomCfg (live writes + persist) =====
      $('#randomCfg').addEventListener('input', e => {
        const inp = e.target.closest('input.randChance');
        if (!inp) return;
        const row = RANDOM.find(r => r.id === inp.dataset.id);
        if (!row) return;
        const v = parseFloat(inp.value);
        if (isNaN(v) || v < 0) return;
        row.chance = v / TICKS_PER_HOUR;   // encounters/sim-hour → per-tick
        saveRandomChances();
      });
      // Trigger button: fire a random event manually (bypasses chance roll + when-gate).
      $('#randomCfg').addEventListener('click', e => {
        const btn = e.target.closest('button.randTrigger');
        if (!btn) return;
        const r = RANDOM.find(row => row.id === btn.dataset.id);
        if (!r) return;
        if (r.event) Q.push(EVENT_BY_KEY[r.event]);
        if (r.act) r.act(W, S);
      });

      // ===== Custom-event add buttons — delegate on #customButtons =====
      $('#customButtons').addEventListener('click', e => {
        const btn = e.target.closest('button[data-dim]');
        if (!btn) return;
        customQueue.push({ dim: btn.dataset.dim, amp: 0, tau: 10 });
        renderCustomQueue();
      });

      // ===== Custom queue: amp/τ sliders (input) + remove buttons (click) — delegate on #customQueue =====
      $('#customQueue').addEventListener('input', e => {
        const aSlider = e.target.closest('.qsl_a');
        if (aSlider) {
          const i = +aSlider.dataset.idx;
          customQueue[i].amp = +aSlider.value;
          aSlider.parentElement.querySelector('output').textContent = (+aSlider.value).toFixed(2);
          return;
        }
        const tSlider = e.target.closest('.qsl_t');
        if (tSlider) {
          const i = +tSlider.dataset.idx;
          customQueue[i].tau = +tSlider.value;
          tSlider.parentElement.querySelector('output').textContent = tSlider.value;
          const item = tSlider.closest('.queueItem');
          if (item) item.querySelector('.life').textContent = fmtLife(+tSlider.value);
          return;
        }
        // Side-effect sliders: HP + per-need refills. Stage into customFx; the output next to each slider
        // updates live. No re-render needed (the slider's own value is already authoritative).
        const hpSlider = e.target.closest('.fxsl_hp');
        if (hpSlider) {
          customFx.hp = +hpSlider.value;
          hpSlider.parentElement.querySelector('output').textContent = (+hpSlider.value).toFixed(2);
          return;
        }
        const needSlider = e.target.closest('.fxsl_need');
        if (needSlider) {
          customFx.needs[needSlider.dataset.need] = +needSlider.value;
          needSlider.parentElement.querySelector('output').textContent = (+needSlider.value).toFixed(2);
          return;
        }
      });
      $('#customQueue').addEventListener('click', e => {
        const rmBtn = e.target.closest('.rmCustom');
        if (!rmBtn) return;
        customQueue.splice(+rmBtn.dataset.idx, 1);
        renderCustomQueue();
      });

      // ===== Event grid: preset buttons + custom event buttons + delete buttons — delegate on #events =====
      $('#events').addEventListener('click', e => {
        // Delete button on a saved custom event
        const del = e.target.closest('button[data-cust-del-idx]');
        if (del) {
          CUSTOM_EVENTS.splice(+del.dataset.custDelIdx, 1);
          saveCustomEvents();
          syncEventByKey();
          buildEventGrid();
          buildArchForm();   // refresh dropdown so the deleted event no longer appears as an outcome option
          return;
        }
        // Saved custom event fire button
        const custBtn = e.target.closest('button[data-cust-idx]');
        if (custBtn) {
          Q.push(CUSTOM_EVENTS[+custBtn.dataset.custIdx]);   // fire the saved event directly (no force flag, no act — just push to Q)
          return;
        }
        // Preset event button
        const evtBtn = e.target.closest('button[data-event-key]');
        if (evtBtn) {
          const ev = EVENT_BY_KEY[evtBtn.dataset.eventKey];
          if (ev) Q.push(ev.g === 'sleep' ? { ...ev, force: true } : ev);
          return;
        }
      });

      // ===== Escape closes all modals =====
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { $('#refsModal').hidden = true; $('#archModal').hidden = true; $('#needModal').hidden = true; }
      });
    }

    build();
    wireUI();   // attach all event listeners ONCE — survives build() re-runs on language change
    requestAnimationFrame(frame);

    /* ============ References modal ============ */
    // Refs are grouped under their `topic` field — emitted as a small uppercase header whenever the topic changes.
    function renderRefs() {
      let html = '', lastTopic = null;
      for (const r of t.refs) {
        if (r.topic !== lastTopic) { html += `<h3 class="refTopic">${r.topic}</h3>`; lastTopic = r.topic; }
        html += `<div class="ref"><cite>${r.cite}</cite><div class="desc">${r.desc}</div><div class="where">${r.where}</div></div>`;
      }
      $('#refsList').innerHTML = html;
    }
  </script>
</body>

</html>
