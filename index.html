<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mood bench</title>
  <style>
    *,
    ::before,
    ::after {
      box-sizing: border-box
    }

    /* Shared base for all the small inline "tool buttons" scattered through the
       drawer and modals (× deletes, ⚙ config toggles, + spawn buttons, etc).
       Per-class rules below only set the bits that genuinely differ. */
    .miniBtn {
      background: transparent;
      border: 1px solid currentColor;
      border-radius: 3px;
      color: inherit;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 5px
    }
    .miniBtn:hover { background: var(--bg-press) }

    :root {
      color-scheme: light dark;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);

      /* Palette — all raw color literals in the file route through these vars.
         Light/dark overrides can hook [data-theme=light]/[data-theme=dark] later. */
      --border-faint:   rgba(127, 127, 127, .4);
      --border-strong:  rgba(127, 127, 127, .6);
      --bg-rest:        rgba(127, 127, 127, .10);
      --bg-hover:       rgba(127, 127, 127, .20);
      --bg-active:      rgba(127, 127, 127, .22);
      --bg-soft:        rgba(127, 127, 127, .06);
      --bg-item:        rgba(127, 127, 127, .12);
      --bg-press:       rgba(127, 127, 127, .25);

      --panel-border:   #2a3540;
      --panel-bg:       #2a3540;
      --panel-bg-deep:  #1a2230;
      --muted:          #7a8a99;
      --accent:         #4a9e6f;
      --accent-bg:      rgba(74, 158, 111, .08);

      --badge-fg:       #dfe6ee;
      --sick-bg:        #3a2230;  --sick-fg: #e88;  --sick-bd: #6a3a4a;
      --depl-bg:        #2a2a40;  --depl-fg: #a9a3d8; --depl-bd: #4a4a6a;
    }

    :root[data-theme=light] {
      color-scheme: light
    }

    /* the page viewer can set data-theme */
    :root[data-theme=dark] {
      color-scheme: dark
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0 auto;
      padding: 12px;
      /* body is now the push-drawer grid: auto drawer (left) + main column (centers content).
         Drawer on the left to match the left-floated ☰ toggle. */
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px
    }

    /* #main = the centered content column. Takes over body's old max-width: 1040px role.
       On wide screens the drawer eats the dead left margin before main squishes. */
    #main {
      max-width: 1040px;
      margin: 0 auto;
      width: 100%;
      min-width: 0          /* allow grid to shrink this column below content size */
    }

    /* #drawer = left-side push panel for authoring blocks (variables, events, params).
       Same [hidden] pattern as the old #side. */
    #drawer {
      width: 320px;
      min-width: 0
    }

    #drawer[hidden] {
      display: none
    }

    /* Header layout: the drawer toggle sits at the left edge, title + controls flow after it.
       Uses flex so the toggle, title, and right-side controls (refs / lang) line up on one row. */
    header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap
    }
    header h1 { margin: 0; flex: 1 1 auto; min-width: 0; }
    header p { margin: 0; flex-basis: 100%; }

    /* Drawer toggle: a labelled sidebar button, not a bare glyph. Shows a panel-bars icon + "Editor"
       label, a chevron that points toward the drawer (right when closed, left when open), and a
       pressed/active look when the drawer is visible. aria-expanded is mirrored to the visual state. */
    #drawerbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      cursor: pointer;
      background: var(--bg-rest);
      border: 1.5px solid var(--border-faint);
      border-radius: 6px;
      color: inherit;
      font-size: .9em;
      line-height: 1;
      transition: background .12s, border-color .12s
    }
    #drawerbtn:hover { background: var(--bg-hover); }
    #drawerbtn[aria-expanded="true"] {
      background: var(--bg-active);
      border-color: var(--border-strong)
    }
    #drawerbtn .dbIcon { display: inline-flex; align-items: center; font-size: 1em; }
    /* chevron points toward the drawer: when closed (drawer hidden), it points right (open →);
       when open, it points left (close ←). Flips via aria-expanded. */
    #drawerbtn .dbChev { transition: transform .12s; display: inline-block; }
    #drawerbtn[aria-expanded="true"] .dbChev { transform: rotate(180deg); }
    @media(max-width:560px) {
      #drawerbtn .dbLabel { display: none; }   /* icon-only on phones, label is too wide */
    }

    @media(max-width:700px) {
      body {
        grid-template-columns: 1fr
      }

      #drawer {
        width: auto
      }
    }

    canvas {
      width: 100%;
      display: block
    }

    #timeline {
      height: 280px
    }

    #moodPlane {
      aspect-ratio: 1;
      max-width: 300px;
      margin: auto
    }

    .gauge {
      height: 44px;
      max-width: 300px;
      margin: auto
    }

    .envBadge {
      display: inline-block;
      padding: 2px 10px;
      margin: 4px auto 2px;
      border-radius: 10px;
      background: var(--panel-bg);
      color: var(--badge-fg);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: capitalize;
      text-align: center;
    }

    /* #status = compact condition badges under the behaviour label. Sick/Depleting pills appear only while
       active; the ⓘ legend chip is always on. Each carries its full sentence as a hover tooltip. */
    #status {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      margin: 4px
    }
    .statusBadge {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .03em;
      text-transform: capitalize;
      cursor: help;
      white-space: nowrap;
    }
    .statusBadge.sick { background: var(--sick-bg); color: var(--sick-fg); border: 1px solid var(--sick-bd); }
    .statusBadge.depl { background: var(--depl-bg); color: var(--depl-fg); border: 1px solid var(--depl-bd); }
    .statusBadge.hint { background: transparent; color: var(--muted); border: 1px solid var(--panel-border); font-size: 12px; padding: 1px 7px; }

    .envItem {
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 8px;
      margin: 6px 0;
    }
    .envItem.envActive {
      border-color: var(--accent);
      background: var(--accent-bg);
    }
    .envHead {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .envHead b {
      flex: 1;
      text-transform: capitalize;
    }
    .envTag {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      letter-spacing: .05em;
    }
    /* .envForce / .envDel reuse .miniBtn; only the slightly larger pill differs. */
    .envForce, .envDel {
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 4px
    }
    .envProps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 6px 0;
    }
    .envProps label {
      display: flex;
      flex-direction: column;
      font-size: 11px;
      color: var(--muted);
      gap: 2px;
    }
    .envProps input {
      width: 70px;
    }
    .envEditor {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--panel-border);
    }
    .envLabel {
      flex: 1;
      font-weight: bold;
      text-transform: capitalize;
      background: transparent;
      border: 1px solid transparent;
      color: inherit;
      padding: 1px 4px;
      border-radius: 3px;
      min-width: 80px;
    }
    .envLabel:focus {
      border-color: var(--accent);
      outline: none;
    }
    .envLabelStatic {
      flex: 1;
      text-transform: capitalize;
    }
    /* .envEdit mirrors .envForce/.envDel exactly — share the rule. */
    .envEdit {
      font-size: 12px;
      padding: 1px 8px;
      border-radius: 4px
    }
    .envRules {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 4px;
    }
    .envRule {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .envRule select {
      flex: 1;
      min-width: 0;
      font-size: 12px;
    }
    .envRule input[type=number] {
      width: 64px;
    }
    .envRuleAdd {
      margin-top: 2px;
      padding-top: 4px;
      border-top: 1px dashed var(--panel-border);
    }
    .envSpawnAdd {
      font-size: 11px;
      padding: 1px 6px;
      white-space: nowrap
      /* border-radius 3px from .miniBtn */
    }
    .envRuleDel {
      font-size: 12px;
      padding: 1px 6px
      /* border-radius 3px and cursor:pointer come from .miniBtn */
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr));
      gap: 8px 20px
    }

    .eventGrid {
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px
    }

    /* #eventDetail = strip under the timeline. Shows every tag currently under the cursor (one .evRow each,
       so overlapping badges are all visible at once), or a hint/empty message when nothing is hovered.
       The timeline badges themselves are the recent-events view. */
    #eventDetail {
      margin-top: 4px;
      min-height: 22px
    }
    #eventDetail small { color: var(--muted) }

    .evRow {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
      flex-wrap: wrap
    }
    /* Pinned row = sticky fallback after the cursor leaves. Slightly brighter than a hover preview so it reads
       as "this is what's pinned", not just another hovered tag. */
    .evRow.pinned { opacity: 1 }
    .evRow.pinned .evNum { box-shadow: 0 0 0 2px rgba(255,255,255,.35) }

    .evNum {
      display: inline-block;
      min-width: 18px;
      height: 18px;
      line-height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      color: #fff;
      font-size: .78em;
      font-weight: 600;
      text-align: center
    }

    .evTime {
      font-size: .82em;
      opacity: .7;
      font-variant-numeric: tabular-nums
    }

    .evChip {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 8px;
      color: #fff;
      font-size: .78em;
      line-height: 1.45;
      white-space: nowrap
    }

    @media(max-width:700px) {
      .evChip {
        font-size: .72em;
        padding: 1px 5px
      }
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr));
      gap: 16px
    }

    details details {
      margin-left: 1em
    }

    /* parameter branches + event groups + custom-event composer: matching bordered-box look */
    #params>details,
    #events>fieldset,
    #composerField {
      margin: 6px 0;
      padding: 6px 12px;
      border: 1px solid var(--border-faint);
      border-radius: 4px
    }

    #params>details>summary {
      font-weight: 600;
      margin: 0 0 4px
    }

    /* Drawer section headings (Needs / Bestiary / Environments) each carry a float:right action button.
       <summary> is display:list-item by default, which does NOT establish a block formatting context — so an
       uncontained float leaks out and the next summary's text flows up beside the previous button, making the
       three buttons look like they're reacting to each other. display:flow-root makes each summary establish
       its own block formatting context, which contains the float so every button stays parked at the right
       edge of its own row. */
    #drawer > details > summary { display: flow-root; }
    /* The three summary action buttons themselves (openNeedEditor / openArchEditor / openEnvEditor). */
    #drawer > details > summary > button { float: right; }

    #events>fieldset>legend {
      font-weight: 600;
      padding: 0 4px
    }

    /* references modal */
    #refsModal[hidden] {
      display: none
    }

    #refsBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow: auto;
      z-index: 50
    }

    #refsPanel {
      background: Canvas;
      color: CanvasText;
      border: 1px solid CanvasText;
      border-radius: 8px;
      max-width: 720px;
      width: 100%;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3)
    }

    #refsPanel h2 {
      margin: 0 0 4px
    }

    #refsPanel .ref {
      margin: 14px 0;
      padding-left: 14px;
      border-left: 2px solid currentColor;
      opacity: .92
    }

    #refsPanel .ref cite {
      font-style: italic
    }

    #refsPanel .ref .where {
      font-size: .9em;
      opacity: .7;
      margin-top: 4px
    }

    #refsPanel .ref .desc {
      margin-top: 4px
    }

    #refsPanel .refTopic {
      margin: 24px 0 6px;
      font-size: .78em;
      letter-spacing: .08em;
      text-transform: uppercase;
      opacity: .75;
      border-bottom: 1px solid currentColor;
      padding-bottom: 4px
    }

    #refsPanel .refTopic:first-child {
      margin-top: 8px
    }

    #refsClose {
      float: right;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 4px
    }

    #refsClose:hover {
      background: var(--bg-hover)
    }

    /* custom event composer */
    #customButtons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px
    }

    #customButtons button {
      padding: 6px 14px;
      cursor: pointer;
      border: 1.5px dashed;
      /* colour set inline per dim — distinct from the solid preset event buttons */
      background: var(--bg-soft);
      border-radius: 4px;
      font-weight: 500;
    }

    #customButtons button:hover {
      background: var(--bg-hover)
    }

    #customQueue {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0
    }

    /* Each staged pulse = a compact card. Header row carries the dim swatch, label, life preview,
       and the remove button on the far right; amp + τ are full-width slider rows below. Avoids the
       old cramped single-line flex-wrap that mashed two 80px sliders + labels + life + × together. */
    .queueItem {
      padding: 6px 8px;
      background: var(--bg-rest);
      border-left: 3px solid;   /* dim colour set inline per card */
      border-radius: 3px;
      font-size: .9em;
    }
    .queueItem .qHead {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      font-weight: 500;
    }
    .queueItem .qHead .life { margin-left: auto; opacity: .6; font-size: .85em; font-weight: 400; }
    .queueItem .qRow {
      display: grid;
      grid-template-columns: 2.5em 1fr 2.5em;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
    }
    .queueItem .qRow > output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
    .queueItem input[type=range] { width: 100%; vertical-align: middle; }

    /* Side effects = a labelled grid. Two columns: label (with swatch) | slider+value, so HP and every
       need line up vertically regardless of label width. Replaces the old inline-styled dashed divider. */
    .fxSection {
      margin-top: 4px;
      padding: 6px 8px;
      background: var(--bg-soft);
      border-radius: 3px;
    }
    .fxSection .fxTitle {
      font-size: .8em;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .6;
      margin-bottom: 4px;
    }
    .fxRow {
      display: grid;
      grid-template-columns: 8em 1fr 2.5em;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
      font-size: .9em;
    }
    .fxRow > output { text-align: right; font-variant-numeric: tabular-nums; opacity: .8; }
    .fxRow input[type=range] { width: 100%; vertical-align: middle; }

    /* Need rows in the Needs drawer: mirror the bestiary .bestItem pattern — a compact flex row with
       a swatch + label + live value + ⚙ gear + × delete, and a hidden .needCfg table toggled by ⚙. */
    .needItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-item);
      border-radius: 3px;
      font-size: .85em;
      flex-wrap: wrap;
      margin: 2px 0;
    }
    .needItem b { text-transform: capitalize }
    .needSwatch {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 2px;
      flex: 0 0 auto;
    }
    .needCfgBtn { padding: 0 4px; vertical-align: middle }
    /* .needCfgBtn:hover comes from .miniBtn:hover */
    .needDel { padding: 0 5px }
    /* .needDel:hover comes from .miniBtn:hover */
    .needCfg { margin-top: 4px; width: 100%; overflow: hidden }
    .needCfg table {
      border-collapse: collapse;
      font-size: 11px;
      width: 100%;
      table-layout: fixed;
    }
    .needCfg td { padding: 1px 2px; white-space: nowrap; overflow: hidden; vertical-align: middle; }
    .needCfg td:first-child { text-align: right; opacity: .6; width: 5em }
    .needCfg td:last-child { width: auto }
    .needCfg td:last-child > input[type=range] { width: calc(100% - 2.7em); vertical-align: middle; min-width: 0 }
    .needCfg output { display: inline-block; width: 2.5em; text-align: right; font-variant-numeric: tabular-nums; opacity: .8 }

    .rmCustom { padding: 0 6px }
    /* color/border/cursor/font-size/line-height/border-radius + :hover all from .miniBtn */


    /* surrounding panel */
    #surroundingList {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
      min-height: 1.5em
    }

    .surrItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-item);
      border-radius: 3px;
      font-size: .85em
    }

    .surrItem svg {
      flex-shrink: 0
    }

    .surrItem .ttl {
      opacity: .6;
      margin-left: auto;
      padding-left: 8px
    }

    .surrItem .type {
      opacity: .5;
      font-size: .85em
    }

    /* memory panel */
    #memoryList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
      gap: 4px;
      margin-top: 6px;
      min-height: 1.5em
    }

    .memItem {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: var(--bg-item);
      border-radius: 3px;
      font-size: .85em;
      flex-wrap: wrap
    }

    .memItem .memVal {
      font-weight: 600;
      min-width: 36px;
      text-align: right
    }

    .memItem .memConf {
      opacity: .7;
      min-width: 42px
    }

    .memItem .memCount {
      opacity: .5;
      margin-left: auto
    }

    /* bestiary panel (grouped by category) */
    .bestNote { color: var(--muted) }
    #bestiary {
      margin-top: 6px
    }

    /* per-archetype spawn-rate config (inline, toggled by the gear button in each bestiary item) */
    .archCfg {
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
      vertical-align: middle
    }
    .bestCfg {
      margin-top: 4px;
    }
    .bestCfg table {
      border-collapse: collapse;
      font-size: 11px;
      width: 100%;
    }
    .bestCfg td {
      padding: 1px 2px;
      white-space: nowrap;
    }
    .bestCfg td:first-child {
      text-align: right;
      opacity: .6;
      width: 1%;
    }
    .bestCfg input[type=number] {
      width: 64px;
      padding: 0 1px;
      font-size: 11px;
      text-align: right;
    }

    /* random-event chances (compact table, mirrors .bestCfg styling) */
    #randomCfg table {
      border-collapse: collapse;
      font-size: 11px;
    }
    #randomCfg td {
      padding: 1px 2px;
      white-space: nowrap;
    }
    #randomCfg td:first-child {
      text-align: right;
      opacity: .6;
      width: 1%;
    }
    #randomCfg input[type=number] {
      width: 64px;
      padding: 0 1px;
      font-size: 11px;
      text-align: right;
    }
    #randomCfg .randTrigger {
      padding: 0 4px;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
    }

    .bestCat {
      font-size: .8em;
      font-weight: 600;
      text-transform: uppercase;
      opacity: .6;
      margin: 8px 0 2px
    }

    .bestCatGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr));
      gap: 4px;
      margin-bottom: 4px
    }

    .bestItem {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--bg-item);
      border-radius: 3px;
      font-size: .85em;
      flex-wrap: wrap
    }

    .bestItem b {
      text-transform: capitalize
    }

    .bestItem small {
      opacity: .6
    }

    .spawnArch { padding: 0 5px; margin-left: auto }
    /* rest from .miniBtn */


    /* archetype editor modal + needs editor modal (shared styles via comma-separated selectors) */
    #archModal[hidden],
    #needModal[hidden] {
      display: none
    }

    #archBackdrop,
    #needBackdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow: auto;
      z-index: 50
    }

    #archPanel,
    #needPanel {
      background: Canvas;
      color: CanvasText;
      border: 1px solid CanvasText;
      border-radius: 8px;
      max-width: 520px;
      width: 100%;
      padding: 20px 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .3)
    }

    #archPanel h2,
    #needPanel h2 {
      margin: 0 0 8px
    }

    #archClose,
    #needClose {
      float: right;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px 8px;
      background: transparent;
      color: inherit;
      border: 1px solid currentColor;
      border-radius: 4px
    }

    ═════════════════════════════════════════════════════════════════ */

    // setText = change an element's text only if it differs, so screen readers do not re-announce the same line every frame
    const setText = (sel, txt) => { const el = $(sel); if (el.textContent !== txt) el.textContent = txt; };

        tp: { boldness: 'Plachý ↔ Odvážný', exploration: 'Vyhýbavý ↔ Zvídavý', activity: 'Nečinný ↔ Aktivní (nepoužito)', aggressiveness: 'Mírný ↔ Agresivní (nepoužito)', sociability: 'Samotářský ↔ Společenský (nepoužito)' }
      }
    };
    let lang = 'en';      // English is the default (since that's the language of the papers cited)
    let t = T[lang];      // t = text for the active language

    /* ============ Parameters (the sliders) ============ */
    // CONFIG = the immutable slider defaults — what Reset restores. (Hour is NOT in here:
    // it is world state, not a parameter — its default lives in WORLD_DEFAULTS below.)
    // A tick = one simulation step = 3 sim minutes = 0.1 s (at speed 1).
    // Sleep rates are per SIM HOUR (the pseudocode's per-minute rates would saturate in a second at this time scale).
    const CONFIG = Object.freeze({
      // -- mood dynamics --
      decay: .02,    // fraction of the gap to baseline that closes each tick, for the slow layer (behaviour and needs effects)
      plen: 1,      // how long every event pulse lasts, as a multiplier (1 = the fade times in SHAPE and EXTRA)
      drift: .002,   // how fast baseline follows current mood while awake (much slower than decay)
      pers: 1,       // personality multiplier on valence impacts
      thr: -.3,      // depletion starts when baseline valence is below this
      depfactor: .998, // per-tick multiplier on baseline arousal and dominance while depleted (awake only). Renamed from "dep" to disambiguate from sleep deprivation s.dep.
      // -- health (new group) --
      sleepHeal: .003, sickSleepHeal: .0005, illDrain: .0006,   // per-tick health: asleep, asleep+sick, sick drain
      wakeCooldown: 30,      // ticks before the agent may fall asleep again after an interrupted wake
      // -- behaviour (new group) --
      sticky: 3, decideevery: 15,   // behaviour-resistance weight, ticks between awake-behaviour lotteries
      // -- needs --
      hrate: .0005,  // hunger meter lost per tick at multiplier 1 (full to empty in ~200 s)
      hmood: 1,      // how hard an empty hunger meter pushes valence down and arousal up
      // -- sleep --
      sleep: .2,     // the agent can only fall asleep while arousal is below this
      krise: .06,    // Process S rise rate while awake (per sim hour)
      kdecay: .16,   // Process S decay rate while asleep (per sim hour)
      camp: .12,     // how far the body clock (Process C) moves the sleep/wake thresholds
      cycle: 120,    // length of one NREM+REM cycle (sim minutes)
      expect: 8,     // expected sleep per day (sim hours): scales REM growth and defines sleep debt
      nightlen: 8,   // how long a "full night" is for the ultradian cycle progression (separate from expect, so the debt target and cycle reference can differ)
      repair: .007,  // per tick, how fast sleep pulls the baseline back to HOME (scaled by sleep stage)
      // -- world and clock --
      speed: 1,      // simulation speed multiplier
      amp: .3,       // body clock moves arousal by up to +/- this much
      tau: 23.5,     // free-running body-clock period in hours (mice ~23.5)
      ent: .25,      // how strongly light pulls the body clock toward world time (per sim hour)
      rate: 1,       // multiplier on every random-event chance (see RANDOM)
      // -- learning  --
      learnRate: .3,           // Rescorla-Wagner learning rate: how fast memory shifts toward actual outcome
      // -- preview pulses  --
      previewGain: 1,          // overall amplitude multiplier on anticipation pulses (1 = ~30% of the matching US event)
      previewConfFloor: .15,   // memory confidence below this → no preview fires (low-conf expectations aren't felt yet)
      previewValFloor: .05     // |expected valence| below this → no preview fires (no learned association = nothing to anticipate)
    });
    // P = the LIVE slider values (mutable). init() does Object.assign(P, CONFIG) on Reset so sliders return to defaults.
    const P = { ...CONFIG };

    // WORLD_DEFAULTS = defaults for world state. (Hour is sim state — it lives in W at runtime,
    // not in P. It has a slider attached, so its default needs a home; this is it.)
    const WORLD_DEFAULTS = Object.freeze({ hour: 9 });

    // getParam / setParam = read / write a slider-controlled value, regardless of whether it lives in P or W.
    // (Currently only 'hour' lives in W; everything else is in P. If you add more slider-controlled world
    // state later, add it to W + branch on its key here.)
    const getParam = k => k === 'hour' ? W.hour : P[k];
    const setParam = (k, v) => {
      if (k === 'hour') { W.hour = v; deriveWorld(); }   // recompute light/temp so the gauge stays live while paused
      else P[k] = v;
    };
    // SLIDERS = slider settings: [key, min, max, step, group]. Groups: 0 mood, 1 needs, 2 sleep, 3 environment, 4 health, 5 behaviour, 7 learning, 8 preview pulses.
    const SLIDERS = [['decay', .002, .1, .002, 0], ['plen', .25, 4, .25, 0], ['drift', 0, .02, .0005, 0], ['pers', .2, 2, .05, 0], ['thr', -.9, 0, .05, 0], ['depfactor', .98, 1, .0005, 0],
    ['hrate', .0001, .003, .0001, 1], ['hmood', 0, 3, .1, 1],
    ['sleep', -.5, 1, .05, 2], ['krise', .01, .3, .005, 2], ['kdecay', .02, .6, .01, 2], ['camp', 0, .3, .01, 2], ['amp', 0, .6, .05, 2], ['tau', 22, 26, .1, 2], ['ent', 0, 1, .05, 2], ['cycle', 20, 240, 10, 2], ['expect', 4, 12, .5, 2], ['nightlen', 4, 12, .5, 2], ['repair', 0, .03, .001, 2], ['wakeCooldown', 0, 100, 5, 2],
    ['speed', .05, 5, .05, 3], ['hour', 0, 23.95, .05, 3], ['rate', 0, 3, .1, 3],
    ['sleepHeal', 0, .02, .001, 4], ['sickSleepHeal', 0, .005, .0001, 4], ['illDrain', 0, .005, .0001, 4],
    ['sticky', 1, 10, .5, 5], ['decideevery', 1, 60, 1, 5],
    ['learnRate', .05, 1, .05, 7],
    ['previewGain', 0, 2, .05, 8], ['previewConfFloor', 0, .5, .05, 8], ['previewValFloor', 0, .3, .05, 8]];

    /* ============ Constants that are not sliders ============ */
    const DT = .05;                          // sim hours per tick (3 minutes)
    const UP = .7, LOW = .25;                // base upper (fall asleep) and lower (wake up) thresholds for sleep pressure
    const HOME = { v: .15, a: .3, d: .2 };        // the resting baseline mood that sleep repairs toward (also the starting baseline)
    // K = the magic numbers that used to be scattered through the code, each with what it means.
    const K = {
      ambValence: .8, ambArousal: .2, ambArousalBase: .3,   // ambiguous events: valence = .8 x baseline valence; arousal = .2 + .3 x baseline arousal
      domGainHalf: .5,         // dominance GAINS are multiplied by this while valence is not positive (situational: depends on current mood)
      sleepDeprivedBurn: .5,   // hunger loss is up to 50% faster at full sleep deprivation (per-state, sleep-debt-specific)
      tempIdeal: 20, tempRange: 15,                        // temperature comfort is 1 at 20 C and 0 at 15 degrees away
      coldBurn: .001, coldStress: .3, coldValence: .002,    // extra hunger per tick at zero comfort; below comfort .3, valence drops this much per tick
      needFloor: .4, needValence: .004, needArousal: .002,  // a meter below .4 starts to hurt: this much valence down and arousal up per tick at empty
      criticalDesperation: .5,   // OVERRIDE 3 fires when desperation(c) crosses this (was: c.h < .15 with desperFloor .3)
      // per-source unwell pushes (replace the old malaise aggregator). Each source pushes baseline mood directly,
      // like the `need` push in applyNeeds — not a pull-toward-target. unwell = s.dep + (s.ill?1:0) + (1-s.hp), range 0..3.
      unwellValence: .003,    // baseline valence drop per tick per unit of unwellness
      unwellLethargy: .0015,  // baseline arousal drop per tick per unit of unwellness (lethargy)
      unwellDominance: .002,  // baseline dominance drop per tick per unit of unwellness (low reactive dominance)
      sleepDebtAnhedonia: .4  // sleep-debt-specific: positive valence pulses shrink by up to this fraction at full sleep debt (Motomura 2013)
    };

    /* ============ Needs registry ============ */
    // Each need declares: key (state field name), label (display name; i18n key in t.needLabel if present,
    //   else the label string verbatim), color (chart/gauge colour), decayParam (which P.slider sets its
    //   decay rate), moodWeight (weight in the weighted-sum mood coupling), desperFloor (the threshold
    //   below which desperation starts climbing), builtin (true for hardcoded needs — can't be deleted).
    //   Adding a need: one entry here (builtin) OR via the Needs drawer (custom, persisted to localStorage).
    //   The agent gets s[key] = .8 on init for any need in NEEDS that isn't already set.
    // Aggregators (derived, not stored):
    //   needMood(c)     = Σ moodWeight × hurt(c[key])         → mood coupling (weighted sum, uses K.needFloor)
    //   desperation(c)  = max desperHurt(c[key])             → reckless, OVERRIDE 3, sleep wake (uses desperFloor)
    const BUILTIN_NEEDS = [
      { key: 'h', label: 'hunger', color: '#3d9a2a', decayParam: 'hrate', moodWeight: 1, desperFloor: .3, builtin: true },
    ];
    const NEEDS_KEY = 'moodbench_customNeeds_v1';
    const HIDDEN_BUILTIN_NEEDS_KEY = 'moodbench_hiddenBuiltinNeeds_v1';
    let loadCustomNeeds = () => { try { return JSON.parse(localStorage.getItem(NEEDS_KEY) || '[]'); } catch (e) { return []; } };
    let saveCustomNeeds = (arr) => { try { localStorage.setItem(NEEDS_KEY, JSON.stringify(arr)); } catch (e) { } };
    let loadHiddenBuiltinNeeds = () => { try { return new Set(JSON.parse(localStorage.getItem(HIDDEN_BUILTIN_NEEDS_KEY) || '[]')); } catch (e) { return new Set(); } };
    let saveHiddenBuiltinNeeds = (set) => { try { localStorage.setItem(HIDDEN_BUILTIN_NEEDS_KEY, JSON.stringify([...set])); } catch (e) { } };
    let CUSTOM_NEEDS = loadCustomNeeds();
    let HIDDEN_BUILTIN_NEEDS = loadHiddenBuiltinNeeds();
    let NEEDS = [...BUILTIN_NEEDS.filter(n => !HIDDEN_BUILTIN_NEEDS.has(n.key)), ...CUSTOM_NEEDS];
    // syncNeeds rebuilds NEEDS from the builtin registry (minus any hidden/deleted builtins) + custom needs.
    const syncNeeds = () => { NEEDS = [...BUILTIN_NEEDS.filter(n => !HIDDEN_BUILTIN_NEEDS.has(n.key)), ...CUSTOM_NEEDS]; };
    // restoreBuiltinNeed: un-hide a builtin need that was previously deleted (e.g. via the Add-need modal).
    const restoreBuiltinNeed = (key) => { HIDDEN_BUILTIN_NEEDS.delete(key); saveHiddenBuiltinNeeds(HIDDEN_BUILTIN_NEEDS); syncNeeds(); };
    const hurt = m => Math.max(0, K.needFloor - m) / K.needFloor;   // mood-coupling shape: 0 above needFloor, 1 at empty
    const desperHurt = (m, floor) => Math.max(0, Math.min(1, (floor - m) / floor));  // desperation shape: 0 above floor, 1 at empty
    // needMood / desperation read c[key] per registered need. A missing field (undefined) is treated as
    // "full" (1.0 = no deficit) so a need removed mid-session can't poison the aggregators with NaN.
    const needMood = c => NEEDS.reduce((sum, n) => sum + n.moodWeight * hurt(c[n.key] ?? 1), 0);
    const desperation = c => Math.max(0, ...NEEDS.map(n => desperHurt(c[n.key] ?? 1, n.desperFloor)));
    // cravingVector(s) = per-need deficit profile, keyed by need key, each 0..1. Vector form of desperation:
    // desperation collapses to a scalar (max), cravingVector keeps the per-need shape so an object's payoff
    // profile can be matched against it. Uses the SAME desperHurt shape + desperFloor per need — so a need
    // only registers as craved once it crosses its own desperation floor (not a flat linear deficit). A missing
    // need (s[key] undefined) → no deficit, so removed needs can't poison salience.
    const cravingVector = s => {
      const v = {};
      for (const n of NEEDS) v[n.key] = desperHurt(s[n.key] ?? 1, n.desperFloor);
      return v;
    };
    // salience(obj, s) = how relevant this object is to the agent's current deficits. Dot-product of the
    // object's need-payoff profile (obj.fulfills, auto-derived from its events' `needs` dicts — see
    // ARCHETYPES) with the agent's craving vector. Pure function of (obj.fulfills, s) — no side effects,
    // safe to call repeatedly for sorting. 0 = irrelevant right now (object fulfills no craved need).
    const salience = (obj, s) => {
      const crave = cravingVector(s);
      const f = obj.fulfills;
      if (!f) return 0;
      let sum = 0;
      for (const k in f) sum += f[k] * (crave[k] ?? 0);
      return sum;
    };
    const needLabel = n => t.needLabel?.[n.key] || n.label || n.key;
    // drainNeed: called by the environment to drain a need (e.g. energy via cold, sleep-dep burn).
    // Today no archetype uses it — the seam exists for when energy becomes a registered need.
    const drainNeed = (s, key, amount) => { s[key] = clamp01(s[key] - amount); };

    /* ============ Events ============ */
    // Each row: [group, key, valence impact, arousal impact, dominance impact].
    // Impact on the mood = impact x salience, where salience is CALCULATED dynamically in fireEvents (max of |impacts|, or max of |pulse amps| for events with custom pulses) — no longer hardcoded per event.
    // (The rustle row's impacts are ignored: it is "ambiguous", see EXTRA.)
    const RAW = [
      ['threat', 'predator_attack', -1, 1, -1],
      ['food', 'ate_food', .7, -.2, .3],
      ['social', 'social_win', .4, .5, .7], ['social', 'social_loss', -.4, .3, -.7],
      ['social', 'grooming_contact', .4, -.3, .1],
      ['env', 'loud_noise', -.3, .7, -.2], ['env', 'new_territory', .2, .6, .1], ['env', 'rustle', 0, 0, 0],
      ['body', 'pain', -.8, .6, -.3], ['body', 'illness_onset', -.5, -.4, -.3], ['body', 'recovery', .4, .2, .2],
      ['sleep', 'fell_asleep', .2, -.8, .1], ['sleep', 'woke_up', .1, .5, .1], ['sleep', 'sleep_interrupted', -.4, .6, -.2]
    ];
    // EXTRA = optional extra fields per event, kept as data next to the table above:
    //   amb = ambiguous: impact comes from the baseline mood (Mendl et al. 2010, Table 1).
    //   food = how much of the hunger meter it refills.   hp = health change.
    //   pulses = a list of {dim, amp, tau} that replaces the default pulses made from the impacts (see SHAPE below).
    //   act(w, s) = what the event does to the world w or the agent s. Manual clicks and random rows both run it.
    const EXTRA = {
      rustle: { amb: true, hide: true },   // hidden from grid. Textbook ambiguous stimulus (Mendl 2010 Table 1) — manual/custom only.
      ate_food: {
        needs: { h: .6 },                 // refills hunger by .6 on fire (saturation lives on the event, 1:1 — no global foodQuality)
        pulses: [{ dim: 'v', amp: .7, tau: 5 }, { dim: 'v', amp: .2, tau: 200 }, { dim: 'a', amp: -.2, tau: 10 }, { dim: 'd', amp: .3, tau: 50 }]
      },   // a joy spike, a long satisfied tail, a quick calm-down
      predator_attack: {
        hp: -.3,                    // the actual encounter — US for TYPE_TO_US.predator on approach.
        pulses: [{ dim: 'v', amp: -1, tau: 5 }, { dim: 'v', amp: -.25, tau: 500 }, { dim: 'a', amp: 1, tau: 10 }, { dim: 'a', amp: .2, tau: 200 }, { dim: 'd', amp: -1, tau: 30 }, { dim: 'd', amp: -.3, tau: 400 }]
      },   // a sharp jolt, then fear that lingers for minutes
      pain: { hp: -.2 },
      illness_onset: { hp: -.1, act: (w, s) => { s.ill = true; } },
      recovery: { hp: .1, act: (w, s) => { s.ill = false; } }
    };
    const EVENTS = RAW.map(([g, k, v, a, d]) => ({ g, k, v, a, d, ...EXTRA[k] }));   // g group, k key, v/a/d impacts. Salience is calculated dynamically in fireEvents (max of |v|/|a|/|d|, or max of |pulse amps| if the event has custom pulses).
    // SHAPE = the default pulses for an event without its own `pulses`, built from its v / a / d impacts.
    // Each dimension is a list of [share of the impact, tau in ticks]. Valence = a quick spike plus a slow tail; arousal fades fastest; dominance in between.
    const SHAPE = { v: [[.6, 8], [.4, 150]], a: [[1, 15]], d: [[1, 60]] };
    // EVENT_BY_KEY = lookup for any event by its key, including custom ones. Custom events are merged in
    // here (and re-merged on every load/create via syncEventByKey) so stepApproach's EVENT_BY_KEY[usKey]
    // can find custom events assigned to an archetype — without this, custom events fire from the
    // custom-events grid but never fire on approach.
    let EVENT_BY_KEY = Object.fromEntries(EVENTS.map(e => [e.k, e]));
    const syncEventByKey = () => { EVENT_BY_KEY = Object.fromEntries([...EVENTS, ...CUSTOM_EVENTS].map(e => [e.k, e])); };

    // EV = frozen map of event-key -> event-key string. Use EV.predator_attack (not the
    // string literal 'predator_attack') everywhere outside RAW / EVENTS / EXTRA (which are
    // the source-of-truth definitions and can't be "wrong" by construction). EV gives:
    //   (a) editor autocomplete — typing EV. shows the list of available event keys,
    //   (b) refactor support — rename in RAW and your IDE flags every reference,
    //   (c) discoverability — one place to see all event keys at a glance.
    // Caveat: in plain JS (no TypeScript / no checkJs), EV.predator_atkkack is still
    // `undefined` at runtime, same as the string-literal typo. The protection is editor-time
    // only; pair with checkJs / JSDoc-typed EV for static analysis.
    const EV = Object.freeze(Object.fromEntries(EVENTS.map(e => [e.k, e.k])));

    // (TYPE_TO_US removed — each ARCHETYPES entry now carries its own `events: [EV.xxx]` array,
    //  so stepApproach reads target.events directly. No more type→events indirection.)

    // Temperament: set by YOU, never changed by the simulation. Boldness + exploration are read by the curiosity/neophobia
    // formulas in decide() and ST.approach_object (via the curiosity() helper below). Activity / aggressiveness / sociability
    // are passed to rules as c.temperament but not read yet — reserved for future scaling of behaviour weights.
    // Axes after Réale et al. 2007, each 0..1 with 0.5 in the middle.
    const TEMP = { boldness: .5, exploration: .5, activity: .5, aggressiveness: .5, sociability: .5 };

    /* ============ Random events ============ */
    // Things that can happen by themselves. To add one, add a row:
    //   id     = a name for you
    //   event  = key of the event to fire (see RAW). Optional: a row can change the world without firing anything
    //   chance = probability per tick (10 ticks a second at speed 1), multiplied by the "random event rate" slider
    //   hp     = optional: true multiplies the chance by the agent's health (sick agents are worse at finding and winning)
    //   when   = the dependencies: a function of c that must be true. c.world = the environment, everything else = the agent
    //   act    = optional: act(w, s) changes the world w or the agent s when the row triggers (the fired event's own act runs too)
    const RANDOM = [
      // Food and predators spawn as surrounding objects (rates on each archetype's .spawns); US events fire via archetype.events on approach.
      // social
      { id: 'conspecific_arrives', chance: .006, when: c => c.world.conspecifics === 0 && !c.asleep, act: w => { w.conspecifics = 1; } },
      { id: 'conspecific_leaves', chance: .008, when: c => c.world.conspecifics > 0, act: w => { w.conspecifics--; } },
      { id: 'social_win', event: EV.social_win, chance: .007, hp: true, when: c => c.state === 'socialising' && c.world.conspecifics > 0 },
      { id: 'social_loss', event: EV.social_loss, chance: .010, when: c => c.state === 'socialising' && c.world.conspecifics > 0 },
      { id: 'grooming', event: EV.grooming_contact, chance: .004, when: c => c.state === 'idle' && c.world.conspecifics > 0 },
      // body (illness: see applyHealth for the full list of places it lives)
      { id: 'illness', event: EV.illness_onset, chance: .001, when: c => !c.asleep && !c.ill },
      { id: 'recover', event: EV.recovery, chance: .004, when: c => c.ill },
      // environment
      { id: 'new_territory', event: EV.new_territory, chance: .005, when: c => c.state === 'explore' },
      // loud noise: awake, it is just a noise. Asleep, it only registers (the mood hit) if it also wakes the sleeper.
      { id: 'loud_noise', event: EV.loud_noise, chance: .002, when: c => !c.asleep },
      { id: 'noise_wakes', event: EV.loud_noise, chance: .0006, when: c => c.asleep, act: () => wake(false) },
      { id: 'noise_stirs', chance: .0014, when: c => c.asleep, act: (w, s) => { s.a += .15; } }   // the other 70% of noises that reach a sleeper: it stirs (arousal bump) but sleeps on
    ];

    /* ============ Behaviour state machine ============ */
    // To add a behaviour, add one entry. Fields (all optional except col):
    //   col = chart colour. needs = map of need-key → decay multiplier (1 if missing). impact = multiplier on how hard events hit.
    //   push = added to the mood every tick, e.g. {v:.004}. tug = pulled toward a target every tick, e.g. {v:[target, strength]}.
    //   want = how much the agent wants this state right now. can = gate to ENTER it. stay = gate to REMAIN in it.
    //   sleep:true = a sleep stage: chosen by the sleep model below, never by decide(). repair = how strongly this stage heals the baseline.
    // c = what the rules can see, split into the agent's own state and the world:
    //   agent: c.h hunger meter, c.hp health, c.ill, c.v valence, c.a arousal (as displayed), c.d dominance,
    //          c.sat "full enough" level, c.state behaviour name, c.asleep, c.temperament (boldness + exploration read by curiosity() helper; others reserved)
    //   world: c.world = {light, conspecifics, temp, surrounding} — what is in the environment right now (predator / food are all surrounding objects now)

    // reckless(c) = desperation factor: 0 when fed, 1 at empty hunger. Drives reckless approach
    // (lower neophobia, higher curiosity, looser flee threshold) so hungry agents investigate things they'd
    // otherwise avoid. Kicks in gradually as needs rise (not just at the starving cliff) — h<0.3 starts
    // moving the needle; h=0.15 (the starving threshold for OVERRIDE 3) gives desper=0.5; h=0 gives desper=1.
    const reckless = c => desperation(c);
    // curiosity(c, mem) = {cur, neo, ev, desper} — the curiosity / neophobia / learned-valence terms used by OVERRIDE 5
    // in decide() and by ST.approach_object.can/want. Scales with desper: curiosity up to 2.5× at desper=1, neophobia
    // drops to 0 at desper=1. ev = expected valence (valence × confidence), the learned-value term.
    const curiosity = (c, mem) => {
      const desper = reckless(c);
      const nov = mem ? 1 / Math.sqrt(mem.count + 1) : 1;
      const cur = nov * (.3 + .7 * (c.temperament.boldness + c.temperament.exploration) / 2) * (1 + 1.5 * desper);
      const neo = nov * (1 - c.temperament.boldness) * .5 * (1 - desper);
      const ev = mem ? mem.valence * mem.conf : 0;
      return { cur, neo, ev, desper };
    };
    const ST = {
      idle: {
        col: '#7a8a99', tug: { a: [-.2, .02] }, want: c => 1, wanderRate: 0.0002,
      },   // idle: rare encounters (spawn rates live on each archetype's .spawns)
      foraging: {
        col: '#c9772b', needs: { h: 1.8 }, push: { a: .002 }, wanderRate: 0.0003,    // looks for food
        want: c => c.h < c.sat ? (1 - c.h) * 5 : .3,
      },   // foraging: moving around
      socialising: {
        col: '#d0488f', needs: { h: 1.6 }, push: { v: .004, a: .001 }, wanderRate: 0.0002,   // (renamed from "playing") social contact with conspecifics
        can: c => c.h > .25 && c.v > -.2, stay: c => c.h > .15, want: c => c.h * 1.5,
      },   // socialising: some movement
      explore: {
        col: '#4a9e6f', needs: { h: 1.2 }, push: { a: .001 }, wanderRate: 0.003,                           // free-time wandering, only when fed — primary env-change signal
        can: c => c.h > .4, want: c => c.h * (.5 + .5 * Math.max(0, c.a)),   // more aroused = more curious. TODO: also scale by c.temperament.exploration
      },   // explore: free-time wandering
      nrem: {
        col: '#3f5fb0', sleep: true, impact: .5, repair: .6, tug: { v: [0, .05], d: [0, .05], a: [-.5, .02] },   // deep sleep: calm, valence and dominance fade to 0
      },   // sleep: no new encounters (archetypes have no spawns in nrem)
      rem: {
        col: '#8a5fd0', sleep: true, impact: .5, repair: 1.4, tug: { v: [.1, .04], d: [0, .05], a: [.05, .03] }   // REM: arousal drifts up a little, mood repairs the most
      },
      approach_object: {
        col: '#e8a020', needs: { h: 1.5 },   //  agent approaches a perceived object it expects to be good (or is curious / desperate enough to investigate). Uses the curiosity() helper so hunger boosts curiosity and damp neophobia.
        can: c => { const t = eyes(c); if (!t) return false; const m = memory.get(featureKey(t.features)); const { cur, neo, ev } = curiosity(c, m); return ev + cur - neo > 0; },
        stay: c => !!eyes(c),
        want: c => { const t = eyes(c); if (!t) return 0; const m = memory.get(featureKey(t.features)); const { cur, neo, ev } = curiosity(c, m); return Math.max(ev + cur - neo, 0); },
      },
      flee_object: {
        col: '#e04040', needs: { h: 2.5 }, impact: 1.5, wanderRate: 0.0008,   //  agent flees a perceived object it expects to be bad — small chance of bolting into another env
        can: c => { const t = eyes(c); if (!t) return false; const m = memory.get(featureKey(t.features)); return m && m.valence < 0 && m.conf > 0.3; },
        stay: c => !!eyes(c),
        want: c => { const t = eyes(c); if (!t) return 0; const m = memory.get(featureKey(t.features)); if (!m || m.valence >= 0) return 0; return Math.abs(m.valence) * m.conf; },
      },
    };

    //  approach mechanics
    const APPROACH_TICKS = 5;   // how many ticks of approach_object before the US fires
    let lastPreviewedKey = null;    //  feature key of the last object we already fired a preview pulse for (so we don't keep re-firing while staring at the same thing)

    // stepApproach = handle approach_object completion. Called from tick() after stepSleepWake.
    // When approachTimer reaches APPROACH_TICKS: fire the US event (marked with fromApproach), consume the target.
    function stepApproach(s) {
      if (behaviour !== 'approach_object') { s.approachTimer = 0; return; }
      const target = eyes(s);
      if (!target) { behaviour = 'idle'; s.approachTimer = 0; return; }
      s.approachTimer = (s.approachTimer || 0) + 1;
      if (s.approachTimer < APPROACH_TICKS) return;
      // Approach complete!
      s.approachTimer = 0;
      const key = featureKey(target.features);   // the feature key the agent perceived — carried on the US event via `fromApproach`
      const usEvents = target.events || [];   // events array lives ON the target now (was TYPE_TO_US[target.underlyingType])
      if (usEvents.length > 0) {
        const usKey = usEvents[Math.floor(Math.random() * usEvents.length)];
        // Mark the US event with `fromApproach: key` so fireEvents knows:
        //   (a) this event came from an approach (not a manual click or RANDOM row)
        //   (b) which feature key to update in memory
        //   (c) measure the actual valence delta (before/after this event's pulses) as the teaching signal
        Q.push({ ...EVENT_BY_KEY[usKey], fromApproach: key });
      } else {
        // Neutral encounter — tiny curiosity bump, learn "this = nothing"
        s.a += 0.05;
        const entry = memory.get(key) || { valence: 0, conf: 0, count: 0, lastSeen: 0 };
        entry.valence += P.learnRate * (0 - entry.valence);
        entry.conf = Math.min(1, entry.conf + P.learnRate);
        entry.count++; entry.lastSeen = N;
        memory.set(key, entry);
      }
      W.surrounding = W.surrounding.filter(o => o.id !== target.id);   // consume the target
    }

    // previewPulse =  anticipatory affect. When attention locks onto an object, the mood shifts
    // based on the expected outcome stored in memory. Same multi-pulse shape as the matching US event
    // (spike + slow tail on each of v / a / d — like predator_attack / ate_food), but at ~30% of that
    // event's amplitude, gated by confidence (low-conf expectations aren't felt yet — curiosity / neophobia
    // still drive the decision to investigate). Fires ONCE PER ATTENTION SWITCH — staring at the same object
    // does not keep re-firing previews. Malaise dampers (anhedonia, blunting, reactive dominance) apply
    // exactly as they do to real events, so an unwell agent also feels a flattened preview.
    function previewPulse(target, s) {
      const key = featureKey(target.features);
      if (key === lastPreviewedKey) return;             // already previewed this exact feature-key this attention span
      const mem = memory.get(key);
      // Always mark the key as "seen" so we don't retry every tick — even when we skip the actual pulse.
      lastPreviewedKey = key;
      if (!mem) return;                                 // nothing learned yet → nothing to anticipate (curiosity handles it)
      const v = mem.valence, c = mem.conf, gain = P.previewGain;
      if (c < P.previewConfFloor) return;               // low-confidence expectation → not felt yet
      if (Math.abs(v) < P.previewValFloor) return;      // near-neutral valence → no anticipatory tint
      // 6 pulses: spike + tail on each dimension. Same shape as predator_attack / ate_food at ~30% amplitude.
      //   - Valence: tracks the expected sign and magnitude.
      //   - Arousal: rises for BOTH positive (excitement) and negative (wariness) valence — uses |v|.
      //   - Dominance: tracks valence sign (positive → in control; negative → small).
      const pulses = [
        { dim: 'v', amp: v * .25 * c * gain, tau: 4 },
        { dim: 'v', amp: v * .10 * c * gain, tau: 80 },
        { dim: 'a', amp: Math.abs(v) * .20 * c * gain, tau: 5 },
        { dim: 'a', amp: Math.abs(v) * .08 * c * gain, tau: 60 },
        { dim: 'd', amp: v * .15 * c * gain, tau: 20 },
        { dim: 'd', amp: v * .10 * c * gain, tau: 150 },
      ];
      // Apply the same sleep-debt anhedonia as fireEvents so previews flatten along with real events when sleep-deprived.
      const feltV = clamp(s.v + pulseSum().v);          // current felt valence (for situational domScale)
      const domScale = feltV <= 0 ? K.domGainHalf : 1;
      for (const p of pulses) {
        let amp = p.amp;
        if (p.dim === 'v') { amp *= P.pers; if (amp > 0) amp *= 1 - K.sleepDebtAnhedonia * s.dep; }
        if (p.dim === 'd' && amp > 0) amp *= domScale;
        PULSES.push({ dim: p.dim, amp, tau: p.tau, age: 0 });
      }
    }

    // Pick the next awake behaviour (never a sleep stage). Sets the global `behaviour`.
    function decide(c) {
      //  check the attended object for approach/flee decisions
      const target = eyes(c);
      const desper = reckless(c);                                    // 0 when fed, 1 at empty hunger — drives reckless approach
      if (target) {
        const mem = memory.get(featureKey(target.features));
        // OVERRIDE 2: strong negative memory → flee. The "strong negative" threshold slides with desperation —
        //   a fed agent (desper=0) flees anything val<-0.3; a desperate agent (desper=1) only flees val<-0.6.
        //   Predators (innate val=-0.7) still get fled even at desper=1, but mildly-negative objects get approached when starving.
        const fleeThreshold = -0.3 - 0.3 * desper;                   // -0.3 when fed → -0.6 when desperate
        if (mem && mem.valence < fleeThreshold && mem.conf > 0.5) { behaviour = 'flee_object'; return; }
        // OVERRIDE 3: starving → reckless approach of whatever's visible (desperation beats caution — the agent
        //   will try anything except strong negatives that OVERRIDE 2 caught). No target → foraging (need to find something).
        if (desperation(c) > K.criticalDesperation) { behaviour = 'approach_object'; return; }
        // OVERRIDE 4: strong positive memory → approach this object
        if (mem && mem.valence > 0.3 && mem.conf > 0.3) { behaviour = 'approach_object'; return; }   // lowered from 0.5 — pre-seed conf=0.3 should trigger
        // OVERRIDE 5: Unknown or low-confidence object + curiosity > neophobia → approach. Curiosity is boosted
        //   and neophobia is damped by desperation, so hungry agents investigate things they'd otherwise avoid.
        if (!mem || mem.conf < 0.5) {
          const { cur, neo } = curiosity(c, mem);  
          if (cur > neo && cur > 0.3) { behaviour = 'approach_object'; return; }
        }
      } else {
        if (desperation(c) > K.criticalDesperation) { behaviour = 'foraging'; return; }
      }
      const def = ST[behaviour];
      if (def.stay && !def.stay(c)) behaviour = 'idle';
      const w = {}; let sum = 0;                                    // w = weight of each candidate state
      for (const k in ST) {
        if (ST[k].sleep) continue;                                  // sleep is handled by the sleep model
        if (k !== behaviour && ST[k].can && !ST[k].can(c)) continue;   // entry gate
        w[k] = Math.max(0, ST[k].want(c)) * (k === behaviour ? P.sticky : 1);
        sum += w[k];
      }
      let r = Math.random() * sum;                                  // weighted random pick
      for (const k in w) { r -= w[k]; if (r <= 0) { behaviour = k; break; } }
    }

    /* ============ Body clock and light ============ */
    // daylight = sun brightness 0..1 for a world hour: dark before 06:00 and after 18:00, brightest at noon
    const daylight = h => Math.max(0, Math.sin((h - 6) / 12 * Math.PI));
    // bodyClock = Process C, scaled to about -1..+1. A sine plus a 2nd harmonic gives the skewed shape.
    // The 8.4 puts the trough at about 04:00 and the peak at about 13:00.
    const bodyClock = h => { const x = 2 * Math.PI * (h - 8.4) / 24; return (Math.sin(x) + .3 * Math.sin(2 * x)) / 1.137; };

    /* ============ Simulation state ============ */
    // S = the AGENT's own state.
    //   v/a/d = valence, arousal, dominance (the layer that behaviour and needs push on; event effects are separate, in PULSES). bv/ba/bd = their baselines (slow layer, "b" for baseline).
    //   h = hunger meter (1 full, 0 starving).  hp = health (1 healthy).  ill = is it ill?
    //   sp = sleep pressure (Process S).  ct = body-clock time in hours.  asleep = sleeping now?
    //   tin = hours asleep this episode.  ut = minutes into the current sleep cycle.
    //   slept = hours slept since the daily ledger last closed (12:00 on the body clock).  dbt = sleep debt in hours.
    //   dep = sleep deprivation 0..1.  cool = ticks before it may fall asleep again.  led = has today's ledger closed already?
    // W = the WORLD: what is in the environment right now. Kept apart from the agent.
    // behaviour = name of the current behaviour (a key of ST).
    let S, W, behaviour;
    // H = history (last 600 ticks), N = tick counter, M = chart marks (one per tick that fired events),
    // Q = events waiting for the next tick, LOG = recent events for the list under the chart, evSeq = running event number,
    // PULSES = event effects still fading, each {dim, amp, tau, age}
    let H, N, M, Q, LOG, evSeq, PULSES;
    const MARKS = [];   // MARKS = where each number tag sits on the timeline (rebuilt in place every frame, hence const)

    /* ---- Custom events (user-defined, saved to localStorage) ---- */
    // Each entry is a full event object (same shape as EVENTS entries from RAW+EXTRA merged): {g, k, v, a, d, food?, hp?}.
    // Pushed directly to Q when the user clicks the button. The v/a/d impacts build default pulses via SHAPE
    // (no custom pulse list — for custom pulse shapes, use the one-off custom event composer above the grid).
    let CUSTOM_EVENTS = [];
    const CUSTOM_EVENTS_KEY = 'moodbench_customEvents_v1';
    const loadCustomEvents = () => { try { CUSTOM_EVENTS = JSON.parse(localStorage.getItem(CUSTOM_EVENTS_KEY) || '[]'); } catch (e) { CUSTOM_EVENTS = []; } };
    const saveCustomEvents = () => { try { localStorage.setItem(CUSTOM_EVENTS_KEY, JSON.stringify(CUSTOM_EVENTS)); } catch (e) { } };
    loadCustomEvents();   // load on script init
    syncEventByKey();     // merge custom events into EVENT_BY_KEY so the archetype dropdown + stepApproach can find them

    // Random-event chances persistence — save tweaked per-tick chances to localStorage so they survive reloads.
    // Stored as {id: per-tick-chance}. loadRandomChances applies them to RANDOM rows on init; the UI input
    // handler calls saveRandomChances after each edit. (The global 'rate' slider is a separate multiplier on top.)
    const RANDOM_CHANCES_KEY = 'moodbench_randomChances_v1';
    const loadRandomChances = () => { try { const saved = JSON.parse(localStorage.getItem(RANDOM_CHANCES_KEY) || '{}'); for (const r of RANDOM) if (saved[r.id] !== undefined) r.chance = saved[r.id]; } catch (e) { } };
    const saveRandomChances = () => { try { localStorage.setItem(RANDOM_CHANCES_KEY, JSON.stringify(Object.fromEntries(RANDOM.map(r => [r.id, r.chance])))); } catch (e) { } };
    loadRandomChances();   // load on script init
    let run = true, circOn = true, clock = true;
    // Custom event composer state. Declared here (above init) so init() can wipe customQueue on Reset.
    // No per-dim defaults — each queued spike starts neutral (amp=0, τ=10) and is adjusted inline.
    const customQueue = [];               // staged pulses: each {dim, amp, tau}. Pushed as one custom event's `pulses` on Fire.
    // customFx = staged side effects for the composed event: hp change + per-need refills. Same lifecycle
    // as customQueue (wiped on Reset / Clear / Random, read on Fire / Save). Rebuilt from NEEDS each
    // render so newly-added needs get a slider without restarting. Stored as {hp: number, needs: {key: amt}}.
    const customFx = { hp: 0, needs: {} };

    /* ============ Surrounding objects (Surrounding objects) ============ */
    // Each object in W.surrounding has:
    //   id              — unique monotonic id for tracking
    //   name            — the archetype key (e.g. 'wolf', 'berry_bush'). Mainly for UI/debugging.
    //   features       — {size, color, shape}, the perceptual features the agent learns to associate
    //   events          — array of event keys that fire when this object is approached (was: underlyingType → TYPE_TO_US lookup)
    //   ttl             — ticks until despawn
    //   age             — ticks since spawned
    // Spawned here; read by perceive() / select() / previewPulse() / stepApproach() / renderSurrounding().
    let nextObjectId = 1;
    const SURR_FEATURES = {
      size: ['small', 'medium', 'large'],
      color: ['dark', 'red', 'green', 'blue', 'brown'],
      shape: ['round', 'angular', 'animal', 'plant'],
    };
    const SURR_COLOR_HEX = { dark: '#222', red: '#d33', green: '#3a3', blue: '#36c', brown: '#a52' };
    const SURR_SIZE_PX = { small: 14, medium: 18, large: 22 };
    // ARCHETYPES = the catalog of named object types the world can spawn. Each entry has:
    //   features         — {size, color, shape} perceptual identity (must be unique per archetype, since memory
    //                      keys are derived from featureKey(features) — collisions = ambiguous learning signal)
    //   events           — array of event keys that fire when this object is approached. Empty = neutral (no US,
    //                      stepApproach handles inline with a curiosity bump + "this = nothing" memory update).
    //                      Multiple = the approach picks one at random (e.g. rival → social_loss or social_win).
    //   innateValence?   — if set, the agent is born expecting this much valence from this feature pattern.
    //   innateConf?      — confidence of the innate expectation (defaults to 0.3 if omitted).
    //   fulfills         — auto-derived at init from the events' `needs` dicts (see the derive loop below).
    //                      Hand-authoring it overrides the auto-derive.
    //   surroundAgeRate? — how fast this object's TTL ages per tick (default 1). The flee/approach target overrides
    //                      in stepSurrounding still apply on top. Tune live via the despawn input in the bestiary.
    //   (Spawn rates USED to live here as arch.spawns — they have moved to ENVIRONMENTS, since which objects
    //    spawn where is a property of the environment, not the object type. See the Environment drawer.)
    // INNATE_MEMORY is auto-derived from ARCHETYPES (see below).
    const ARCHETYPES = {
      // ── predators (innate wariness of large dark animal shapes — pre-seeded with valence -0.7, conf 0.6) ──
      wolf: { features: { size: 'large', color: 'dark', shape: 'animal' }, events: [EV.predator_attack], innateValence: -.7, innateConf: .6 },
      fox: { features: { size: 'medium', color: 'red', shape: 'animal' }, events: [EV.predator_attack] },
      owl: { features: { size: 'small', color: 'dark', shape: 'animal' }, events: [EV.predator_attack] },
      // ── food (innate attraction to small green round shapes — pre-seeded valence +0.5, conf 0.3) ──
      berry_bush: { features: { size: 'small', color: 'green', shape: 'round' }, events: [EV.ate_food], innateValence: .5, innateConf: .3 },
      nut: { features: { size: 'small', color: 'brown', shape: 'round' }, events: [EV.ate_food] },
      // ── social ──
      friend: { features: { size: 'small', color: 'brown', shape: 'animal' }, events: [EV.grooming_contact] },
      rival: { features: { size: 'medium', color: 'red', shape: 'angular' }, events: [EV.social_loss, EV.social_win] },   // 50/50 win-or-lose
      // ── environment / novelty ──
      cracker: { features: { size: 'small', color: 'brown', shape: 'angular' }, events: [EV.loud_noise] },
      // ── body (healing / sickness) ──
      herb: { features: { size: 'medium', color: 'green', shape: 'plant' }, events: [EV.recovery] },
      rotten_food: { features: { size: 'small', color: 'brown', shape: 'plant' }, events: [EV.illness_onset] },
      // ── neutral (no US — approach produces a tiny curiosity bump + "this = nothing" memory update) ──
      pebble: { features: { size: 'small', color: 'dark', shape: 'round' }, events: [] },
      // ── water (neutral — thirst removed, so water fulfills nothing; exists for the RIVER "many objects, none salient" test) ──
      water: { features: { size: 'large', color: 'blue', shape: 'round' }, events: [] },
    };

    /* ============ ENVIRONMENTS ============
    // Each ENVIRONMENT owns its own spawn table, temperature range, and movement profile. W.environment selects
    // which env is active; stepSurrounding reads the active env's .spawns (NOT arch.spawns — that's now the base
    // rate used by the bestiary grid and as a fallback only). The agent's "explore" behaviour doubles as the
    // attempting-to-change-env signal: while exploring, a wander roll (rate = ST.explore.wanderRate ×
    // env.leaveFactor) fires pickEnvironment() — a weighted-random pick over the OTHER envs' enterWeights.
    //
    // Each entry:
    //   spawns      — { archName: perTickRate }. The active env's spawns are summed each tick in stepSurrounding
    //                 and a single weighted-pick selects which archetype spawns (rate is now behaviour-
    //                 independent — the old per-state table was flattened; the peak state rate was kept as the
    //                 flat rate so nothing spawns less often than before). 0 / missing = never spawns.
    //   tempRange   — [min, max] °C the env's temperature oscillates between across the day cycle. The day cycle
    //                 (deriveWorld) interpolates within this range; the env sets the range, the clock sets the phase.
    //   enterWeight  — weight in pickEnvironment()'s weighted-random reroll. 0 = unreachable (VOID).
    //   leaveFactor  — multiplier on the behaviour's wanderRate. 0 = cannot leave (VOID, safety net).
    //   label       — display name. For builtins this is the i18n key (t.env[key]); for custom envs it's the
    //                 user-editable string. Custom envs additionally carry builtin:false.
    // Persistence: ENVIRONMENTS is a `let`, overlaid with edits + custom envs + builtin deletions saved to
    // localStorage (loadEnvEdits/saveEnvEdits below — same pattern as custom events). Builtin edits persist as
    // field diffs; custom envs are stored whole; deleted builtins are tracked in ENV_DELETED (a persisted set of
    // keys) so deleting a builtin survives reload. ENV_KEYS is rebuilt after any add/remove.
    // Authoring: to add a builtin env, add an entry to ENV_DEFAULTS. To add one at runtime, use the drawer. */
    const ENV_DEFAULTS = {
      burrow: {
        label: 'Burrow', builtin: true,
        tempRange: [16, 22], enterWeight: 0.5, leaveFactor: 1.4,     // hard-ish to find, easy to leave
        spawns: { friend: 0.002, rival: 0.0008, herb: 0.00003, nut: 0.0003 },   // peak state rate per archetype (flattened)
      },
      plains: {
        label: 'Plains', builtin: true,
        tempRange: [10, 28], enterWeight: 1, leaveFactor: 1,
        spawns: { berry_bush: 0.005, pebble: 0.002, rotten_food: 0.0008, owl: 0.0003 },   // berry_bush peaks in foraging, pebble in explore
      },
      forest: {
        label: 'Forest', builtin: true,
        tempRange: [8, 20], enterWeight: 0.8, leaveFactor: 0.8,     // denser — slightly harder to push through
        spawns: { nut: 0.004, berry_bush: 0.0008, wolf: 0.0003, fox: 0.0003 },   // nut peaks in foraging
      },
      river: {
        label: 'River', builtin: true,
        tempRange: [8, 18], enterWeight: 0.7, leaveFactor: 1.2,
        spawns: { water: 0.03, pebble: 0.015 },   // water + pebble dominate — "many objects, none salient" test env
      },
      void: {
        label: 'Void', builtin: true,
        tempRange: [0, 0], enterWeight: 0, leaveFactor: 0,           // unreachable test env (enterWeight 0 = never picked)
        spawns: {},
      },
    };
    // ENVIRONMENTS = the live env table. Start from defaults (minus any deleted builtins), then overlay persisted
    // edits + custom envs. saveEnvEdits writes field diffs for builtins, whole objects for custom envs, and the
    // ENV_DELETED set so builtin deletions persist. v2 key — the old per-state shape is gone; v1 data is discarded.
    const ENVIRONMENTS_KEY = 'moodbench_environments_v2';
    let ENV_DELETED = new Set();   // keys of builtins the user deleted (persisted, so they stay gone on reload)
    let ENVIRONMENTS = JSON.parse(JSON.stringify(ENV_DEFAULTS));   // deep clone so live edits don't mutate defaults
    const loadEnvEdits = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(ENVIRONMENTS_KEY) || '{}');
        ENV_DELETED = new Set(saved.__deleted || []);
        for (const k of ENV_DELETED) delete ENVIRONMENTS[k];   // drop deleted builtins
        for (const [k, v] of Object.entries(saved)) {
          if (k === '__deleted') continue;
          if (ENV_DEFAULTS[k]) Object.assign(ENVIRONMENTS[k], v);   // builtin: overlay saved fields (spawns, temp, etc.)
          else ENVIRONMENTS[k] = v;                                   // custom env: add whole
        }
      } catch (e) { /* corrupt store → fall back to defaults */ }
    };
    const saveEnvEdits = () => {
      try {
        const out = {};
        if (ENV_DELETED.size) out.__deleted = [...ENV_DELETED];
        for (const [k, v] of Object.entries(ENVIRONMENTS)) {
          const def = ENV_DEFAULTS[k];
          if (!def) out[k] = v;                                       // custom env: store whole
          else {
            // builtin: store only fields that differ from the default (so a default reset wipes edits)
            const diff = {};
            if (JSON.stringify(v.spawns) !== JSON.stringify(def.spawns)) diff.spawns = v.spawns;
            if (JSON.stringify(v.tempRange) !== JSON.stringify(def.tempRange)) diff.tempRange = v.tempRange;
            if (v.enterWeight !== def.enterWeight) diff.enterWeight = v.enterWeight;
            if (v.leaveFactor !== def.leaveFactor) diff.leaveFactor = v.leaveFactor;
            if (v.label !== def.label) diff.label = v.label;
            if (Object.keys(diff).length) out[k] = diff;
          }
        }
        localStorage.setItem(ENVIRONMENTS_KEY, JSON.stringify(out));
      } catch (e) { }
    };
    loadEnvEdits();   // load on script init
    let ENV_KEYS = Object.keys(ENVIRONMENTS);
    const DEFAULT_ENV = 'plains';

    function objectSvg(features) {
      const sz = SURR_SIZE_PX[features.size], col = SURR_COLOR_HEX[features.color];
      let inner;
      if (features.shape === 'round') inner = `<circle cx="${sz / 2}" cy="${sz / 2}" r="${sz / 2 - 1}" fill="${col}"/>`;
      else if (features.shape === 'angular') inner = `<rect x="1" y="1" width="${sz - 2}" height="${sz - 2}" fill="${col}"/>`;
      else if (features.shape === 'plant') inner = `<ellipse cx="${sz / 2}" cy="${sz / 2}" rx="${sz / 3}" ry="${sz / 2 - 1}" fill="${col}"/>`;   // plant = leaf-shaped ellipse
      else inner = `<polygon points="${sz / 2},1 ${sz - 1},${sz - 1} 1,${sz - 1}" fill="${col}"/>`;   // animal = triangle
      return `<svg width="${sz}" height="${sz}" aria-hidden="true">${inner}</svg>`;
    }

    function randomFeatures() {
      const pick = arr => arr[Math.floor(Math.random() * arr.length)];
      return { size: pick(SURR_FEATURES.size), color: pick(SURR_FEATURES.color), shape: pick(SURR_FEATURES.shape) };
    }

    // (Spawn rates live on each ENVIRONMENT's flat .spawns field — { archName: perTickRate } — see ENVIRONMENTS
    // above. The active env's spawns drive the live loop in stepSurrounding: sum all rates, roll once, weighted-
    // pick the archetype. Behaviour-dependence was removed when the table was flattened — one rate per archetype.)

    // Signature changed: takes the archetype NAME (looked up in ARCHETYPES), not (features, underlyingType).
    function spawnObject(name, ttl = 200) {
      if (W.surrounding.length >= 20) return;   // cap at 20 visible objects so the panel doesn't explode
      const arch = ARCHETYPES[name];
      if (!arch) return;
      W.surrounding.push({ id: nextObjectId++, name, features: arch.features, events: arch.events, fulfills: arch.fulfills, ttl, age: 0 });
    }

    // pickEnvironment() = weighted-random pick over the envs the agent COULD enter, excluding the current one.
    // Weights = each env's enterWeight; envs with enterWeight 0 (e.g. VOID) are unreachable and never picked.
    // Forward-compat seam: currently pure-random by enterWeight. When env-memory + craving-weighted choice
    // land later, this is the single function to edit — callers (the wander roll) don't need to change.
    function pickEnvironment() {
      const candidates = ENV_KEYS.filter(k => k !== W.environment && (ENVIRONMENTS[k].enterWeight ?? 0) > 0);
      const total = candidates.reduce((sum, k) => sum + ENVIRONMENTS[k].enterWeight, 0);
      if (total <= 0) return null;                                          // no reachable env → stay put
      let r = Math.random() * total;
      for (const k of candidates) {
        r -= ENVIRONMENTS[k].enterWeight;
        if (r <= 0) return k;
      }
      return candidates[candidates.length - 1];
    }

    // changeEnvironment(to) = swap the active env, clear surrounding objects (the agent left — they don't follow),
    // and log the change (with the triggering behaviour) so env swaps are observable in the event log.
    function changeEnvironment(to, via = behaviour) {
      const from = W.environment;
      if (!ENVIRONMENTS[to] || to === from) return false;
      W.environment = to;
      W.surrounding = [];                          // left the old env → its objects are no longer visible
      lastPreviewedKey = null;                      // clear so the first object in the new env triggers a fresh preview
      LOG.unshift({ id: ++evSeq, time: fmt('hour', W.hour), k: [], env: { from, to, via } });   // env-change row in the log (no event chips)
      if (LOG.length > 200) LOG.pop();   // same cap as event LOG — env changes share the strip and need hover detail too
      if (typeof renderEnvironments === 'function') renderEnvironments();   // re-render drawer so the active highlight moves (wander-roll swaps too)
      return true;
    }

    // Called from tick() after stepWorld(). Takes s so the preview pulse can apply the sleep-debt anhedonia damper (K.sleepDebtAnhedonia × s.dep).
    function stepSurrounding(s) {
      // Spawn: read the ACTIVE env's flat spawn table {arch: perTickRate}. Sum the rates, roll once, weighted-pick
      // which archetype spawns. (Rate is behaviour-independent now — the old per-state table was flattened.)
      const env = ENVIRONMENTS[W.environment];
      const entries = Object.entries(env?.spawns ?? {});
      const totalRate = entries.reduce((sum, [, r]) => sum + r, 0);
      if (totalRate > 0 && Math.random() < totalRate) {
        let r = Math.random() * totalRate;
        for (const [name, rate] of entries) {
          r -= rate;
          if (r <= 0) { spawnObject(name); break; }
        }
      }
      // Wander roll: "explore" doubles as the attempting-to-change-env signal. The per-tick chance is the
      // behaviour's wanderRate × the active env's leaveFactor. Firing it picks a new env via pickEnvironment().
      // (Accidental swaps while fleeing are possible — fleeing keeps the wander roll, just at a lower rate.
      // VOID is unreachable: enterWeight 0 excludes it from pickEnvironment, leaveFactor 0 pins anything stuck.)
      const wanderRate = (ST[behaviour]?.wanderRate ?? 0) * (env?.leaveFactor ?? 1);
      if (wanderRate > 0 && Math.random() < wanderRate) {
        const next = pickEnvironment();
        if (next) changeEnvironment(next, behaviour);
      }
      // Age: each object's TTL ages at its archetype's surroundAgeRate (default 1). The flee/approach target
      // overrides still apply on top — fleeing makes the pursued target leave fast, approaching freezes it.
      const target = eyes(s);
      for (const obj of W.surrounding) {
        const arch = ARCHETYPES[obj.name];
        let rate = arch?.surroundAgeRate ?? 1;
        if (behaviour === 'flee_object' && target && obj.id === target.id) rate = Math.max(rate, 5);   // fleeing → target leaves view fast
        if (behaviour === 'approach_object' && target && obj.id === target.id) rate = 0;                // approaching → target stays until reached
        obj.age += rate;
      }
      W.surrounding = W.surrounding.filter(obj => obj.age < obj.ttl);
      //  fire a preview pulse when attention switches to a new object (or to anything after a gap).
      const tgt = eyes(s);
      if (tgt) previewPulse(tgt, s);
      else lastPreviewedKey = null;   // nothing visible → next spawn triggers a fresh preview
    }

    // Called every frame from readout() — small list, cheap to rebuild.
    function renderSurrounding() {
      const list = $('#surroundingList');
      if (!list) return;
      list.innerHTML = W.surrounding.length === 0
        ? `<small>${t.surrEmpty}</small>`
        : W.surrounding.map(obj => {
          const feats = `${t.feat.size[obj.features.size]} · ${t.feat.color[obj.features.color]} · ${t.feat.shape[obj.features.shape]}`;
          return `<div class="surrItem">${objectSvg(obj.features)} ${feats} <span class="type">${obj.name}</span><span class="ttl">${obj.ttl - obj.age}t</span></div>`;
        }).join('');
    }

    /* ============ Memory & learning  ============ */
    // memory = Map from feature-string to {valence, conf, count, lastSeen}.
    //   valence  = -1..+1, the learned affect (Rescorla-Wagner running average of actual outcomes)
    //   conf     = 0..1, confidence (grows with each encounter, shrinks with contradiction)
    //   count    = how many times this feature-pattern has been encountered
    //   lastSeen = tick of last encounter (for future forgetting / decay)
    
    // The agent never sees the archetype name; it only sees features. Memory links features to expected valence.
    let memory = new Map();

    // featureKey = hash the features object into a string key for the Map (e.g. "large|dark|animal").
    function featureKey(features) {
      return `${features.size}|${features.color}|${features.shape}`;
    }

    // INNATE_MEMORY = auto-derived from ARCHETYPES. Any archetype with `innateValence` set becomes an innate
    // pre-seed entry. Evolutionary predispositions that experience can reinforce (push conf toward 1.0) or override
    // (if a wolf turns out friendly). The wolf entry has HIGH conf (0.6) so OVERRIDE 2 in decide() fires
    // flee_object on first sight. Berry_bush stays at low conf (0.3) — curiosity can still beat innate attraction
    // on first encounter, which is fine because approaching food is rewarded, not punished.
    // (To add more innate predispositions, set `innateValence` + `innateConf` on the archetype entry.)
